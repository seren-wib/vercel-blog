<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><defs><style>.t{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;fill:#374151}.m{font-family:'JetBrains Mono',Consolas,'D2Coding',monospace;fill:#374151}.s{font-size:13px;fill:#8A8F98;font-style:italic}</style></defs><rect width="1200" height="360" fill="#FFFFFF"/><text x="32" y="44" class="t" font-size="22" font-weight="700">네이버 블로그 글 한 편의 구조</text><rect x="32" y="70" width="1136" height="262" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="52" y="100" class="t" font-size="17" font-weight="700">top document</text><text x="190" y="100" class="m" font-size="14">blog.naver.com/&lt;id&gt;/&lt;logNo&gt;</text><text x="52" y="124" class="m" font-size="14">document.body.innerText = 0자</text><text x="52" y="146" class="t s">비유: 비어 있는 겉봉투</text><rect x="420" y="112" width="728" height="200" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="440" y="142" class="t" font-size="17" font-weight="700">iframe name="mainFrame"</text><text x="440" y="166" class="m" font-size="14">PostView.naver?blogId=...&amp;logNo=...</text><text x="440" y="188" class="t s">비유: 안쪽 봉투</text><rect x="440" y="204" width="330" height="88" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/><text x="456" y="232" class="m" font-size="14">.se-main-container</text><text x="456" y="256" class="t" font-size="14">본문 (옛 편집기: #postViewArea)</text><text x="456" y="278" class="t" font-size="14">테스트: 1,530자, 2,404자</text><rect x="790" y="204" width="338" height="88" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/><text x="806" y="232" class="m" font-size="14">.se-title-text  .nick</text><text x="806" y="256" class="m" font-size="14">.se_publishDate</text><text x="806" y="278" class="t" font-size="14">제목, 작성자, 작성일</text><text x="52" y="200" class="t" font-size="14">fetch는 여기까지만 받는다</text><text x="52" y="224" class="t" font-size="14">브