<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="Pretendard, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="330" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Left: CPU direct -->
  <rect x="14" y="14" width="356" height="302" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="192" y="44" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">1. CPU direct transfer</text>

  <rect x="26" y="150" width="72" height="44" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="62" y="177" text-anchor="middle" font-size="12" fill="#1e293b">I/O device</text>
  <rect x="112" y="150" width="72" height="44" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text x="148" y="177" text-anchor="middle" font-size="12" fill="#1e293b">Controller</text>
  <rect x="198" y="150" width="72" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="234" y="177" text-anchor="middle" font-weight="bold" fill="#991b1b">CPU</text>
  <rect x="284" y="150" width="72" height="44" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="320" y="177" text-anchor="middle" font-size="12" fill="#1e293b">Memory</text>
  <line x1="98" y1="172" x2="110" y2="172" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="184" y1="172" x2="196" y2="172" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="172" x2="282" y2="172" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M 320 150 L 320 112 L 148 112 L 148 146" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="234" y="104" text-anchor="middle" fill="#dc2626">repeat for every piece of data</text>

  <text x="30" y="228" fill="#334155">(1) controller prepares part of the data</text>
  <text x="30" y="248" fill="#334155">(2) CPU reads it from the controller</text>
  <text x="30" y="268" fill="#334155">(3) CPU writes it to memory</text>
  <text x="30" y="296" font-weight="bold" fill="#dc2626">CPU is busy for the whole transfer</text>

  <!-- Right: DMA -->
  <rect x="390" y="14" width="356" height="302" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="568" y="44" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">2. DMA transfer</text>

  <rect x="568" y="62" width="84" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="610" y="87" text-anchor="middle" font-weight="bold" fill="#1e293b">CPU</text>
  <text x="662" y="80" font-size="12" fill="#16a34a">runs other</text>
  <text x="662" y="95" font-size="12" fill="#16a34a">instructions</text>

  <rect x="402" y="190" width="72" height="44" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="438" y="217" text-anchor="middle" font-size="12" fill="#1e293b">I/O device</text>
  <rect x="488" y="190" width="72" height="44" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text x="524" y="217" text-anchor="middle" font-size="12" fill="#1e293b">Controller</text>
  <rect x="574" y="190" width="72" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="610" y="217" text-anchor="middle" font-weight="bold" fill="#166534">DMA</text>
  <rect x="660" y="190" width="72" height="44" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="696" y="217" text-anchor="middle" font-size="12" fill="#1e293b">Memory</text>
  <line x1="474" y1="212" x2="486" y2="212" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="560" y1="212" x2="572" y2="212" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="646" y1="212" x2="658" y2="212" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <line x1="596" y1="102" x2="596" y2="186" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="586" y="132" text-anchor="end" fill="#1d4ed8" font-weight="bold">(1) set up</text>
  <text x="586" y="150" text-anchor="end" font-size="12" fill="#1d4ed8">address, size,</text>
  <text x="586" y="165" text-anchor="end" font-size="12" fill="#1d4ed8">direction</text>
  <line x1="626" y1="188" x2="626" y2="106" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="636" y="140" fill="#dc2626" font-weight="bold">(3) interrupt</text>
  <text x="636" y="156" font-size="12" fill="#dc2626">when done</text>

  <text x="568" y="260" text-anchor="middle" fill="#166534" font-weight="bold">(2) DMA moves the data directly</text>
  <text x="568" y="296" text-anchor="middle" font-weight="bold" fill="#16a34a">CPU only sets up and handles the result</text>
</svg>
