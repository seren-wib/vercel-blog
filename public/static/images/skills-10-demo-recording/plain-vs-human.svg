<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="1200" height="360" fill="#FFFFFF"/><text x="32" y="44" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#374151" text-anchor="start">그냥 녹화한 영상과 human.cjs를 얹은 영상</text><text x="32" y="82" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="15" font-weight="700" fill="#374151" text-anchor="start">plain Playwright</text><rect x="32" y="96" width="540" height="200" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="46" y="124" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="17" font-weight="700" fill="#8E2A20" text-anchor="start">recordVideo only</text><text x="46" y="146" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 투명인간이 조작하는 화면</text><text x="46" y="168" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">pointer: 영상에 안 찍힘</text><text x="46" y="190" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">mouse.move(x, y): 한 번에 순간이동</text><text x="46" y="212" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">fill(text): 글자가 한꺼번에 나타남</text><text x="46" y="234" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">click(): 어디를 눌렀는지 안 보임</text><line x1="572" y1="196" x2="628" y2="196" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="628" y="82" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="15" font-weight="700" fill="#374151" text-anchor="start">demo-recording</text><rect x="628" y="96" width="540" height="200" rx="10" fill="#E7F6EE" stroke="#2F9461" stroke-width="1.6"/><text x="642" y="124" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="17" font-weight="700" fill="#1E6B44" text-anchor="start">recordVideo + human.cjs</text><text x="642" y="146" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 사람 손이 보이는 화면</text><text x="642" y="168" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">cursorScript: DOM에 그린 pointer (arrow·hand·I-beam)</text><text x="642" y="190" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">leg(): cubic Bezier 곡선 + tremor + overshoot</text><text x="642" y="212" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">type(): 한 글자씩, 간격은 불규칙</text><text x="642" y="234" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">scroll(): 40~90 px wheel step</text><text x="32" y="336" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">클릭 효과(원, 파동)는 넣지 않는다. pointer는 OS pointer처럼 모양만 바뀐다.</text></svg>
