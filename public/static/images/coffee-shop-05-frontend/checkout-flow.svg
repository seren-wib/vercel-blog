<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" font-family='Pretendard, "Apple SD Gothic Neo", -apple-system, Helvetica, Arial, sans-serif' font-size="13">
<rect width="980" height="400" fill="#ffffff" rx="8"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#475569"/></marker></defs>
<text x="20" y="32" font-size="17" font-weight="bold" fill="#1e293b">Checkout: first press creates the order, later presses only pay</text>
<text x="20" y="52" font-size="12" fill="#64748b">CheckoutPage → lib/pay.js → CheckoutResultPage</text>
<rect x="20" y="90" width="200" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="120" y="116" text-anchor="middle" font-weight="bold" fill="#1e3a8a">first press</text><text x="120" y="134" text-anchor="middle" font-size="12" fill="#1d4ed8">POST /api/orders/</text>
<rect x="20" y="180" width="200" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="120" y="206" text-anchor="middle" font-weight="bold" fill="#1e3a8a">later presses</text><text x="120" y="224" text-anchor="middle" font-size="12" fill="#1d4ed8">same order id</text>
<rect x="290" y="130" width="220" height="70" rx="8" fill="#fffbeb" stroke="#fcd34d"/><text x="400" y="161" text-anchor="middle" font-weight="bold" fill="#78350f">payOrder(orderId)</text><text x="400" y="179" text-anchor="middle" font-size="12" fill="#92400e">start payment, open Toss window</text>
<path d="M220 120L286 150" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M220 210L286 182" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="580" y="80" width="380" height="80" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/><text x="770" y="107" text-anchor="middle" font-weight="bold" fill="#064e3b">/checkout/result (successUrl)</text><text x="770" y="125" text-anchor="middle" font-size="12" fill="#065f46">confirm sent once (useRef)</text><text x="770" y="143" text-anchor="middle" font-size="12" fill="#065f46">PG_ERROR: retry button · PAYMENT_MISMATCH: fail notice</text>
<rect x="580" y="180" width="380" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5"/><text x="770" y="206" text-anchor="middle" font-weight="bold" fill="#7f1d1d">/checkout/result?fail=1 (failUrl)</text><text x="770" y="224" text-anchor="middle" font-size="12" fill="#b91c1c">records the failure: POST /api/payments/fail/</text>
<rect x="580" y="262" width="380" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="770" y="288" text-anchor="middle" font-weight="bold" fill="#1e293b">window closed</text><text x="770" y="306" text-anchor="middle" font-size="12" fill="#334155">requestPayment() rejects USER_CANCEL, no page change</text>
<path d="M510 150L576 122" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M510 170L576 208" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M510 185L576 290" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="20" y="370" font-size="12" fill="#334155">Order detail shows "pay again" only when the server sends can_pay; admin buttons follow allowed_actions.</text>
</svg>
