<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" font-family='Pretendard, "Apple SD Gothic Neo", -apple-system, Helvetica, Arial, sans-serif' font-size="13">
<rect width="980" height="400" fill="#ffffff" rx="8"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#475569"/></marker></defs>
<text x="20" y="32" font-size="17" font-weight="bold" fill="#1e293b">One server behind Cloudflare</text>
<text x="20" y="52" font-size="12" fill="#64748b">The browser runs the React SPA; nginx splits static files and /api/; data is one SQLite file.</text>
<rect x="20" y="150" width="160" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="100" y="182" text-anchor="middle" font-weight="bold" fill="#1e293b">browser</text>
<text x="100" y="204" text-anchor="middle" font-size="12" fill="#334155">React SPA</text>
<rect x="230" y="150" width="150" height="80" rx="8" fill="#fff7ed" stroke="#fdba74"/>
<text x="305" y="182" text-anchor="middle" font-weight="bold" fill="#7c2d12">Cloudflare</text>
<text x="305" y="204" text-anchor="middle" font-size="12" fill="#9a3412">DNS, proxy, HTTPS</text>
<rect x="430" y="80" width="400" height="290" rx="10" fill="#f8fafc" stroke="#64748b" stroke-dasharray="5 4"/>
<text x="450" y="104" font-weight="bold" fill="#1e293b">EC2 t3.micro, Ubuntu 24.04</text>
<rect x="450" y="150" width="120" height="80" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="510" y="182" text-anchor="middle" font-weight="bold" fill="#064e3b">nginx</text>
<text x="510" y="204" text-anchor="middle" font-size="12" fill="#065f46">:443</text>
<rect x="620" y="120" width="190" height="50" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="715" y="150" text-anchor="middle" fill="#334155">frontend/dist (static)</text>
<rect x="620" y="200" width="190" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="715" y="226" text-anchor="middle" font-weight="bold" fill="#1e3a8a">gunicorn + Django</text>
<text x="715" y="246" text-anchor="middle" font-size="12" fill="#1d4ed8">REST API, 3 workers</text>
<rect x="620" y="290" width="190" height="56" rx="8" fill="#fefce8" stroke="#fde047"/>
<text x="715" y="316" text-anchor="middle" font-weight="bold" fill="#713f12">SQLite (WAL)</text>
<text x="715" y="334" text-anchor="middle" font-size="12" fill="#854d0e">db.sqlite3, daily backup</text>
<rect x="860" y="200" width="110" height="60" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
<text x="915" y="226" text-anchor="middle" font-weight="bold" fill="#3b0764">Toss</text>
<text x="915" y="246" text-anchor="middle" font-size="11" fill="#6d28d9">test mode</text>
<g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)">
<path d="M180 190H228"/><path d="M380 190H448"/><path d="M570 175L618 148"/><path d="M570 205L618 228"/><path d="M715 260V288"/><path d="M810 230H858"/>
<path d="M100 230V388H915V262" stroke-dasharray="4 3"/>
</g>
<text x="596" y="150" font-size="11" fill="#64748b">/</text>
<text x="584" y="236" font-size="11" fill="#64748b">/api/</text>
<text x="822" y="222" font-size="11" fill="#64748b">confirm,</text>
<text x="822" y="276" font-size="11" fill="#64748b">cancel</text>
<text x="110" y="382" font-size="11" fill="#64748b">payment window opens in the browser</text>
</svg>
