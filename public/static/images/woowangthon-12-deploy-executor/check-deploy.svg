<svg xmlns="http://www.w3.org/2000/svg" width="900" height="528" viewBox="0 0 900 528" role="img" aria-label="Terminal output">
  <rect width="900" height="528" rx="12" fill="#0d1117"/>
  <rect width="900" height="36" rx="12" fill="#161b22"/>
  <rect y="24" width="900" height="12" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="450" y="23" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">operator — Infra/executor/check.sh</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#e6edf3">
    <text x="24" y="64" xml:space="preserve">$ bash Infra/executor/check.sh</text>
    <text x="24" y="84" xml:space="preserve">== executor account: a deploy (apply, wait, read, switch, clear)</text>
    <text x="24" y="104" xml:space="preserve">PASS server dry run of the app (Render)</text>
    <text x="24" y="124" xml:space="preserve">PASS apply Deployment, Service, Middleware, Ingress</text>
    <text x="24" y="144" xml:space="preserve">PASS apply a ConfigMap</text>
    <text x="24" y="164" xml:space="preserve">PASS wait for the rollout</text>
    <text x="24" y="184" xml:space="preserve">PASS read Pods</text>
    <text x="24" y="204" xml:space="preserve">PASS read events</text>
    <text x="24" y="224" xml:space="preserve">PASS read Endpoints</text>
    <text x="24" y="244" xml:space="preserve">PASS read EndpointSlices</text>
    <text x="24" y="264" xml:space="preserve">PASS read ReplicaSets</text>
    <text x="24" y="284" xml:space="preserve">PASS read the Ingress (live-slot check)</text>
    <text x="24" y="304" xml:space="preserve">PASS Traefik reaches the app at /readyz (200)</text>
    <text x="24" y="324" xml:space="preserve">PASS stripPrefix through Traefik: /svc/readyz (200)</text>
    <text x="24" y="344" xml:space="preserve">PASS read a Pod log refused (rbac)</text>
    <text x="24" y="364" xml:space="preserve">PASS exec into a Pod refused (rbac)</text>
    <text x="24" y="384" xml:space="preserve">PASS change the Ingress (take the Middleware off)</text>
    <text x="24" y="404" xml:space="preserve">PASS without the Middleware: /svc/readyz (404)</text>
    <text x="24" y="424" xml:space="preserve">PASS scale the Deployment to 0</text>
    <text x="24" y="444" xml:space="preserve">PASS delete the Middleware</text>
    <text x="24" y="464" xml:space="preserve">PASS clear by label (Deployment, ConfigMap)</text>
    <text x="24" y="484" xml:space="preserve">PASS delete the Service and the Ingress</text>
    <text x="24" y="504" xml:space="preserve">...</text>
  </g>
</svg>
