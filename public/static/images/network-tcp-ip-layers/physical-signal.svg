<text x="20" y="92" font-weight="bold" fill="#1e293b">bits</text>
<text x="20" y="140" font-weight="bold" fill="#1e293b">NRZ</text><text x="20" y="157" font-size="10.5" fill="#64748b">1 = high voltage, 0 = low</text>
<path d="M190 125 V125 H270 V165 H350 V125 H430 V125 H510 V165 H590 V165 H670 V125 H750 V165 H830" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<text x="20" y="210" font-weight="bold" fill="#1e293b">Manchester</text><text x="20" y="227" font-size="10.5" fill="#64748b">mid-bit edge: up = 1, down = 0</text><text x="20" y="241" font-size="10.5" fill="#64748b">(10BASE-T, copper)</text>
<path d="M190 235 V235 H230 V195 H270 V195 H310 V235 H350 V235 H390 V195 H430 V235 H470 V195 H510 V195 H550 V235 H590 V195 H630 V235 H670 V235 H710 V195 H750 V195 H790 V235 H830" fill="none" stroke="#16a34a" stroke-width="2.5"/>
