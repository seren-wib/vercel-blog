<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e86c1"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>

  <text x="110" y="58" font-weight="bold" font-size="15">EMPLOYEE</text>
  <text x="610" y="58" font-weight="bold" font-size="15">DEPARTMENT</text>
  <text x="243" y="58" font-size="12" fill="#c0392b" font-weight="bold">PK</text>
  <text x="446" y="58" font-size="12" fill="#2e86c1" font-weight="bold">FK</text>
  <text x="787" y="58" font-size="12" fill="#c0392b" font-weight="bold">PK</text>

  <!-- EMPLOYEE header -->
  <g stroke="#333" fill="#dfe8f5">
    <rect x="110" y="70" width="90" height="34"/><rect x="200" y="70" width="110" height="34"/>
    <rect x="310" y="70" width="110" height="34"/><rect x="420" y="70" width="70" height="34" fill="#d6eaf8"/>
  </g>
  <g text-anchor="middle" font-weight="bold">
    <text x="155" y="92">Fname</text><text x="255" y="92" text-decoration="underline">Ssn</text><text x="365" y="92">Super_ssn</text><text x="455" y="92">Dno</text>
  </g>
  <!-- EMPLOYEE rows -->
  <g stroke="#333" fill="#ffffff">
    <rect x="110" y="104" width="90" height="34"/><rect x="200" y="104" width="110" height="34"/><rect x="310" y="104" width="110" height="34"/><rect x="420" y="104" width="70" height="34"/>
    <rect x="110" y="138" width="90" height="34"/><rect x="200" y="138" width="110" height="34"/><rect x="310" y="138" width="110" height="34"/><rect x="420" y="138" width="70" height="34"/>
    <rect x="110" y="172" width="90" height="34"/><rect x="200" y="172" width="110" height="34"/><rect x="310" y="172" width="110" height="34"/><rect x="420" y="172" width="70" height="34" fill="#fff6d6"/>
    <rect x="110" y="206" width="90" height="34" fill="#fdecea"/><rect x="200" y="206" width="110" height="34" fill="#fdecea"/><rect x="310" y="206" width="110" height="34" fill="#fdecea"/><rect x="420" y="206" width="70" height="34" fill="#fdecea"/>
  </g>
  <g text-anchor="middle">
    <text x="155" y="126">John</text><text x="255" y="126">123456789</text><text x="365" y="126">888665555</text><text x="455" y="126">5</text>
    <text x="155" y="160">James</text><text x="255" y="160">888665555</text><text x="365" y="160">NULL</text><text x="455" y="160">1</text>
    <text x="155" y="194">Lee</text><text x="255" y="194">555123456</text><text x="365" y="194">888665555</text><text x="455" y="194" fill="#b7950b" font-weight="bold">NULL</text>
    <text x="155" y="228">Kim</text><text x="255" y="228">777000111</text><text x="365" y="228">888665555</text><text x="455" y="228" fill="#c0392b" font-weight="bold">7</text>
  </g>
  <!-- row status -->
  <g font-size="12" text-anchor="end" font-weight="bold">
    <text x="100" y="126" fill="#27ae60">OK</text>
    <text x="100" y="160" fill="#27ae60">OK</text>
    <text x="100" y="194" fill="#b7950b">OK (NULL)</text>
    <text x="100" y="228" fill="#c0392b">violation</text>
  </g>

  <!-- DEPARTMENT -->
  <g stroke="#333" fill="#dfe8f5">
    <rect x="610" y="70" width="140" height="34"/><rect x="750" y="70" width="100" height="34" fill="#d6eaf8"/>
  </g>
  <g text-anchor="middle" font-weight="bold"><text x="680" y="92">Dname</text><text x="800" y="92" text-decoration="underline">Dnumber</text></g>
  <g stroke="#333" fill="#ffffff">
    <rect x="610" y="104" width="140" height="34"/><rect x="750" y="104" width="100" height="34"/>
    <rect x="610" y="138" width="140" height="34"/><rect x="750" y="138" width="100" height="34"/>
    <rect x="610" y="172" width="140" height="34"/><rect x="750" y="172" width="100" height="34"/>
  </g>
  <g text-anchor="middle">
    <text x="680" y="126">Research</text><text x="800" y="126">5</text>
    <text x="680" y="160">Administration</text><text x="800" y="160">4</text>
    <text x="680" y="194">Headquarters</text><text x="800" y="194">1</text>
  </g>

  <!-- arrows -->
  <line x1="490" y1="121" x2="606" y2="121" stroke="#2e86c1" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="490" y1="155" x2="606" y2="187" stroke="#2e86c1" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="490" y1="223" x2="600" y2="223" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="612" y="228" font-size="12" fill="#c0392b" font-weight="bold">no Dnumber 7 exists</text>

  <g font-size="13" fill="#333">
    <text x="30" y="290"><tspan font-weight="bold">Referential integrity:</tspan>  EMPLOYEE.Dno (FK)  references  DEPARTMENT.Dnumber (PK)</text>
    <text x="30" y="312">FK value must be an existing PK value (5, 4, 1) or NULL.  Same domain as the PK.</text>
    <text x="30" y="340"><tspan font-weight="bold">Entity integrity:</tspan>  PK (Ssn, Dnumber) can never be NULL.  FK can be NULL.</text>
    <text x="30" y="368" fill="#555">Super_ssn is also an FK: it references EMPLOYEE.Ssn in the same relation (James has no supervisor = NULL)</text>
  </g>
</svg>
