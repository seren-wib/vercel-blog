<svg xmlns="http://www.w3.org/2000/svg" width="900" height="528" viewBox="0 0 900 528" role="img" aria-label="Terminal output">
  <rect width="900" height="528" rx="12" fill="#0d1117"/>
  <rect width="900" height="36" rx="12" fill="#161b22"/>
  <rect y="24" width="900" height="12" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="450" y="23" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">k3s-leader — executor rights</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#e6edf3">
    <text x="24" y="64" xml:space="preserve">$ kubectl get clusterrolebinding -o name | grep -c deploy-executor</text>
    <text x="24" y="84" xml:space="preserve">0</text>
    <text x="24" y="104" xml:space="preserve">$ kubectl get rolebinding -A --field-selector metadata.name=deploy-executor</text>
    <text x="24" y="124" xml:space="preserve"><tspan fill="#79c0ff">NAMESPACE</tspan>          NAME              ROLE                        AGE</text>
    <text x="24" y="144" xml:space="preserve">proj-demo          deploy-executor   ClusterRole/proj-deployer   14h</text>
    <text x="24" y="164" xml:space="preserve">student-template   deploy-executor   ClusterRole/proj-deployer   14h</text>
    <text x="24" y="184" xml:space="preserve"></text>
    <text x="24" y="204" xml:space="preserve"><tspan fill="#79c0ff">SPACE</tspan>        kubectl auth can-i ...             AS deploy-executor</text>
    <text x="24" y="224" xml:space="preserve">proj-demo    create deployments                 <tspan fill="#3fb950">yes</tspan></text>
    <text x="24" y="244" xml:space="preserve">proj-demo    create middlewares.traefik.io      <tspan fill="#3fb950">yes</tspan></text>
    <text x="24" y="264" xml:space="preserve">proj-demo    get pods                           <tspan fill="#3fb950">yes</tspan></text>
    <text x="24" y="284" xml:space="preserve">proj-demo    create secrets                     no</text>
    <text x="24" y="304" xml:space="preserve">proj-demo    get secrets                        no</text>
    <text x="24" y="324" xml:space="preserve">proj-demo    get pods --subresource=log         no</text>
    <text x="24" y="344" xml:space="preserve">proj-demo    create pods --subresource=exec     no</text>
    <text x="24" y="364" xml:space="preserve">kube-system  create deployments                 no</text>
    <text x="24" y="384" xml:space="preserve">kube-system  create middlewares.traefik.io      no</text>
    <text x="24" y="404" xml:space="preserve">kube-system  get pods                           no</text>
    <text x="24" y="424" xml:space="preserve">kube-system  create secrets                     no</text>
    <text x="24" y="444" xml:space="preserve">kube-system  get secrets                        no</text>
    <text x="24" y="464" xml:space="preserve">kube-system  get pods --subresource=log         no</text>
    <text x="24" y="484" xml:space="preserve">kube-system  create pods --subresource=exec     no</text>
    <text x="24" y="504" xml:space="preserve">(cluster)    get nodes                          no</text>
  </g>
</svg>
