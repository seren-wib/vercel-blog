<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="Pretendard, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="360" fill="#ffffff" rx="8"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/></marker></defs>
  <text x="20" y="32" font-size="16" font-weight="bold" fill="#1e293b">Paging: virtual pages mapped to physical frames</text>

  <text x="90" y="66" text-anchor="middle" font-weight="bold" fill="#1e293b">Virtual address space</text>
  <rect x="30" y="80" width="120" height="40" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="90" y="105" text-anchor="middle" fill="#1e293b">Page 0</text>
  <rect x="30" y="124" width="120" height="40" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="90" y="149" text-anchor="middle" fill="#1e293b">Page 1</text>
  <rect x="30" y="168" width="120" height="40" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="90" y="193" text-anchor="middle" fill="#1e293b">Page 2</text>
  <rect x="30" y="212" width="120" height="40" rx="5" fill="#fee2e2" stroke="#ef4444"/>
  <text x="90" y="237" text-anchor="middle" fill="#1e293b">Page 3</text>

  <text x="345" y="66" text-anchor="middle" font-weight="bold" fill="#1e293b">Page table (set by OS)</text>
  <rect x="250" y="80" width="190" height="172" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="300" y="104" text-anchor="middle" font-size="12" fill="#64748b">page</text>
  <text x="390" y="104" text-anchor="middle" font-size="12" fill="#64748b">frame</text>
  <line x1="262" y1="112" x2="428" y2="112" stroke="#c4b5fd"/>
  <text x="300" y="138" text-anchor="middle" fill="#1e293b">0</text><text x="390" y="138" text-anchor="middle" fill="#1e293b">3</text>
  <text x="300" y="168" text-anchor="middle" fill="#1e293b">1</text><text x="390" y="168" text-anchor="middle" fill="#1e293b">0</text>
  <text x="300" y="198" text-anchor="middle" fill="#1e293b">2</text><text x="390" y="198" text-anchor="middle" fill="#1e293b">5</text>
  <text x="300" y="228" text-anchor="middle" fill="#1e293b">3</text><text x="390" y="228" text-anchor="middle" fill="#ef4444">on disk</text>
  <text x="345" y="276" text-anchor="middle" font-size="12" fill="#64748b">MMU (hardware) uses this table</text>
  <text x="345" y="292" text-anchor="middle" font-size="12" fill="#64748b">to translate every access</text>

  <line x1="152" y1="100" x2="248" y2="134" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="152" y1="144" x2="248" y2="164" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="152" y1="188" x2="248" y2="194" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="152" y1="232" x2="248" y2="224" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="640" y="66" text-anchor="middle" font-weight="bold" fill="#1e293b">Physical memory (RAM)</text>
  <rect x="560" y="80" width="160" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="640" y="102" text-anchor="middle" fill="#1e293b">Frame 0 = Page 1</text>
  <rect x="560" y="116" width="160" height="34" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="640" y="138" text-anchor="middle" fill="#64748b">Frame 1</text>
  <rect x="560" y="152" width="160" height="34" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="640" y="174" text-anchor="middle" fill="#64748b">Frame 2</text>
  <rect x="560" y="188" width="160" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="640" y="210" text-anchor="middle" fill="#1e293b">Frame 3 = Page 0</text>
  <rect x="560" y="224" width="160" height="34" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="640" y="246" text-anchor="middle" fill="#64748b">Frame 4</text>
  <rect x="560" y="260" width="160" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="640" y="282" text-anchor="middle" fill="#1e293b">Frame 5 = Page 2</text>

  <line x1="442" y1="134" x2="558" y2="204" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="442" y1="164" x2="558" y2="97" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="442" y1="194" x2="558" y2="277" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="30" y="300" width="410" height="44" rx="6" fill="#fff7ed" stroke="#f97316"/>
  <text x="44" y="320" fill="#1e293b">Page 3 is not in RAM → page fault</text>
  <text x="44" y="336" font-size="12" fill="#64748b">OS loads it from disk into a free frame, updates the table, retries</text>
</svg>
