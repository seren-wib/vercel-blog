<svg xmlns="http://www.w3.org/2000/svg" width="900" height="268" viewBox="0 0 900 268" role="img" aria-label="Terminal output">
  <rect width="900" height="268" rx="12" fill="#0d1117"/>
  <rect width="900" height="36" rx="12" fill="#161b22"/>
  <rect y="24" width="900" height="12" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="450" y="23" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">k3s-leader / k3s-w1 — paths to the EC2</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#e6edf3">
    <text x="24" y="64" xml:space="preserve">k3s-leader$ curl -sS -m 5 http://$EC2:8153/go/api/v1/health</text>
    <text x="24" y="84" xml:space="preserve">{</text>
    <text x="24" y="104" xml:space="preserve">  "health": "<tspan fill="#3fb950">OK</tspan>"</text>
    <text x="24" y="124" xml:space="preserve">}</text>
    <text x="24" y="144" xml:space="preserve">k3s-leader$ curl -sS -m 5 http://$EC2:22/</text>
    <text x="24" y="164" xml:space="preserve">curl: (28) Connection timed out after 5002 milliseconds</text>
    <text x="24" y="184" xml:space="preserve">k3s-w1$ curl -sS -m 5 http://$EC2:8153/go/api/v1/health</text>
    <text x="24" y="204" xml:space="preserve">curl: (28) Connection timed out after 5002 milliseconds</text>
    <text x="24" y="224" xml:space="preserve">k3s-leader$ tailscale ping -c 1 wcp-platform</text>
    <text x="24" y="244" xml:space="preserve">pong from wcp-platform (&lt;EC2 tailnet IP&gt;) via &lt;EC2 public IP&gt;:41641 in 5ms</text>
  </g>
</svg>
