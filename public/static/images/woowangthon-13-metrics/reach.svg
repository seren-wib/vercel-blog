    <text x="24" y="284" xml:space="preserve"></text>
    <text x="24" y="304" xml:space="preserve">$ kubectl -n vllm exec deploy/vllm -- python3 -c 'import urllib.request as u;</text>
    <text x="24" y="324" xml:space="preserve">    print(u.urlopen("http://monitoring-prometheus.monitoring.svc.cluster.local:9090/-/ready",timeout=5).status)'</text>
    <text x="24" y="344" xml:space="preserve">...</text>
    <text x="24" y="364" xml:space="preserve">urllib.<tspan fill="#ff7b72">error</tspan>.URLError: &lt;urlopen <tspan fill="#ff7b72">error</tspan> [Errno 111] Connection refused&gt;</text>
    <text x="24" y="384" xml:space="preserve">command terminated with exit code 1</text>
