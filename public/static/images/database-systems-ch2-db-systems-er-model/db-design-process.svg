<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="#ffffff"/>

  <!-- Phase labels -->
  <g font-size="12" fill="#888">
    <text x="20" y="30">Phase 1</text>
    <text x="260" y="30">Phase 2</text>
    <text x="500" y="30">Phase 3</text>
    <text x="740" y="30">Phase 3</text>
  </g>

  <!-- Boxes -->
  <g stroke-width="1.5">
    <rect x="20" y="40" width="200" height="60" rx="6" fill="#f4f4f4" stroke="#555"/>
    <rect x="260" y="40" width="200" height="60" rx="6" fill="#f5eefa" stroke="#7d3c98"/>
    <rect x="500" y="40" width="200" height="60" rx="6" fill="#fef6e4" stroke="#d68910"/>
    <rect x="740" y="40" width="200" height="60" rx="6" fill="#edf7ee" stroke="#27ae60"/>
  </g>
  <g text-anchor="middle" font-weight="bold">
    <text x="120" y="64">Requirements</text>
    <text x="120" y="82">collection and analysis</text>
    <text x="360" y="64" fill="#7d3c98">Conceptual design</text>
    <text x="360" y="82" fill="#7d3c98">ER diagram</text>
    <text x="600" y="64" fill="#d68910">Logical design</text>
    <text x="600" y="82" fill="#d68910">relational schema</text>
    <text x="840" y="64" fill="#27ae60">Physical design</text>
    <text x="840" y="82" fill="#27ae60">storage layout</text>
  </g>

  <!-- Arrows between boxes -->
  <g stroke="#555" marker-end="url(#arr)">
    <line x1="222" y1="70" x2="256" y2="70"/>
    <line x1="462" y1="70" x2="496" y2="70"/>
    <line x1="702" y1="70" x2="736" y2="70"/>
  </g>

  <!-- Data model row -->
  <g text-anchor="middle" font-size="12">
    <text x="120" y="122" fill="#555">users' detailed requirements</text>
    <text x="360" y="122" fill="#7d3c98">Conceptual data model</text>
    <text x="600" y="122" fill="#d68910">Representational data model</text>
    <text x="840" y="122" fill="#27ae60">Physical data model</text>
  </g>

  <!-- Example row -->
  <g font-size="12">
    <!-- requirements -->
    <rect x="20" y="150" width="200" height="170" rx="4" fill="#ffffff" stroke="#bbb"/>
    <text x="30" y="170" fill="#333">"The company has</text>
    <text x="30" y="188" fill="#333">departments. Each has a</text>
    <text x="30" y="206" fill="#333">unique name, a unique</text>
    <text x="30" y="224" fill="#333">number, locations, ..."</text>
    <text x="30" y="254" fill="#333">"Employees work in</text>
    <text x="30" y="272" fill="#333">the company. Each has a</text>
    <text x="30" y="290" fill="#333">name, SSN, salary, ..."</text>

    <!-- ER mini -->
    <rect x="260" y="150" width="200" height="170" rx="4" fill="#ffffff" stroke="#bbb"/>
    <ellipse cx="290" cy="175" rx="24" ry="12" fill="#fff" stroke="#222"/>
    <text x="290" y="179" text-anchor="middle" text-decoration="underline">Ssn</text>
    <ellipse cx="350" cy="175" rx="24" ry="12" fill="#fff" stroke="#222"/>
    <text x="350" y="179" text-anchor="middle">Name</text>
    <line x1="296" y1="187" x2="308" y2="210" stroke="#222"/>
    <line x1="344" y1="187" x2="332" y2="210" stroke="#222"/>
    <rect x="280" y="210" width="80" height="28" fill="#fff" stroke="#222"/>
    <text x="320" y="229" text-anchor="middle" font-weight="bold">EMPLOYEE</text>
    <line x1="320" y1="238" x2="320" y2="256" stroke="#222"/>
    <path d="M320,256 L372,278 L320,300 L268,278 z" fill="#fff" stroke="#222"/>
    <text x="320" y="282" text-anchor="middle" font-size="10">WORKS_FOR</text>
    <line x1="372" y1="278" x2="395" y2="278" stroke="#222"/>
    <text x="398" y="282" fill="#666" font-size="10">DEPARTMENT</text>

    <!-- tables mini -->
    <rect x="500" y="150" width="200" height="170" rx="4" fill="#ffffff" stroke="#bbb"/>
    <text x="510" y="172" font-weight="bold">EMPLOYEE</text>
    <rect x="510" y="180" width="180" height="22" fill="#fef6e4" stroke="#555"/>
    <text x="516" y="195"><tspan text-decoration="underline">Ssn</tspan>  Name  Salary  Dno</text>
    <rect x="510" y="202" width="180" height="22" fill="#fff" stroke="#555"/>
    <text x="516" y="217">123  Kim  3000  5</text>
    <text x="510" y="256" font-weight="bold">DEPARTMENT</text>
    <rect x="510" y="264" width="180" height="22" fill="#fef6e4" stroke="#555"/>
    <text x="516" y="279"><tspan text-decoration="underline">Dnumber</tspan>  Dname  Mgr_ssn</text>
    <rect x="510" y="286" width="180" height="22" fill="#fff" stroke="#555"/>
    <text x="516" y="301">5  Research  123</text>

    <!-- physical mini -->
    <rect x="740" y="150" width="200" height="170" rx="4" fill="#ffffff" stroke="#bbb"/>
    <text x="750" y="172" fill="#333">file EMPLOYEE.dat</text>
    <text x="750" y="190" fill="#333">records sorted by Ssn</text>
    <text x="750" y="208" fill="#333">record size 64 bytes</text>
    <text x="750" y="238" fill="#333">index on Ssn (B+ tree)</text>
    <text x="750" y="256" fill="#333">index on Dno (hash)</text>
    <text x="750" y="286" fill="#333">disk blocks, access paths</text>
  </g>

  <!-- footer -->
  <text x="20" y="348" font-size="12" fill="#888">Database design process: same company data at each phase. Lecture 2 covers phase 2, lecture 3 covers the ER-to-table step.</text>
</svg>
