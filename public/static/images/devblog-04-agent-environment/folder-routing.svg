 Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1E6B44" text-anchor="middle">Claude Code auto-memory</text><text x="1010" y="140" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="13" font-weight="400" fill="#374151" text-anchor="middle">~/.claude/projects/&lt;encoded&gt;/</text><text x="1010" y="160" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="13" font-weight="400" fill="#374151" text-anchor="middle">  memory/  → symlink</text><line x1="782" y1="140" x2="856" y2="140" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40" y="260" width="300" height="90" rx="10" fill="#FFF4E0" stroke="#C98A1B" stroke-width="1.6"/><text x="190" y="288" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#8A5D0C" text-anchor="middle">key = vercel-blog</text><text x="190" y="310" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="middle">work folder 이름 (git이면 repo root)</text><line x1="190" y1="182" x2="190" y2="256" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="450" y="250" width="330" height="110" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="615" y="278" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">공유 등록</text><text x="615" y="300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="middle">git repo → remote URL (repos.txt)</text><text x="615" y="324" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="middle">그 외 폴더 → OS별 경로 (paths.txt)</text><line x1="342" y1="305" x2="446" y2="305" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="860" y="240" width="300" height="60" rx="10" fill="#E7F6EE" stroke="#2F9461" stroke-width="1.6"/><text x="1010" y="276" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1E6B44" text-anchor="middle">memory/vercel-blog/MEMORY.md</text><rect x="860" y="320" width="300" height="60" rx="10" fill="#FFF4E0" stroke="#C98A1B" stroke-width="1.6"/><text x="1010" y="356" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#8A5D0C" text-anchor="middle">worklog/vercel-blog/WORK.md</text><path d="M1010 192 L1010 236" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><line x1="782" y1="290" x2="856" y2="270" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><line x1="782" y1="320" x2="856" y2="350" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="600" y="430" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="15" font-weight="400" fill="#374151" text-anchor="middle">SessionStart hook이 이 경로 한 줄을 context에 넣는다. 다른 머신의 clone은 remote URL로 같은 key를 찾는다.</text></svg>
