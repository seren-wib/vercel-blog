    <text x="24" y="164" xml:space="preserve"></text>
    <text x="24" y="184" xml:space="preserve">$ ssh k3s-leader 'sudo -n k3s kubectl apply -f -' &lt; Infra/monitoring/monitoring.yaml</text>
    <text x="24" y="204" xml:space="preserve">$ bash Infra/monitoring/check.sh</text>
