<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="Pretendard, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="860" height="400" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/></marker>
    <marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/></marker>
  </defs>
  <text x="20" y="32" font-size="16" font-weight="bold" fill="#1e293b">CPU direct transfer vs DMA</text>

  <!-- ===== left: CPU direct ===== -->
  <rect x="20" y="50" width="400" height="330" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="220" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">Without DMA (CPU direct)</text>

  <rect x="160" y="96" width="120" height="56" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="220" y="120" text-anchor="middle" font-weight="bold" fill="#1e293b">CPU</text>
  <text x="220" y="140" text-anchor="middle" font-size="12" fill="#b91c1c">busy moving data</text>

  <rect x="40" y="250" width="120" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="100" y="274" text-anchor="middle" font-weight="bold" fill="#1e293b">I/O device</text>
  <text x="100" y="294" text-anchor="middle" font-size="12" fill="#64748b">SSD</text>

  <rect x="280" y="250" width="120" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="340" y="274" text-anchor="middle" font-weight="bold" fill="#1e293b">Memory</text>
  <text x="340" y="294" text-anchor="middle" font-size="12" fill="#64748b">RAM</text>

  <line x1="110" y1="248" x2="178" y2="156" stroke="#ef4444" stroke-width="3" marker-end="url(#a-red)"/>
  <text x="104" y="200" text-anchor="end" font-size="12" fill="#b91c1c">① CPU reads</text>
  <line x1="262" y1="156" x2="330" y2="248" stroke="#ef4444" stroke-width="3" marker-end="url(#a-red)"/>
  <text x="312" y="200" font-size="12" fill="#b91c1c">② CPU writes</text>

  <text x="220" y="232" text-anchor="middle" font-size="12" fill="#b91c1c">repeat ①② for every piece</text>

  <text x="220" y="342" text-anchor="middle" font-size="12" fill="#1e293b">All data passes through the CPU</text>
  <text x="220" y="362" text-anchor="middle" font-size="12" fill="#1e293b">→ CPU cannot do other work</text>

  <!-- ===== right: DMA ===== -->
  <rect x="440" y="50" width="400" height="330" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="640" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">With DMA</text>

  <rect x="580" y="96" width="120" height="56" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="640" y="120" text-anchor="middle" font-weight="bold" fill="#1e293b">CPU</text>
  <text x="640" y="140" text-anchor="middle" font-size="12" fill="#15803d">runs other work</text>

  <rect x="455" y="250" width="100" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="505" y="274" text-anchor="middle" font-weight="bold" fill="#1e293b">I/O device</text>
  <text x="505" y="294" text-anchor="middle" font-size="12" fill="#64748b">SSD</text>

  <rect x="590" y="250" width="100" height="56" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="640" y="274" text-anchor="middle" font-weight="bold" fill="#1e293b">DMA</text>
  <text x="640" y="294" text-anchor="middle" font-size="12" fill="#64748b">controller</text>

  <rect x="725" y="250" width="100" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="775" y="274" text-anchor="middle" font-weight="bold" fill="#1e293b">Memory</text>
  <text x="775" y="294" text-anchor="middle" font-size="12" fill="#64748b">RAM</text>

  <!-- setup / interrupt -->
  <line x1="620" y1="154" x2="620" y2="246" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a-gray)"/>
  <text x="612" y="190" text-anchor="end" font-size="12" fill="#1e293b">① setup</text>
  <text x="612" y="206" text-anchor="end" font-size="11" fill="#64748b">addr · size · dir</text>
  <line x1="660" y1="248" x2="660" y2="156" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a-gray)"/>
  <text x="668" y="190" font-size="12" fill="#1e293b">③ interrupt</text>
  <text x="668" y="206" font-size="11" fill="#64748b">"done"</text>

  <!-- data path -->
  <line x1="557" y1="278" x2="586" y2="278" stroke="#16a34a" stroke-width="3" marker-end="url(#a-green)"/>
  <line x1="692" y1="278" x2="721" y2="278" stroke="#16a34a" stroke-width="3" marker-end="url(#a-green)"/>
  <text x="640" y="326" text-anchor="middle" font-size="12" fill="#15803d">② data moves directly, no CPU</text>

  <text x="640" y="352" text-anchor="middle" font-size="12" fill="#1e293b">CPU only sets up (①) and handles the finish (③)</text>
</svg>
