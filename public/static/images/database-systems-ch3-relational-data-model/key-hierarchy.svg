<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="820" height="380" fill="#ffffff"/>

  <!-- schema -->
  <text x="20" y="32" font-weight="bold" font-size="15">DEPARTMENT(Dname, <tspan text-decoration="underline">Dnumber</tspan>, Mgr_ssn, Mgr_start_date)</text>
  <text x="20" y="52" font-size="12" fill="#555">Dname and Dnumber are each unique per department (underline = primary key)</text>

  <!-- superkey -->
  <rect x="20" y="70" width="780" height="250" rx="10" fill="#f4f6f7" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="34" y="92" font-weight="bold" fill="#566573">Superkey</text>
  <text x="34" y="110" font-size="12" fill="#566573">value combination is different for every tuple; extra attributes allowed</text>
  <g font-size="13" fill="#333">
    <text x="530" y="150">{Dname, Dnumber}</text>
    <text x="530" y="176">{Dnumber, Mgr_ssn}</text>
    <text x="530" y="202">{Dname, Mgr_start_date}</text>
    <text x="530" y="228">{all 4 attributes}</text>
    <text x="530" y="254" fill="#888">... and more</text>
  </g>

  <!-- key -->
  <rect x="40" y="124" width="460" height="180" rx="10" fill="#eef4fb" stroke="#2e86c1" stroke-width="1.5"/>
  <text x="54" y="146" font-weight="bold" fill="#2e86c1">Key = Candidate key</text>
  <text x="54" y="164" font-size="12" fill="#2e86c1">minimal superkey: remove any attribute and it is no longer unique</text>
  <text x="330" y="232" font-size="14" fill="#333">{Dname}</text>
  <text x="330" y="252" font-size="11" fill="#2e86c1">key, not chosen as PK</text>

  <!-- PK -->
  <rect x="60" y="188" width="230" height="96" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="74" y="210" font-weight="bold" fill="#c0392b">Primary key (PK)</text>
  <text x="74" y="228" font-size="12" fill="#c0392b">one key chosen to identify tuples</text>
  <text x="74" y="262" font-size="14" fill="#333">{<tspan text-decoration="underline">Dnumber</tspan>}</text>

  <!-- minimal check -->
  <text x="20" y="348" font-size="13" fill="#333">Minimal check:  {Dnumber, Mgr_ssn} minus Mgr_ssn = {Dnumber}, still unique  →  superkey, but NOT a key</text>
  <text x="20" y="368" font-size="12" fill="#888">PK  ⊂  Key (candidate key)  ⊂  Superkey</text>
</svg>
