  <text x="450" y="23" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">Infra/platform/check.sh — 2026-11-12</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#e6edf3">
    <text x="24" y="64"><tspan fill="#3fb950">$</tspan> bash Infra/platform/check.sh</text>
    <text x="24" y="84" xml:space="preserve">== server account: stop, resume, restart (through the read binding of each space)</text>
    <text x="24" y="104" xml:space="preserve">PASS operator puts a Deployment in the own space</text>
    <text x="24" y="124" xml:space="preserve"><tspan fill="#79c0ff">PASS stop</tspan>: scale it to 0</text>
    <text x="24" y="144" xml:space="preserve">PASS the Deployment is stopped (0)</text>
    <text x="24" y="164" xml:space="preserve">PASS stop again (already stopped)</text>
    <text x="24" y="184" xml:space="preserve"><tspan fill="#79c0ff">PASS resume</tspan>: scale it back to 1</text>
    <text x="24" y="204" xml:space="preserve">PASS the Deployment is back (1)</text>
    <text x="24" y="224" xml:space="preserve">PASS scale it to 2 refused (policy)</text>
    <text x="24" y="244" xml:space="preserve">PASS scale proj-demo to 0 (dry run)</text>
    <text x="24" y="264" xml:space="preserve">PASS scale proj-demo to 2 (dry run) refused (policy)</text>
    <text x="24" y="284" xml:space="preserve"><tspan fill="#79c0ff">PASS restart</tspan>: kubectl rollout restart</text>
    <text x="24" y="304" xml:space="preserve">PASS the Pod template carries restartedAt</text>
    <text x="24" y="324" xml:space="preserve">PASS restart proj-demo (dry run)</text>
    <text x="24" y="344" xml:space="preserve">PASS change the image refused (policy)</text>
    <text x="24" y="364" xml:space="preserve">PASS set replicas on the Deployment itself refused (policy)</text>
    <text x="24" y="384" xml:space="preserve">PASS add a Pod template label refused (policy)</text>
    <text x="24" y="404" xml:space="preserve">PASS add another Pod template annotation refused (policy)</text>
    <text x="24" y="424" xml:space="preserve">PASS pause the rollout refused (policy)</text>
    <text x="24" y="444" xml:space="preserve">PASS replace the Deployment (PUT) refused (rbac)</text>
    <text x="24" y="464" xml:space="preserve">PASS delete the Deployment refused (rbac)</text>
    <text x="24" y="484" xml:space="preserve">PASS scale in vllm refused (rbac)</text>
    <text x="24" y="504" xml:space="preserve">PASS restart in vllm refused (rbac)</text>
    <text x="24" y="524" xml:space="preserve">PASS scale in kube-system refused (rbac)</text>
    <text x="24" y="544" xml:space="preserve">PASS scale in a space without the read binding refused (rbac)</text>
