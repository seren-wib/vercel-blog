<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="1200" height="380" fill="#FFFFFF"/><text x="32" y="44" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#374151" text-anchor="start">PDF 쪽수를 세는 두 방법</text><rect x="32" y="80" width="240" height="110" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="46" y="108" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#374151" text-anchor="start">Catalog</text><text x="46" y="130" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 책 표지</text><text x="46" y="152" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="14" font-weight="400" fill="#374151" text-anchor="start">/Type /Catalog</text><text x="46" y="174" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="14" font-weight="400" fill="#374151" text-anchor="start">/Pages → 2 0 R</text><rect x="330" y="80" width="300" height="110" rx="10" fill="#EAF2FF" stroke="#3B6FD8" stroke-width="1.6"/><text x="344" y="108" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#234C9E" text-anchor="start">root Pages</text><text x="344" y="130" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 목차의 "총 n쪽"</text><text x="344" y="152" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="14" font-weight="400" fill="#374151" text-anchor="start">/Type /Pages</text><text x="344" y="174" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="14" font-weight="400" fill="#374151" text-anchor="start">/Count 48</text><rect x="680" y="80" width="150" height="80" rx="10" fill="#FFF4E0" stroke="#C98A1B" stroke-width="1.6"/><text x="694" y="108" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#8A5D0C" text-anchor="start">Page</text><text x="694" y="130" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="14" font-weight="400" fill="#374151" text-anchor="start">/Type /Page</text><rect x="845" y="80" width="150" height="80" rx="10" fill="#FFF4E0" stroke="#C98A1B" stroke-width="1.6"/><text x="859" y="108" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#8A5D0C" text-anchor="start">Page</text><text x="859" y="130" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="14" font-weight="400" fill="#374151" text-anchor="start">/Type /Page</text><text x="1010" y="125" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">… 48개</text><rect x="680" y="230" width="315" height="90" rx="10" fill="#FDECEC" stroke="#D64545" stroke-width="1.6"/><text x="694" y="258" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#9B2C2C" text-anchor="start">orphan Page</text><text x="694" y="280" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 제본에서 빠진 낱장</text><text x="694" y="302" font-family="Pretendard, 'Apple SD Gothic Neo', 