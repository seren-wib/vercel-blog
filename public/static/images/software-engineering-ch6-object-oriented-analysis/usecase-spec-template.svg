<text x="20" y="14" class="sm" fill="#555">Use-case specification: one table per use case (slide p.44 example)</text><rect x="20" y="20" width="200" height="26" fill="#eef1f6" stroke="#333" stroke-width="1"/><rect x="220" y="20" width="580" height="26" fill="#fff" stroke="#333" stroke-width="1"/><text x="30" y="37" font-weight="bold" fill="#222">Use-Case Name</text><text x="230" y="37" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">Purchase Products</text><rect x="20" y="46" width="200" height="26" fill="#eef1f6" stroke="#333" stroke-width="1"/><rect x="220" y="46" width="580" height="26" fill="#fff" stroke="#333" stroke-width="1"/><text x="30" y="63" font-weight="bold" fill="#222">ID</text><text x="230" y="63" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">PUR_101</text><rect x="20" y="72" width="200" height="26" fill="#eef1f6" stroke="#333" stroke-width="1"/><rect x="220" y="72" width="580" height="26" fill="#fff" stroke="#333" stroke-width="1"/><text x="30" y="89" font-weight="bold" fill="#222">Use-Case Type</text><text x="230" y="89" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">Detail or Essential</text><rect x="20" y="98" width="200" height="26" fill="#eef1f6" stroke="#333" stroke-width="1"/><rect x="220" y="98" width="580" height="26" fill="#fff" stroke="#333" stroke-width="1"/><text x="30" y="115" font-weight="bold" fill="#222">Type</text><text x="230" y="115" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">main, include, extend</text><rect x="20" y="124" width="200" height="26" fill="#eef1f6" stroke="#333" stroke-width="1"/><rect x="220" y="124" width="580" height="26" fill="#fff" stroke="#333" stroke-width="1"/><text x="30" y="141" font-weight="bold" fill="#222">Important Level</text><text x="230" y="141" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">High or Medium or Low</text><rect x="20" y="150" width="200" height="26" fill="#eef1f6" stroke="#333" stroke-width="1"/><rect x="220" y="150" width="580" height="26" fill="#fff" stroke="#333" stroke-width="1"/><text x="30" y="167" font-weight="bold" fill="#222">Method Name</text><text x="230" y="167" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">purchaseProducts()</text><rect x="20" y="176" width="200" height="26" fill="#eef1f6" stroke="#333" stroke-width="1"/><rect x="220" y="176" width="580" height="26" fill="#fff" stroke="#333" stroke-width="1"/><text x="30" y="193" font-weight="bold" fill="#222">Participant Actors</text><text x="230" y="193" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">Customer, Employee</text><rect x="20" y="202" width="200" height="26" fill="#eef1f6" stroke="#333" stroke-width="1"/><rect x="220" y="202" width="580" height="26" fill="#fff" stroke="#333" stroke-width="1"/><text x="30" y="219" font-weight="bold" fill="#222">Stakeholders</text><text x="230" y="219" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">Supplier</text><rect x="20" y="228" width="200" height="190" fill="#eef1f6" stroke="#333" stroke-width="1"/><rect x="220" y="228" width="580" height="190" fill="#fff" stroke="#333" stroke-width="1"/><text x="30" y="245" font-weight="bold" fill="#222">Brief Processing</text><text x="30" y="260" font-weight="bold" fill="#222">Descriptions</text><text x="30" y="275" font-weight="bold" fill="#222">(Algorithm)</text><text x="230" y="245" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">1. Click Login</text><text x="230" y="260" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">   1.1 create DB connector, connect</text><text x="230" y="275" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">   1.2 new user → register, check duplicates</text><text x="230" y="290" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">   1.3 verify (username, password) against customer DB</text><text x="230" y="305" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">   1.4 on failure return error code and exit</text><text x="230" y="320" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">2. Repeat {</text><text x="230" y="335" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">   2.1 browse products</text><text x="230" y="350" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">   2.2 if checkout wanted, break</text><text x="230" y="365" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">   2.3 add wanted product to shopping cart</text><text x="230" y="380" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">   } Until (end of choice)</text><text x="230" y="395" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">3. Pay for cart or selected product (card, transfer, ...)</text><text x="230" y="410" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">4. End transaction</text><rect x="20" y="418" width="200" height="70" fill="#eef1f6" stroke="#333" stroke-width="1"/><rect x="220" y="418" width="580" height="70" fill="#fff" stroke="#333" stroke-width="1"/><text x="30" y="435" font-weight="bold" fill="#222">Relationships</text><text x="230" y="435" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">Association: Customer, Product List, Product, Purchase</text><text x="230" y="450" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">Include use-cases: Search for goods</text><text x="230" y="465" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">Extend use-cases: Shopping cart</text><text x="230" y="480" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">Generalization: None</text><rect x="20" y="488" width="200" height="26" fill="#eef1f6" stroke="#333" stroke-width="1"/><rect x="220" y="488" width="580" height="26" fill="#fff" stroke="#333" stroke-width="1"/><text x="30" y="505" font-weight="bold" fill="#222">Specific Requirements</text><text x="230" y="505" fill="#222" xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="12">Cash transfer for the purchase must finish within 30 minutes</text></svg>
