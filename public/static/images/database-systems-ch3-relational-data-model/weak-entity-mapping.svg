<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e86c1"/></marker>
    <marker id="ak" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="880" height="330" fill="#ffffff"/>

  <text x="20" y="24" font-weight="bold" fill="#555">ER diagram</text>
  <text x="400" y="24" font-weight="bold" fill="#555">Relations</text>

  <!-- ER: owner -->
  <ellipse cx="270" cy="60" rx="34" ry="16" fill="#fff" stroke="#333"/>
  <text x="270" y="64" text-anchor="middle" text-decoration="underline">Ssn</text>
  <line x1="180" y1="62" x2="236" y2="60" stroke="#333"/>
  <rect x="40" y="44" width="140" height="36" fill="#eef4fb" stroke="#333"/>
  <text x="110" y="67" text-anchor="middle" font-weight="bold">EMPLOYEE</text>
  <!-- identifying relationship -->
  <line x1="110" y1="80" x2="110" y2="116" stroke="#333"/>
  <polygon points="110,116 200,140 110,164 20,140" fill="#fff" stroke="#333"/>
  <polygon points="110,121 186,140 110,159 34,140" fill="none" stroke="#333"/>
  <text x="110" y="144" text-anchor="middle" font-size="11">DEPENDENTS_OF</text>
  <text x="118" y="104" font-size="12">1</text>
  <!-- total participation (double line) -->
  <line x1="107" y1="164" x2="107" y2="200" stroke="#333"/>
  <line x1="113" y1="164" x2="113" y2="200" stroke="#333"/>
  <text x="120" y="186" font-size="12">N</text>
  <!-- weak entity -->
  <rect x="40" y="200" width="140" height="36" fill="#fef5e7" stroke="#333"/>
  <rect x="45" y="205" width="130" height="26" fill="none" stroke="#333"/>
  <text x="110" y="223" text-anchor="middle" font-weight="bold">DEPENDENT</text>
  <ellipse cx="270" cy="218" rx="62" ry="16" fill="#fff" stroke="#333"/>
  <text x="270" y="222" text-anchor="middle">Dependent_name</text>
  <line x1="226" y1="226" x2="314" y2="226" stroke="#333" stroke-dasharray="4 3"/>
  <line x1="180" y1="218" x2="208" y2="218" stroke="#333"/>
  <text x="270" y="250" text-anchor="middle" font-size="11" fill="#d35400">partial key (dashed underline)</text>

  <line x1="330" y1="150" x2="380" y2="150" stroke="#555" stroke-width="2.5" marker-end="url(#ak)"/>

  <!-- Relations -->
  <text x="400" y="58" font-weight="bold">EMPLOYEE</text>
  <g stroke="#333" fill="#fff">
    <rect x="400" y="64" width="90" height="30" fill="#fdecea"/><rect x="490" y="64" width="80" height="30"/><rect x="570" y="64" width="80" height="30"/><rect x="650" y="64" width="50" height="30"/>
  </g>
  <g text-anchor="middle"><text x="445" y="84" text-decoration="underline">Ssn</text><text x="530" y="84">Fname</text><text x="610" y="84">Lname</text><text x="675" y="84">...</text></g>

  <text x="400" y="178" font-weight="bold">DEPENDENT</text>
  <g stroke="#333" fill="#fff">
    <rect x="400" y="184" width="80" height="30" fill="#d6eaf8"/><rect x="480" y="184" width="140" height="30" fill="#fdecea"/><rect x="620" y="184" width="50" height="30"/><rect x="670" y="184" width="70" height="30"/><rect x="740" y="184" width="110" height="30"/>
  </g>
  <g text-anchor="middle"><text x="440" y="204" text-decoration="underline">Essn</text><text x="550" y="204" text-decoration="underline">Dependent_name</text><text x="645" y="204">Sex</text><text x="705" y="204">Bdate</text><text x="795" y="204">Relationship</text></g>
  <line x1="440" y1="184" x2="440" y2="98" stroke="#2e86c1" stroke-width="2" marker-end="url(#ab)"/>
  <text x="448" y="140" font-size="12" fill="#2e86c1">FK: owner's PK</text>

  <text x="400" y="240" font-size="12" fill="#c0392b">PK = (Essn, Dependent_name) = owner PK + partial key</text>

  <g font-size="13" fill="#333">
    <text x="20" y="290">Weak entity → table with its own attributes + owner's PK as FK.  PK = owner PK + partial key.</text>
    <text x="20" y="312" fill="#555">The identifying relationship (DEPENDENTS_OF) gets no table of its own: the FK Essn already represents it.</text>
  </g>
</svg>
