<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><style>.t{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;fill:#374151}.m{font-family:'JetBrains Mono',Consolas,'D2Coding',monospace;fill:#374151}.s{font-size:13px;fill:#8A8F98;font-style:italic}</style></defs><rect width="1200" height="380" fill="#FFFFFF"/><text x="32" y="44" class="t" font-size="22" font-weight="700">같은 질문, 두 경로</text><rect x="32" y="80" width="230" height="110" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="147" y="126" class="t" font-size="18" font-weight="700" text-anchor="middle">보고서 주제</text><text x="147" y="152" class="t" font-size="14" text-anchor="middle">질문 3~5개</text><text x="147" y="174" class="t s" text-anchor="middle">비유: 같은 숙제</text><rect x="400" y="70" width="330" height="100" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="565" y="104" class="t" font-size="18" font-weight="700" text-anchor="middle">search API, fetch</text><text x="565" y="130" class="t" font-size="14" text-anchor="middle">검색 결과 상위 페이지, 정적 HTML</text><text x="565" y="152" class="t s" text-anchor="middle">비유: 모두가 보는 같은 목록</text><rect x="400" y="220" width="330" height="110" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="565" y="254" class="t" font-size="18" font-weight="700" text-anchor="middle">Playwright 브라우저</text><text x="565" y="280" class="t" font-size="14" text-anchor="middle">iframe, 스크립트 렌더 본문까지</text><text x="565" y="302" class="t s" text-anchor="middle">비유: 서가에 직접 가서 펼쳐 보기</text><rect x="868" y="70" width="300" height="100" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="1018" y="104" class="t" font-size="17" font-weight="700" text-anchor="middle">같은 몇 페이지 인용</text><text x="1018" y="130" class="t" font-size="14" text-anchor="middle">블로그 본문은 0자일 때도</text><text x="1018" y="152" class="t s" text-anchor="middle">비유: 다 비슷한 보고서</text><rect x="868" y="220" width="300" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="1018" y="254" class="t" font-size="17" font-weight="700" text-anchor="middle">1차 경험 + 출처 표</text><text x="1018" y="280" class="m" font-size="13" text-anchor="middle">URL, 작성자, 작성일, 종류</text><text x="1018" y="302" class="t s" text-anchor="middle">비유: 직접 들은 후기</text><path d="M262,120 L396,120" stroke="#4B5563" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><path d="M262,160 C330,160 330,275 396,275" stroke="#4B5563" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><path d="M730,120 L864,120" stroke="#4B5563" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><path d="M730,275 L864,275" stroke="#4B5563" stroke-width="1.8" fill="none" marker-end="url(#ah)"/></svg>
