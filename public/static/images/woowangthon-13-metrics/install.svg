  <text x="450" y="23" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">k3s-leader · monitoring</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#e6edf3">
    <text x="24" y="64" xml:space="preserve">$ kubectl -n kube-system logs job/helm-install-monitoring --previous</text>
    <text x="24" y="84" xml:space="preserve">+ helm install --namespace monitoring --version 93.1.1 monitoring monitoring/kube-prometheus-stack ...</text>
