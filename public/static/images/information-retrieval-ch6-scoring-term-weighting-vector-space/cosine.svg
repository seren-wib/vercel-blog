<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="900" height="420" fill="#fff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/></marker><marker id="k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#495057"/></marker></defs><text x="20" y="30" font-size="18"  font-weight="700" fill="#212529">Why angle (cosine), not distance</text><line x1="80" y1="385" x2="399" y2="385" stroke="#495057" marker-end="url(#k)"/><line x1="80" y1="385" x2="80" y2="66" stroke="#495057" marker-end="url(#k)"/><text x="405" y="390" font-size="14"  font-weight="400" fill="#212529">rich</text><text x="35" y="76" font-size="14"  font-weight="400" fill="#212529">poor</text><path d="M 370 385 A 290 290 0 0 0 80 95" fill="none" stroke="#ced4da" stroke-dasharray="4 4"/><line x1="80" y1="385" x2="167" y2="298" stroke="#d9480f" stroke-width="2.5" marker-end="url(#a)"/><text x="173" y="324" font-size="13"  font-weight="700" fill="#d9480f">q: rich poor</text><line x1="80" y1="385" x2="341" y2="205.2" stroke="#1c7ed6" stroke-width="2.5" marker-end="url(#a)"/><text x="347" y="201.2" font-size="13"  font-weight="700" fill="#1c7ed6">d2: Rich poor gap grows</text><line x1="80" y1="385" x2="114.8" y2="124" stroke="#495057" stroke-width="2.5" marker-end="url(#a)"/><text x="120.8" y="124" font-size="13"  font-weight="700" fill="#495057">d1: starving poets</text><line x1="80" y1="385" x2="346.8" y2="356" stroke="#495057" stroke-width="2.5" marker-end="url(#a)"/><text x="352.8" y="352" font-size="13"  font-weight="700" fill="#495057">d3: baseball salaries</text><line x1="167" y1="298" x2="341" y2="205.2" stroke="#c92a2a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="268" y="273.6" font-size="12"  font-weight="400" fill="#c92a2a">distance q–d2: BIG</text><text x="560" y="90" font-size="14"  font-weight="400" fill="#c92a2a">Distance says: q and d2 are far apart  ✗</text><text x="560" y="115" font-size="14"  font-weight="400" fill="#1c7ed6">Angle says: q and d2 point the same way  ✓</text><text x="560" y="160" font-size="15"  font-weight="700" fill="#212529">cos(q, d) = (q · d) / (|q| |d|)</text><text x="560" y="185" font-size="14"  font-weight="400" fill="#212529">= Σ qᵢdᵢ / (√Σqᵢ² · √Σdᵢ²)</text><text x="560" y="225" font-size="13"  font-weight="400" fill="#495057">length-normalize first (divide by length)</text><text x="560" y="245" font-size="13"  font-weight="400" fill="#495057">→ every vector lands on the unit circle</text><text x="560" y="265" font-size="13"  font-weight="400" fill="#495057">→ then cosine = just the dot product Σ qᵢdᵢ</text><text x="560" y="305" font-size="13"  font-weight="400" fill="#495057">d appended to itself (d'd') = same direction</text><text x="560" y="325" font-size="13"  font-weight="400" fill="#495057">→ cosine 1, even though distance is large</text></svg>