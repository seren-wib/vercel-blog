<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<rect width="720" height="360" fill="#fff"/>
<!-- CPU -->
<rect x="20" y="20" width="680" height="320" rx="10" fill="#f3f6fa" stroke="#1f2937" stroke-width="2"/>
<text x="40" y="48" font-size="18" font-weight="bold" fill="#1f2937">CPU</text>
<text x="40" y="68" font-size="12" fill="#555">Control Unit + ALU + Registers + Cache</text>
<!-- Logic circuit -->
<rect x="60" y="90" width="600" height="230" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/>
<text x="80" y="116" font-size="16" font-weight="bold" fill="#1d4ed8">Logic Circuit (e.g. ALU adder)</text>
<text x="80" y="136" font-size="12" fill="#555">many gates wired together to compute a value</text>
<!-- Logic gate -->
<rect x="110" y="160" width="500" height="140" rx="6" fill="#fff7e6" stroke="#b45309" stroke-width="2"/>
<text x="130" y="186" font-size="16" font-weight="bold" fill="#b45309">Logic Gate (AND, OR, XOR, NOT)</text>
<text x="130" y="206" font-size="12" fill="#555">one Boolean operation in hardware</text>
<!-- AND gate symbol -->
<line x1="330" y1="240" x2="370" y2="240" stroke="#000" stroke-width="2"/>
<line x1="330" y1="270" x2="370" y2="270" stroke="#000" stroke-width="2"/>
<path transform="translate(370,230)" d="M0,0 H30 A25,25 0 0 1 30,50 H0 Z" fill="#fff" stroke="#000" stroke-width="2"/>
<line x1="425" y1="255" x2="465" y2="255" stroke="#000" stroke-width="2"/>
<text x="318" y="244" font-size="12">A</text>
<text x="318" y="274" font-size="12">B</text>
<text x="470" y="259" font-size="12">Y</text>
<text x="130" y="285" font-size="12" fill="#555">gate &lt; circuit &lt; CPU</text>
</svg>
