<g><circle cx="100" cy="42" r="9" class="ln"/><line x1="100" y1="51" x2="100" y2="76" class="ln"/><line x1="86" y1="60" x2="114" y2="60" class="ln"/><line x1="100" y1="76" x2="88" y2="94" class="ln"/><line x1="100" y1="76" x2="112" y2="94" class="ln"/><text class="t" x="100" y="110">Student</text></g><text class="t" x="100" y="140" font-weight="bold">Actor</text><text class="t sm" x="100" y="155" fill="#555">role outside the system</text><ellipse class="uc" cx="340" cy="60" rx="75" ry="19"/><text class="t" x="340" y="64">Register Course</text><text class="t" x="340" y="140" font-weight="bold">Use Case</text><text class="t sm" x="340" y="155" fill="#555">one function for an actor</text><rect class="sys" x="480" y="22" width="200" height="90"/><text class="t sm" x="580" y="40">&lt;Course Registration System&gt;</text><ellipse class="uc" cx="580" cy="75" rx="50" ry="16"/><text class="t" x="580" y="79">Login</text><text class="t" x="580" y="140" font-weight="bold">System Boundary</text><text class="t sm" x="580" y="155" fill="#555">use cases inside, actors outside</text><rect class="ext" x="755" y="37" width="150" height="50"/><text class="t" x="830" y="59">Personal</text><text class="t" x="830" y="73">Information System</text><text class="t" x="830" y="140" font-weight="bold">External System</text><text class="t sm" x="830" y="155" fill="#555">outside DB or system, drawn as a box</text><g><circle cx="60" cy="242" r="9" class="ln"/><line x1="60" y1="251" x2="60" y2="276" class="ln"/><line x1="46" y1="260" x2="74" y2="260" class="ln"/><line x1="60" y1="276" x2="48" y2="294" class="ln"/><line x1="60" y1="276" x2="72" y2="294" class="ln"/><text class="t" x="60" y="310">Student</text></g><ellipse class="uc" cx="230" cy="255" rx="65" ry="17"/><text class="t" x="230" y="259">Register Course</text><line class="ln" x1="74" y1="258" x2="165.2" y2="256.2"/><text class="t" x="150" y="330" font-weight="bold">Association</text><text class="t sm" x="150" y="345" fill="#555">actor performs this use case</text><ellipse class="uc" cx="420" cy="255" rx="50" ry="20"/><text class="t sm" x="420" y="252">Register</text><text class="t sm" x="420" y="265">Course</text><ellipse class="uc" cx="610" cy="255" rx="45" ry="18"/><text class="t" x="610" y="259">Login</text><line class="dash" x1="470.0" y1="255.0" x2="565.0" y2="255.0" marker-end="url(#open)"/><text class="lab" x="515" y="246">&lt;&lt;include&gt;&gt;</text><text class="t" x="515" y="330" font-weight="bold">Include</text><text class="t sm" x="515" y="345" fill="#555">base → included; always runs with the base</text><ellipse class="uc" cx="760" cy="255" rx="50" ry="20"/><text class="t sm" x="760" y="252">Purchase</text><text class="t sm" x="760" y="265">Products</text><ellipse class="uc" cx="900" cy="255" rx="50" ry="18"/><text class="t" x="900" y="259">Add to Cart</text><line class="dash" x1="850.0" y1="255.0" x2="810.0" y2="255.0" marker-end="url(#open)"/><text class="lab" x="830" y="246">&lt;&lt;extend&gt;&gt;</text><text class="t" x="830" y="330" font-weight="bold">Extend</text><text class="t sm" x="830" y="345" fill="#555">extension → base; optional, may not run</text><g><circle cx="80" cy="402" r="9" class="ln"/><line x1="80" y1="411" x2="80" y2="436" class="ln"/><line x1="66" y1="420" x2="94" y2="420" class="ln"/><line x1="80" y1="436" x2="68" y2="454" class="ln"/><line x1="80" y1="436" x2="92" y2="454" class="ln"/><text class="t" x="80" y="470">Student</text></g><g><circle cx="160" cy="402" r="9" class="ln"/><line x1="160" y1="411" x2="160" y2="436" class="ln"/><line x1="146" y1="420" x2="174" y2="420" class="ln"/><line x1="160" y1="436" x2="148" y2="454" class="ln"/><line x1="160" y1="436" x2="172" y2="454" class="ln"/><text class="t" x="160" y="470">Professor</text></g><g><circle cx="300" cy="402" r="9" class="ln"/><line x1="300" y1="411" x2="300" y2="436" class="ln"/><line x1="286" y1="420" x2="314" y2="420" class="ln"/><line x1="300" y1="436" x2="288" y2="454" class="ln"/><line x1="300" y1="436" x2="312" y2="454" class="ln"/><text class="t" x="300" y="470">Person</text></g><polyline class="ln" points="80,393 80,380 300,380 300,392" marker-end="url(#tri)"/><line class="ln" x1="160" y1="393" x2="160" y2="380"/><ellipse class="uc" cx="520" cy="425" rx="55" ry="17"/><text class="t" x="520" y="429">Pay Bill</text><ellipse class="uc" cx="700" cy="405" rx="55" ry="15"/><text class="t" x="700" y="409">Pay by Card</text><ellipse class="uc" cx="700" cy="445" rx="60" ry="15"/><text class="t" x="700" y="449">Pay by Balance</text><line class="ln" x1="645" y1="405" x2="577" y2="418" marker-end="url(#tri)"/><line class="ln" x1="640" y1="445" x2="577" y2="432" marker-end="url(#tri)"/><text class="t" x="860" y="420" font-weight="bold">Generalization</text><text class="t sm" x="860" y="435" fill="#555">child → parent, solid line, hollow triangle</text><text class="t sm" x="860" y="450" fill="#555">actor or use case (4 kinds in the slide)</text></svg>
