<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="900" height="360" fill="#fff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/></marker><marker id="k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#495057"/></marker></defs><text x="20" y="30" font-size="18"  font-weight="700" fill="#212529">Top k with a binary min heap (k = 7)</text><line x1="230" y1="80" x2="130" y2="160" stroke="#adb5bd" stroke-width="2"/><line x1="230" y1="80" x2="330" y2="160" stroke="#adb5bd" stroke-width="2"/><line x1="130" y1="160" x2="80" y2="240" stroke="#adb5bd" stroke-width="2"/><line x1="130" y1="160" x2="180" y2="240" stroke="#adb5bd" stroke-width="2"/><line x1="330" y1="160" x2="280" y2="240" stroke="#adb5bd" stroke-width="2"/><line x1="330" y1="160" x2="380" y2="240" stroke="#adb5bd" stroke-width="2"/><circle cx="230" cy="80" r="26" fill="#ffd8a8" stroke="#868e96"/><text x="230" y="85" font-size="14" text-anchor="middle" font-weight="700" fill="#212529">0.6</text><circle cx="130" cy="160" r="26" fill="#e7f5ff" stroke="#868e96"/><text x="130" y="165" font-size="14" text-anchor="middle" font-weight="400" fill="#212529">0.85</text><circle cx="330" cy="160" r="26" fill="#e7f5ff" stroke="#868e96"/><text x="330" y="165" font-size="14" text-anchor="middle" font-weight="400" fill="#212529">0.7</text><circle cx="80" cy="240" r="26" fill="#e7f5ff" stroke="#868e96"/><text x="80" y="245" font-size="14" text-anchor="middle" font-weight="400" fill="#212529">0.9</text><circle cx="180" cy="240" r="26" fill="#e7f5ff" stroke="#868e96"/><text x="180" y="245" font-size="14" text-anchor="middle" font-weight="400" fill="#212529">0.97</text><circle cx="280" cy="240" r="26" fill="#e7f5ff" stroke="#868e96"/><text x="280" y="245" font-size="14" text-anchor="middle" font-weight="400" fill="#212529">0.8</text><circle cx="380" cy="240" r="26" fill="#e7f5ff" stroke="#868e96"/><text x="380" y="245" font-size="14" text-anchor="middle" font-weight="400" fill="#212529">0.95</text><text x="230" y="52" font-size="12" text-anchor="middle" font-weight="400" fill="#d9480f">root = smallest of the top k</text><text x="230" y="300" font-size="13" text-anchor="middle" font-weight="400" fill="#495057">every parent &lt; its children</text><text x="480" y="90" font-size="15"  font-weight="700" fill="#212529">New document with score s:</text><text x="480" y="120" font-size="14"  font-weight="400" fill="#212529">s ≤ root (0.6)  →  skip (not top k)</text><text x="480" y="148" font-size="14"  font-weight="400" fill="#212529">s > root  →  delete root, add s   O(log k)</text><text x="480" y="190" font-size="14"  font-weight="400" fill="#495057">e.g. s = 0.5 → skip</text><text x="480" y="214" font-size="14"  font-weight="400" fill="#495057">e.g. s = 0.75 → 0.6 out, 0.75 in, new root 0.7</text><text x="480" y="260" font-size="14"  font-weight="700" fill="#212529">N documents × log k each = O(N log k)</text><text x="480" y="284" font-size="14"  font-weight="400" fill="#212529">read off the k winners: O(k log k)</text></svg>