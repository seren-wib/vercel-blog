<svg xmlns="http://www.w3.org/2000/svg" width="820" height="534" viewBox="0 0 820 534" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs>
  <marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#333" stroke-width="1.4"/></marker>
  <marker id="tri" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,7 L0,14 Z" fill="#fff" stroke="#333" stroke-width="1.4"/></marker>
</defs>
<style>
  .uc { fill:#fff; stroke:#333; stroke-width:1.4; }
  .hub { fill:#efe3f6; stroke:#333; stroke-width:1.4; }
  .sys { fill:#eef6ea; stroke:#333; stroke-width:1.6; }
