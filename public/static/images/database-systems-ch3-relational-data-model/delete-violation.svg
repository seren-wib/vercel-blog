<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e86c1"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="860" height="340" fill="#ffffff"/>

  <text x="40" y="58" font-weight="bold" font-size="15">WORKS_ON</text>
  <text x="150" y="58" font-size="12" fill="#2e86c1" font-weight="bold">Essn = FK</text>
  <text x="520" y="58" font-weight="bold" font-size="15">EMPLOYEE</text>
  <text x="640" y="58" font-size="12" fill="#c0392b" font-weight="bold">Ssn = PK</text>

  <!-- WORKS_ON -->
  <g stroke="#333" fill="#dfe8f5">
    <rect x="40" y="70" width="110" height="34" fill="#d6eaf8"/><rect x="150" y="70" width="60" height="34"/><rect x="210" y="70" width="70" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="bold"><text x="95" y="92" text-decoration="underline">Essn</text><text x="180" y="92" text-decoration="underline">Pno</text><text x="245" y="92">Hours</text></g>
  <g stroke="#333" fill="#ffffff">
    <rect x="40" y="104" width="110" height="34"/><rect x="150" y="104" width="60" height="34"/><rect x="210" y="104" width="70" height="34"/>
    <rect x="40" y="138" width="110" height="34"/><rect x="150" y="138" width="60" height="34"/><rect x="210" y="138" width="70" height="34"/>
    <rect x="40" y="172" width="110" height="34"/><rect x="150" y="172" width="60" height="34"/><rect x="210" y="172" width="70" height="34"/>
  </g>
  <g text-anchor="middle">
    <text x="95" y="126" fill="#c0392b">999887777</text><text x="180" y="126">30</text><text x="245" y="126">30.0</text>
    <text x="95" y="160" fill="#c0392b">999887777</text><text x="180" y="160">10</text><text x="245" y="160">10.0</text>
    <text x="95" y="194">333445555</text><text x="180" y="194">2</text><text x="245" y="194">10.0</text>
  </g>
  <rect x="40" y="138" width="240" height="34" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="40" y="226" font-size="12" fill="#27ae60" font-weight="bold">delete this row: OK (nobody references it)</text>

  <!-- EMPLOYEE -->
  <g stroke="#333" fill="#dfe8f5">
    <rect x="520" y="70" width="100" height="34"/><rect x="620" y="70" width="120" height="34" fill="#d6eaf8"/>
  </g>
  <g text-anchor="middle" font-weight="bold"><text x="570" y="92">Fname</text><text x="680" y="92" text-decoration="underline">Ssn</text></g>
  <g stroke="#333" fill="#ffffff">
    <rect x="520" y="104" width="100" height="34"/><rect x="620" y="104" width="120" height="34"/>
    <rect x="520" y="138" width="100" height="34" fill="#fdecea"/><rect x="620" y="138" width="120" height="34" fill="#fdecea"/>
  </g>
  <rect x="520" y="138" width="220" height="34" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <g text-anchor="middle">
    <text x="570" y="126">Franklin</text><text x="680" y="126">333445555</text>
    <text x="570" y="160">Alicia</text><text x="680" y="160" fill="#c0392b">999887777</text>
  </g>
  <text x="750" y="160" font-size="13" fill="#c0392b" font-weight="bold">DELETE?</text>

  <!-- arrows FK -> PK -->
  <line x1="280" y1="121" x2="516" y2="151" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="280" y1="155" x2="516" y2="157" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="280" y1="189" x2="516" y2="124" stroke="#2e86c1" stroke-width="2" marker-end="url(#ab)"/>

  <g font-size="13" fill="#333">
    <text x="40" y="266"><tspan font-weight="bold" fill="#c0392b">Delete Alicia (999887777):</tspan>  2 WORKS_ON tuples still point to her  →  referential integrity violated</text>
    <text x="40" y="292"><tspan font-weight="bold">Delete</tspan> can only break referential integrity: a deleted tuple cannot create a duplicate key or a NULL key.</text>
    <text x="40" y="318" fill="#555">Check before deleting: is this tuple's PK used as an FK value anywhere else?</text>
  </g>
</svg>
