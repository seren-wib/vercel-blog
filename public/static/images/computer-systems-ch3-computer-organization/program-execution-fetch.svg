<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" font-family="Pretendard, -apple-system, BlinkMacSystemFont, AppleGothic, sans-serif" font-size="13">
  <rect width="760" height="390" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">첫 번째 명령어(156C) 인출 과정 : [A0:A1] → IR, PC(A0 → A2)</text>

  <!-- CPU Box -->
  <rect x="35" y="55" width="320" height="310" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="195" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#0369a1">CPU</text>

  <!-- General Registers -->
  <rect x="55" y="95" width="120" height="250" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="115" y="116" text-anchor="middle" font-weight="bold" fill="#334155">범용 레지스터</text>
  <text x="68" y="142" fill="#475569">R0</text><rect x="95" y="129" width="65" height="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="68" y="168" fill="#475569">R1</text><rect x="95" y="155" width="65" height="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="68" y="194" fill="#475569">⋮</text>
  <text x="68" y="220" font-weight="bold" fill="#0f172a">R5</text><rect x="95" y="207" width="65" height="18" fill="#fef3c7" stroke="#f59e0b"/><text x="127" y="220" text-anchor="middle" font-size="11" fill="#b45309">[6C] 적재</text>
  <text x="68" y="246" font-weight="bold" fill="#0f172a">R6</text><rect x="95" y="233" width="65" height="18" fill="#fef3c7" stroke="#f59e0b"/><text x="127" y="246" text-anchor="middle" font-size="11" fill="#b45309">[6D] 적재</text>
  <text x="68" y="280" fill="#475569">⋮</text>
  <text x="68" y="320" fill="#475569">RF</text><rect x="95" y="307" width="65" height="18" fill="#f8fafc" stroke="#cbd5e1"/>

  <!-- PC Box -->
  <rect x="190" y="110" width="150" height="90" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="265" y="132" text-anchor="middle" font-weight="bold" fill="#0f172a">프로그램 카운터 (PC)</text>
  <rect x="205" y="145" width="48" height="28" rx="4" fill="#e2e8f0" stroke="#64748b"/>
  <text x="229" y="164" text-anchor="middle" font-weight="bold" fill="#334155">A0</text>
  <line x1="257" y1="159" x2="275" y2="159" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="280" y="145" width="48" height="28" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="304" y="164" text-anchor="middle" font-weight="bold" fill="#c2410c">A2</text>
  <text x="265" y="190" text-anchor="middle" font-size="11" fill="#c2410c">인출 후 +2 갱신 (2바이트)</text>

  <!-- IR Box -->
  <rect x="190" y="225" width="150" height="85" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="265" y="247" text-anchor="middle" font-weight="bold" fill="#0f172a">명령 레지스터 (IR)</text>
  <rect x="215" y="258" width="100" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="265" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">156C</text>
  <text x="265" y="303" text-anchor="middle" font-size="11" fill="#1e40af">LOAD R5, [6C]</text>

  <!-- Bus -->
  <rect x="355" y="190" width="95" height="26" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="402" y="208" text-anchor="middle" font-weight="bold" fill="#334155">버스 (Bus)</text>

  <!-- Main Memory Box -->
  <rect x="450" y="55" width="275" height="310" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="587" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">주기억장치 (RAM)</text>
  <text x="490" y="103" text-anchor="middle" font-weight="bold" fill="#475569">주소</text>
  <text x="545" y="103" text-anchor="middle" font-weight="bold" fill="#475569">셀(1B)</text>
  <text x="645" y="103" text-anchor="middle" font-weight="bold" fill="#475569">명령어(2B)</text>

  <!-- Memory Cells A0~A9 -->
  <!-- A0, A1 -->
  <text x="490" y="128" text-anchor="middle" font-weight="bold" fill="#1d4ed8">A0</text>
  <rect x="520" y="113" width="50" height="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="545" y="129" text-anchor="middle" font-weight="bold" fill="#1d4ed8">15</text>

  <text x="490" y="152" text-anchor="middle" font-weight="bold" fill="#1d4ed8">A1</text>
  <rect x="520" y="137" width="50" height="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="545" y="153" text-anchor="middle" font-weight="bold" fill="#1d4ed8">6C</text>
  <text x="645" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">156C (LOAD R5, [6C])</text>

  <!-- A2, A3 -->
  <text x="490" y="178" text-anchor="middle" font-weight="bold" fill="#c2410c">A2</text>
  <rect x="520" y="163" width="50" height="22" fill="#ffedd5" stroke="#ea580c"/>
  <text x="545" y="179" text-anchor="middle" fill="#9a3412">16</text>

  <text x="490" y="202" text-anchor="middle" fill="#334155">A3</text>
  <rect x="520" y="187" width="50" height="22" fill="#ffedd5" stroke="#ea580c"/>
  <text x="545" y="203" text-anchor="middle" fill="#9a3412">6D</text>
  <text x="645" y="191" text-anchor="middle" font-size="12" fill="#9a3412">166D (LOAD R6, [6D])</text>

  <!-- A4, A5 -->
  <text x="490" y="228" text-anchor="middle" fill="#334155">A4</text>
  <rect x="520" y="213" width="50" height="22" fill="#ffffff" stroke="#94a3b8"/>
  <text x="545" y="229" text-anchor="middle" fill="#334155">50</text>

  <text x="490" y="252" text-anchor="middle" fill="#334155">A5</text>
  <rect x="520" y="237" width="50" height="22" fill="#ffffff" stroke="#94a3b8"/>
  <text x="545" y="253" text-anchor="middle" fill="#334155">56</text>
  <text x="645" y="241" text-anchor="middle" font-size="12" fill="#475569">5056 (ADD R0, R5, R6)</text>

  <!-- A6, A7 -->
  <text x="490" y="278" text-anchor="middle" fill="#334155">A6</text>
  <rect x="520" y="263" width="50" height="22" fill="#ffffff" stroke="#94a3b8"/>
  <text x="545" y="279" text-anchor="middle" fill="#334155">30</text>

  <text x="490" y="302" text-anchor="middle" fill="#334155">A7</text>
  <rect x="520" y="287" width="50" height="22" fill="#ffffff" stroke="#94a3b8"/>
  <text x="545" y="303" text-anchor="middle" fill="#334155">6E</text>
  <text x="645" y="291" text-anchor="middle" font-size="12" fill="#475569">306E (STORE R0, [6E])</text>

  <!-- A8, A9 -->
  <text x="490" y="328" text-anchor="middle" fill="#334155">A8</text>
  <rect x="520" y="313" width="50" height="22" fill="#ffffff" stroke="#94a3b8"/>
  <text x="545" y="329" text-anchor="middle" fill="#334155">C0</text>

  <text x="490" y="352" text-anchor="middle" fill="#334155">A9</text>
  <rect x="520" y="337" width="50" height="22" fill="#ffffff" stroke="#94a3b8"/>
  <text x="545" y="353" text-anchor="middle" fill="#334155">00</text>
  <text x="645" y="341" text-anchor="middle" font-size="12" fill="#475569">C000 (HALT)</text>

  <!-- Fetch Arrow from [A0:A1] to IR -->
  <path d="M 520 136 L 410 136 L 410 273 L 322 273" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
</svg>

