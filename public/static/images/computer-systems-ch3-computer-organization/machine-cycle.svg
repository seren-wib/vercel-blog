<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="Pretendard, -apple-system, BlinkMacSystemFont, AppleGothic, sans-serif" font-size="14">
  <rect width="760" height="320" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">기계 주기 (Machine Cycle) : Fetch → Decode → Execute</text>

  <!-- Box 1: Fetch -->
  <rect x="40" y="75" width="200" height="145" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="40" y="75" width="200" height="36" rx="10" fill="#3b82f6"/>
  <text x="140" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">① 인출 (Fetch)</text>
  <text x="56" y="136" font-size="13" fill="#1e293b">• PC가 가리키는 주소에서</text>
  <text x="66" y="156" font-size="13" fill="#1e293b">명령어를 읽어 IR에 저장</text>
  <text x="56" y="184" font-size="13" font-weight="bold" fill="#1d4ed8">• PC를 다음 명령어 주소로</text>
  <text x="66" y="204" font-size="13" font-weight="bold" fill="#1d4ed8">즉시 갱신</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="240" y1="147" x2="272" y2="147" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 2: Decode -->
  <rect x="280" y="75" width="200" height="145" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="280" y="75" width="200" height="36" rx="10" fill="#3b82f6"/>
  <text x="380" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">② 해석 (Decode)</text>
  <text x="296" y="136" font-size="13" fill="#1e293b">• 제어장치가 IR의</text>
  <text x="306" y="156" font-size="13" fill="#1e293b">비트 패턴을 해석</text>
  <text x="296" y="184" font-size="13" fill="#1e293b">• 수행할 연산(Opcode)과</text>
  <text x="306" y="204" font-size="13" fill="#1e293b">필요한 피연산자 결정</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="480" y1="147" x2="512" y2="147" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 3: Execute -->
  <rect x="520" y="75" width="200" height="145" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="520" y="75" width="200" height="36" rx="10" fill="#3b82f6"/>
  <text x="620" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">③ 실행 (Execute)</text>
  <text x="536" y="136" font-size="13" fill="#1e293b">• 해석 결과에 따라</text>
  <text x="546" y="156" font-size="13" fill="#1e293b">실제 동작 수행</text>
  <text x="536" y="184" font-size="13" fill="#1e293b">• 데이터 이동, 산술 연산,</text>
  <text x="546" y="204" font-size="13" fill="#1e293b">메모리 저장, 분기 등</text>

  <!-- Loop back arrow 3 -> 1 -->
  <path d="M 620 220 L 620 275 L 140 275 L 140 228" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="265" y="260" width="230" height="28" rx="6" fill="#dbeafe"/>
  <text x="380" y="279" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">다음 명령어 인출 반복 (HALT 전까지)</text>
</svg>

