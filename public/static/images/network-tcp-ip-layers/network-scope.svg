<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="Pretendard, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="360" fill="#ffffff" rx="8"/>
  <text x="20" y="32" font-size="16" font-weight="bold" fill="#1e293b">Network scope: PAN → LAN → MAN → WAN</text>

  <!-- WAN -->
  <rect x="20" y="50" width="720" height="290" rx="14" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="36" y="74" font-weight="bold" fill="#92400e">WAN</text>
  <text x="80" y="74" font-size="11" fill="#92400e">cities · countries (e.g. Seoul HQ ↔ Busan branch)</text>

  <!-- MAN -->
  <rect x="36" y="86" width="500" height="240" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="50" y="108" font-weight="bold" fill="#166534">MAN</text>
  <text x="92" y="108" font-size="11" fill="#166534">LANs in one city / campus</text>

  <!-- LAN 1 -->
  <rect x="52" y="120" width="270" height="190" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="66" y="142" font-weight="bold" fill="#1e3a8a">LAN</text>
  <text x="102" y="142" font-size="11" fill="#1e3a8a">one building (Ethernet, Wi-Fi)</text>

  <!-- PAN -->
  <rect x="66" y="156" width="150" height="140" rx="10" fill="#fce7f3" stroke="#ec4899"/>
  <text x="80" y="178" font-weight="bold" fill="#9d174d">PAN</text>
  <text x="80" y="194" font-size="11" fill="#9d174d">around one person</text>
  <rect x="80" y="206" width="70" height="28" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="115" y="225" text-anchor="middle" font-size="11" fill="#1e293b">phone</text>
  <rect x="80" y="256" width="70" height="28" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="115" y="275" text-anchor="middle" font-size="11" fill="#1e293b">earbuds</text>
  <line x1="115" y1="234" x2="115" y2="256" stroke="#ec4899" stroke-dasharray="3 3"/>
  <text x="158" y="250" font-size="10" fill="#9d174d">Bluetooth</text>

  <rect x="236" y="206" width="72" height="28" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="272" y="225" text-anchor="middle" font-size="11" fill="#1e293b">PC</text>
  <rect x="236" y="256" width="72" height="28" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="272" y="275" text-anchor="middle" font-size="11" fill="#1e293b">printer</text>

  <!-- LAN 2 -->
  <rect x="350" y="120" width="170" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="364" y="142" font-weight="bold" fill="#1e3a8a">LAN</text>
  <text x="364" y="160" font-size="11" fill="#1e3a8a">library building</text>
  <rect x="350" y="230" width="170" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="364" y="252" font-weight="bold" fill="#1e3a8a">LAN</text>
  <text x="364" y="270" font-size="11" fill="#1e3a8a">engineering building</text>
  <line x1="322" y1="160" x2="350" y2="160" stroke="#22c55e" stroke-width="2"/>
  <line x1="322" y1="270" x2="350" y2="270" stroke="#22c55e" stroke-width="2"/>
  <line x1="435" y1="200" x2="435" y2="230" stroke="#22c55e" stroke-width="2"/>

  <!-- other city -->
  <rect x="580" y="150" width="140" height="90" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="594" y="172" font-weight="bold" fill="#1e3a8a">LAN</text>
  <text x="594" y="190" font-size="11" fill="#1e3a8a">another city</text>
  <circle cx="558" cy="196" r="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="558" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">R</text>
  <line x1="536" y1="196" x2="546" y2="196" stroke="#f59e0b" stroke-width="2"/>
  <line x1="570" y1="196" x2="580" y2="196" stroke="#f59e0b" stroke-width="2"/>
  <text x="558" y="226" text-anchor="middle" font-size="10" fill="#92400e">router</text>
</svg>
