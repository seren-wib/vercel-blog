<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="1200" height="340" fill="#FFFFFF"/><text x="32" y="44" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#374151" text-anchor="start">repo에서 Google Docs로, 한 방향</text><rect x="32" y="90" width="230" height="170" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="46" y="118" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#374151" text-anchor="start">git push main</text><text x="46" y="140" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 원본 고치기</text><text x="46" y="162" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="14" font-weight="400" fill="#374151" text-anchor="start">docs/specs/**</text><text x="46" y="184" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="14" font-weight="400" fill="#374151" text-anchor="start">docs/images/**</text><rect x="300" y="90" width="300" height="170" rx="10" fill="#EAF2FF" stroke="#3B6FD8" stroke-width="1.6"/><text x="314" y="118" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#234C9E" text-anchor="start">GitHub Actions</text><text x="314" y="140" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 복사 담당</text><text x="314" y="162" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">Mermaid → PNG</text><text x="314" y="184" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">절 파일을 순서대로 합침</text><text x="314" y="206" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">커밋 SHA 도장</text><rect x="638" y="90" width="250" height="170" rx="10" fill="#FFF4E0" stroke="#C98A1B" stroke-width="1.6"/><text x="652" y="118" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#8A5D0C" text-anchor="start">OIDC → WIF</text><text x="652" y="140" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 출입증 즉석 발급</text><text x="652" y="162" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">JSON 키 없음</text><text x="652" y="184" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">repository_owner 조건</text><text x="652" y="206" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">→ service account</text><rect x="926" y="90" width="242" height="170" rx="10" fill="#F1EBFF" stroke="#7A5AD6" stroke-width="1.6"/><text x="940" y="118" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#4E3496" text-anchor="start">Google Doc</text><text x="940" y="140" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 게시판</text><text x="940" y="162" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">Drive files.update</text><text x="940" y="184" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">같은 Doc ID, 링크 그대로</text><text x="940" y="206" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">댓글 권한만</text><line x1="262" y1="175" x2="300" y2="175" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><line x1="600" y1="175" x2="638" y2="175" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><line x1="888" y1="175" x2="926" y2="175" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><line x1="1047" y1="300" x2="147" y2="300" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="6 4"/><text x="597" y="322" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="middle">댓글은 repo를 고쳐서 답한다</text><line x1="1047" y1="260" x2="1047" y2="300" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="6 4"/><line x1="147" y1="300" x2="147" y2="262" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/></svg>