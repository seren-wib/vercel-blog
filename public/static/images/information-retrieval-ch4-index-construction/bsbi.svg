<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="900" height="330" fill="#fff"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#495057"/></marker></defs>
<text x="20" y="30" font-size="18" font-weight="700" fill="#212529">BSBI on RCV1: 100M postings, 10 blocks of 10M</text><rect x="20" y="120" width="120" height="90" rx="6" fill="#f1f3f5" stroke="#868e96"/><text x="80" y="153" font-size="13" text-anchor="middle" fill="#212529">documents</text><text x="80" y="170" font-size="13" text-anchor="middle" fill="#212529">(parse one</text><text x="80" y="187" font-size="13" text-anchor="middle" fill="#212529">at a time)</text><text x="330" y="62" font-size="14" font-weight="700" text-anchor="middle" fill="#1c7ed6">in memory, one block at a time</text><rect x="175" y="70" width="310" height="230" rx="8" fill="none" stroke="#1c7ed6" stroke-dasharray="5 4"/><rect x="190" y="90" width="80" height="40" rx="6" fill="#e7f5ff" stroke="#868e96"/><text x="230" y="115" font-size="13" text-anchor="middle" fill="#212529">block 1</text><line x1="272" y1="110" x2="298" y2="110" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><rect x="300" y="90" width="170" height="40" rx="6" fill="#e7f5ff" stroke="#868e96"/><text x="385" y="115" font-size="13" text-anchor="middle" fill="#212529">accumulate → sort</text><rect x="190" y="150" width="80" height="40" rx="6" fill="#e7f5ff" stroke="#868e96"/><text x="230" y="175" font-size="13" text-anchor="middle" fill="#212529">block 2</text><line x1="272" y1="170" x2="298" y2="170" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><rect x="300" y="150" width="170" height="40" rx="6" fill="#e7f5ff" stroke="#868e96"/><text x="385" y="175" font-size="13" text-anchor="middle" fill="#212529">accumulate → sort</text><rect x="190" y="240" width="80" height="40" rx="6" fill="#e7f5ff" stroke="#868e96"/><text x="230" y="265" font-size="13" text-anchor="middle" fill="#212529">block 10</text><line x1="272" y1="260" x2="298" y2="260" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><rect x="300" y="240" width="170" height="40" rx="6" fill="#e7f5ff" stroke="#868e96"/><text x="385" y="265" font-size="13" text-anchor="middle" fill="#212529">accumulate → sort</text><text x="330" y="222" font-size="18" text-anchor="middle" fill="#868e96">⋮</text><line x1="142" y1="165" x2="188" y2="110" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><line x1="142" y1="165" x2="188" y2="170" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><line x1="142" y1="165" x2="188" y2="260" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><text x="600" y="62" font-size="14" font-weight="700" text-anchor="middle" fill="#d9480f">on disk</text><line x1="472" y1="110" x2="548" y2="110" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><rect x="550" y="90" width="100" height="40" rx="6" fill="#fff4e6" stroke="#868e96"/><text x="600" y="115" font-size="13" text-anchor="middle" fill="#212529">f1 (sorted)</text><line x1="472" y1="170" x2="548" y2="170" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><rect x="550" y="150" width="100" height="40" rx="6" fill="#fff4e6" stroke="#868e96"/><text x="600" y="175" font-size="13" text-anchor="middle" fill="#212529">f2 (sorted)</text><line x1="472" y1="260" x2="548" y2="260" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><rect x="550" y="240" width="100" height="40" rx="6" fill="#fff4e6" stroke="#868e96"/><text x="600" y="265" font-size="13" text-anchor="middle" fill="#212529">f10 (sorted)</text><text x="525" y="83" font-size="12" text-anchor="middle" fill="#495057">write</text><text x="600" y="222" font-size="18" text-anchor="middle" fill="#868e96">⋮</text><line x1="652" y1="110" x2="718" y2="160" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><line x1="652" y1="170" x2="718" y2="170" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><line x1="652" y1="260" x2="718" y2="180" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><text x="800" y="126" font-size="12" text-anchor="middle" fill="#495057">merge</text><rect x="720" y="135" width="160" height="70" rx="6" fill="#fff4e6" stroke="#868e96"/><text x="800" y="166.5" font-size="14" text-anchor="middle" fill="#212529">f merged</text><text x="800" y="183.5" font-size="14" text-anchor="middle" fill="#212529">= final index</text><text x="20" y="322" font-size="13" fill="#495057">posting = termID 4 B + docID 4 B + term frequency 4 B = 12 B   ·   block = 10M postings = 120 MB, fits in memory</text></svg>