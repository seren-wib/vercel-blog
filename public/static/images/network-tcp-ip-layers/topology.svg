<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="Pretendard, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="330" fill="#ffffff" rx="8"/>
  <text x="20" y="32" font-size="16" font-weight="bold" fill="#1e293b">Network topologies</text>

  <!-- Bus -->
  <text x="100" y="66" text-anchor="middle" font-weight="bold" fill="#1e293b">Bus</text>
  <text x="100" y="82" text-anchor="middle" font-size="11" fill="#64748b">one shared line</text>
  <line x1="20" y1="170" x2="180" y2="170" stroke="#475569" stroke-width="5"/>
  <line x1="50" y1="130" x2="50" y2="170" stroke="#475569"/>
  <line x1="150" y1="130" x2="150" y2="170" stroke="#475569"/>
  <line x1="100" y1="170" x2="100" y2="210" stroke="#475569"/>
  <circle cx="50" cy="120" r="11" fill="#dbeafe" stroke="#3b82f6"/><text x="50" y="124" text-anchor="middle" font-size="10">A</text>
  <circle cx="150" cy="120" r="11" fill="#dbeafe" stroke="#3b82f6"/><text x="150" y="124" text-anchor="middle" font-size="10">B</text>
  <circle cx="100" cy="220" r="11" fill="#dbeafe" stroke="#3b82f6"/><text x="100" y="224" text-anchor="middle" font-size="10">C</text>
  <text x="100" y="262" text-anchor="middle" font-size="11" fill="#1e293b">all devices see every signal</text>
  <text x="100" y="280" text-anchor="middle" font-size="11" fill="#b91c1c">weak point: the line</text>
  <text x="100" y="298" text-anchor="middle" font-size="11" fill="#b91c1c">2 senders at once → collision</text>

  <!-- Star -->
  <text x="290" y="66" text-anchor="middle" font-weight="bold" fill="#1e293b">Star</text>
  <text x="290" y="82" text-anchor="middle" font-size="11" fill="#64748b">each device → center</text>
  <line x1="290" y1="165" x2="290" y2="115" stroke="#475569"/>
  <line x1="290" y1="165" x2="240" y2="165" stroke="#475569"/>
  <line x1="290" y1="165" x2="340" y2="165" stroke="#475569"/>
  <line x1="290" y1="165" x2="290" y2="215" stroke="#475569"/>
  <circle cx="290" cy="105" r="11" fill="#dbeafe" stroke="#3b82f6"/>
  <circle cx="230" cy="165" r="11" fill="#dbeafe" stroke="#3b82f6"/>
  <circle cx="350" cy="165" r="11" fill="#dbeafe" stroke="#3b82f6"/>
  <circle cx="290" cy="225" r="11" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="262" y="152" width="56" height="26" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="290" y="169" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">switch/AP</text>
  <text x="290" y="262" text-anchor="middle" font-size="11" fill="#1e293b">switch sends only to</text>
  <text x="290" y="280" text-anchor="middle" font-size="11" fill="#1e293b">the destination port</text>
  <text x="290" y="298" text-anchor="middle" font-size="11" fill="#b91c1c">weak point: the center</text>

  <!-- Tree -->
  <text x="475" y="66" text-anchor="middle" font-weight="bold" fill="#1e293b">Tree</text>
  <text x="475" y="82" text-anchor="middle" font-size="11" fill="#64748b">stars in layers</text>
  <line x1="475" y1="110" x2="430" y2="160" stroke="#475569"/>
  <line x1="475" y1="110" x2="520" y2="160" stroke="#475569"/>
  <line x1="430" y1="160" x2="405" y2="215" stroke="#475569"/>
  <line x1="430" y1="160" x2="455" y2="215" stroke="#475569"/>
  <line x1="520" y1="160" x2="495" y2="215" stroke="#475569"/>
  <line x1="520" y1="160" x2="545" y2="215" stroke="#475569"/>
  <circle cx="475" cy="105" r="12" fill="#ede9fe" stroke="#8b5cf6"/>
  <circle cx="430" cy="160" r="11" fill="#ede9fe" stroke="#8b5cf6"/>
  <circle cx="520" cy="160" r="11" fill="#ede9fe" stroke="#8b5cf6"/>
  <circle cx="405" cy="220" r="9" fill="#dbeafe" stroke="#3b82f6"/>
  <circle cx="455" cy="220" r="9" fill="#dbeafe" stroke="#3b82f6"/>
  <circle cx="495" cy="220" r="9" fill="#dbeafe" stroke="#3b82f6"/>
  <circle cx="545" cy="220" r="9" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="475" y="262" text-anchor="middle" font-size="11" fill="#1e293b">switches connected</text>
  <text x="475" y="280" text-anchor="middle" font-size="11" fill="#1e293b">in levels (hierarchy)</text>

  <!-- Mesh -->
  <text x="660" y="66" text-anchor="middle" font-weight="bold" fill="#1e293b">Mesh</text>
  <text x="660" y="82" text-anchor="middle" font-size="11" fill="#64748b">many paths</text>
  <line x1="615" y1="120" x2="705" y2="120" stroke="#475569"/>
  <line x1="615" y1="210" x2="705" y2="210" stroke="#475569"/>
  <line x1="615" y1="120" x2="615" y2="210" stroke="#475569"/>
  <line x1="705" y1="120" x2="705" y2="210" stroke="#475569"/>
  <line x1="615" y1="120" x2="705" y2="210" stroke="#475569"/>
  <line x1="705" y1="120" x2="615" y2="210" stroke="#475569"/>
  <circle cx="615" cy="120" r="11" fill="#fee2e2" stroke="#ef4444"/>
  <circle cx="705" cy="120" r="11" fill="#fee2e2" stroke="#ef4444"/>
  <circle cx="615" cy="210" r="11" fill="#fee2e2" stroke="#ef4444"/>
  <circle cx="705" cy="210" r="11" fill="#fee2e2" stroke="#ef4444"/>
  <text x="660" y="262" text-anchor="middle" font-size="11" fill="#1e293b">one link down</text>
  <text x="660" y="280" text-anchor="middle" font-size="11" fill="#1e293b">→ take another path</text>
</svg>
