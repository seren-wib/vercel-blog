<svg xmlns="http://www.w3.org/2000/svg" width="900" height="208" viewBox="0 0 900 208" role="img" aria-label="Terminal output">
  <rect width="900" height="208" rx="12" fill="#0d1117"/>
  <rect width="900" height="36" rx="12" fill="#161b22"/>
  <rect y="24" width="900" height="12" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="450" y="23" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">k3s-leader · monitoring</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#e6edf3">
    <text x="24" y="64" xml:space="preserve">$ curl -sI https://grafana.stairnoworks.com/login</text>
    <text x="24" y="84" xml:space="preserve">HTTP/1.1 200 <tspan fill="#3fb950">OK</tspan></text>
    <text x="24" y="104" xml:space="preserve">content-security-policy: frame-ancestors 'self' https://app.stairnoworks.com</text>
    <text x="24" y="124" xml:space="preserve">strict-transport-security: max-age=86400</text>
    <text x="24" y="144" xml:space="preserve"></text>
    <text x="24" y="164" xml:space="preserve">$ curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://grafana.stairnoworks.com/metrics</text>
    <text x="24" y="184" xml:space="preserve">302 https://grafana.stairnoworks.com/login?redirectTo=%2Fmetrics</text>
  </g>
</svg>
