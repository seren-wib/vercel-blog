<svg xmlns="http://www.w3.org/2000/svg" width="980" height="504" viewBox="0 0 980 504" font-family='Pretendard, "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif' font-size="13">
<rect width="980" height="504" fill="#ffffff" rx="8"/>
<text x="20" y="32" font-size="17" font-weight="bold" fill="#1e293b">웹 요청 하나가 노트북에서 웹 서버까지: 구간마다 뭐가 바뀌나</text>
<text x="20" y="52" font-size="12" fill="#64748b">예: 집 노트북(Wi-Fi)으로 https://www.example.com/video 요청. DNS·ARP·TCP·TLS 연결은 끝난 뒤의 HTTP 요청 패킷</text>
<line x1="90" y1="110" x2="890" y2="110" stroke="#cbd5e1" stroke-width="3"/>
<text x="190" y="148" text-anchor="middle" font-size="11" fill="#64748b">링크 1 · Wi-Fi</text>
<text x="390" y="148" text-anchor="middle" font-size="11" fill="#64748b">링크 2 · ISP 회선</text>
<text x="590" y="148" text-anchor="middle" font-size="11" fill="#64748b">링크 3 · 백본</text>
<text x="790" y="148" text-anchor="middle" font-size="11" fill="#64748b">링크 4 · 서버 LAN</text>
<rect x="28" y="86" width="124" height="48" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
<text x="90" y="106" text-anchor="middle" font-weight="bold" fill="#1e293b">노트북</text>
<text x="90" y="123" text-anchor="middle" font-size="10.5" fill="#64748b">192.168.1.20 (사설)</text>
<rect x="228" y="86" width="124" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
<text x="290" y="106" text-anchor="middle" font-weight="bold" fill="#1e293b">집 공유기</text>
<text x="290" y="123" text-anchor="middle" font-size="10.5" fill="#64748b">AP·스위치·라우터·NAT</text>
<rect x="428" y="86" width="124" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
<text x="490" y="106" text-anchor="middle" font-weight="bold" fill="#1e293b">ISP 라우터</text>
<text x="490" y="123" text-anchor="middle" font-size="10.5" fill="#64748b">라우터 A</text>
<rect x="628" y="86" width="124" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
<text x="690" y="106" text-anchor="middle" font-weight="bold" fill="#1e293b">라우터 B</text>
<text x="690" y="123" text-anchor="middle" font-size="10.5" fill="#64748b">인터넷 구간</text>
<rect x="828" y="86" width="124" height="48" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
<text x="890" y="106" text-anchor="middle" font-weight="bold" fill="#1e293b">웹 서버</text>
<text x="890" y="123" text-anchor="middle" font-size="10.5" fill="#64748b">192.0.2.10 : 443</text>
<rect y="68" width="24" height="14" rx="3" fill="#ef4444"><animate attributeName="x" dur="12s" repeatCount="indefinite" values="142;142;214;342;342;414;542;542;614;742;742;814;814" keyTimes="0.0000;0.0417;0.2167;0.2500;0.2917;0.4667;0.5000;0.5417;0.7167;0.7500;0.7917;0.9667;1.0000"/></rect>
<g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="1;0;0;0;1" keyTimes="0.0000;0.2500;0.5000;0.7500;1"/>
<text x="30" y="186" font-weight="bold" fill="#1e293b">지금 구간: <tspan fill="#b91c1c">링크 1 · Wi-Fi</tspan>  <tspan font-weight="normal" fill="#64748b">(빨간 글씨 = 이 구간에서 바뀐 값)</tspan></text>
<rect x="30" y="200" width="920" height="234" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="42" y="219" font-weight="bold" fill="#5b21b6">링크 계층: 이더넷 / Wi-Fi 프레임</text><text x="42" y="240" fill="#1e293b">출발지 MAC <tspan fill="#b91c1c" font-weight="bold">노트북</tspan>   →   목적지 MAC <tspan fill="#b91c1c" font-weight="bold">공유기</tspan><tspan fill="#64748b">        + 오류 검출(FCS)</tspan></text><rect x="46" y="250" width="888" height="174" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="58" y="269" font-weight="bold" fill="#854d0e">네트워크 계층: IP 패킷</text><text x="58" y="290" fill="#1e293b">출발지 IP 192.168.1.20   →   목적지 IP 192.0.2.10 <tspan fill="#64748b">(끝까지 그대로)</tspan>      TTL <tspan fill="#b91c1c" font-weight="bold">64</tspan></text><rect x="62" y="300" width="856" height="114" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="74" y="319" font-weight="bold" fill="#166534">전송 계층: TCP 세그먼트</text><text x="74" y="340" fill="#1e293b">출발지 포트 51000   →   목적지 포트 443 <tspan fill="#64748b">(끝까지 그대로)</tspan>      순서 번호 · ACK</text><rect x="78" y="350" width="824" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="90" y="369" font-weight="bold" fill="#1e3a8a">응용 계층: HTTP 요청 (TLS로 암호화)</text><text x="90" y="390" fill="#1e293b">GET /video  Host: www.example.com   <tspan fill="#64748b">← 중간 장비는 못 읽음</tspan></text>
<text x="30" y="458" fill="#b91c1c">목적지 MAC(공유기) ≠ 목적지 IP(서버): 첫 구간 목적지는 기본 게이트웨이. MAC은 ARP로 알아냄</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0;0" keyTimes="0.0000;0.2500;0.5000;0.7500;1"/>
<text x="30" y="186" font-weight="bold" fill="#1e293b">지금 구간: <tspan fill="#b91c1c">링크 2 · ISP 회선</tspan>  <tspan font-weight="normal" fill="#64748b">(빨간 글씨 = 이 구간에서 바뀐 값)</tspan></text>
<rect x="30" y="200" width="920" height="234" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="42" y="219" font-weight="bold" fill="#5b21b6">링크 계층: 이더넷 / Wi-Fi 프레임</text><text x="42" y="240" fill="#1e293b">출발지 MAC <tspan fill="#b91c1c" font-weight="bold">공유기</tspan>   →   목적지 MAC <tspan fill="#b91c1c" font-weight="bold">ISP 라우터</tspan><tspan fill="#64748b">        + 오류 검출(FCS)</tspan></text><rect x="46" y="250" width="888" height="174" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="58" y="269" font-weight="bold" fill="#854d0e">네트워크 계층: IP 패킷</text><text x="58" y="290" fill="#1e293b">출발지 IP <tspan fill="#b91c1c" font-weight="bold">203.0.113.5</tspan>   →   목적지 IP 192.0.2.10 <tspan fill="#64748b">(끝까지 그대로)</tspan>      TTL <tspan fill="#b91c1c" font-weight="bold">63</tspan></text><rect x="62" y="300" width="856" height="114" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="74" y="319" font-weight="bold" fill="#166534">전송 계층: TCP 세그먼트</text><text x="74" y="340" fill="#1e293b">출발지 포트 <tspan fill="#b91c1c" font-weight="bold">40001</tspan>   →   목적지 포트 443 <tspan fill="#64748b">(끝까지 그대로)</tspan>      순서 번호 · ACK</text><rect x="78" y="350" width="824" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="90" y="369" font-weight="bold" fill="#1e3a8a">응용 계층: HTTP 요청 (TLS로 암호화)</text><text x="90" y="390" fill="#1e293b">GET /video  Host: www.example.com   <tspan fill="#64748b">← 중간 장비는 못 읽음</tspan></text>
<text x="30" y="458" fill="#b91c1c">공유기 NAT: 사설 IP·포트 → 공인 IP·포트로 바꾸고 변환표에 기록, TTL −1, 새 프레임</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;0;1;0;0" keyTimes="0.0000;0.2500;0.5000;0.7500;1"/>
<text x="30" y="186" font-weight="bold" fill="#1e293b">지금 구간: <tspan fill="#b91c1c">링크 3 · 백본</tspan>  <tspan font-weight="normal" fill="#64748b">(빨간 글씨 = 이 구간에서 바뀐 값)</tspan></text>
<rect x="30" y="200" width="920" height="234" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="42" y="219" font-weight="bold" fill="#5b21b6">링크 계층: 이더넷 / Wi-Fi 프레임</text><text x="42" y="240" fill="#1e293b">출발지 MAC <tspan fill="#b91c1c" font-weight="bold">ISP 라우터</tspan>   →   목적지 MAC <tspan fill="#b91c1c" font-weight="bold">라우터 B</tspan><tspan fill="#64748b">        + 오류 검출(FCS)</tspan></text><rect x="46" y="250" width="888" height="174" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="58" y="269" font-weight="bold" fill="#854d0e">네트워크 계층: IP 패킷</text><text x="58" y="290" fill="#1e293b">출발지 IP 203.0.113.5   →   목적지 IP 192.0.2.10 <tspan fill="#64748b">(끝까지 그대로)</tspan>      TTL <tspan fill="#b91c1c" font-weight="bold">62</tspan></text><rect x="62" y="300" width="856" height="114" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="74" y="319" font-weight="bold" fill="#166534">전송 계층: TCP 세그먼트</text><text x="74" y="340" fill="#1e293b">출발지 포트 40001   →   목적지 포트 443 <tspan fill="#64748b">(끝까지 그대로)</tspan>      순서 번호 · ACK</text><rect x="78" y="350" width="824" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="90" y="369" font-weight="bold" fill="#1e3a8a">응용 계층: HTTP 요청 (TLS로 암호화)</text><text x="90" y="390" fill="#1e293b">GET /video  Host: www.example.com   <tspan fill="#64748b">← 중간 장비는 못 읽음</tspan></text>
<text x="30" y="458" fill="#b91c1c">라우터: 프레임 벗김 → 목적지 IP로 포워딩 테이블 조회 → TTL −1 → 다음 구간용 새 프레임</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;0;0;1;0" keyTimes="0.0000;0.2500;0.5000;0.7500;1"/>
<text x="30" y="186" font-weight="bold" fill="#1e293b">지금 구간: <tspan fill="#b91c1c">링크 4 · 서버 LAN</tspan>  <tspan font-weight="normal" fill="#64748b">(빨간 글씨 = 이 구간에서 바뀐 값)</tspan></text>
<rect x="30" y="200" width="920" height="234" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="42" y="219" font-weight="bold" fill="#5b21b6">링크 계층: 이더넷 / Wi-Fi 프레임</text><text x="42" y="240" fill="#1e293b">출발지 MAC <tspan fill="#b91c1c" font-weight="bold">라우터 B</tspan>   →   목적지 MAC <tspan fill="#b91c1c" font-weight="bold">웹 서버</tspan><tspan fill="#64748b">        + 오류 검출(FCS)</tspan></text><rect x="46" y="250" width="888" height="174" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="58" y="269" font-weight="bold" fill="#854d0e">네트워크 계층: IP 패킷</text><text x="58" y="290" fill="#1e293b">출발지 IP 203.0.113.5   →   목적지 IP 192.0.2.10 <tspan fill="#64748b">(끝까지 그대로)</tspan>      TTL <tspan fill="#b91c1c" font-weight="bold">61</tspan></text><rect x="62" y="300" width="856" height="114" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="74" y="319" font-weight="bold" fill="#166534">전송 계층: TCP 세그먼트</text><text x="74" y="340" fill="#1e293b">출발지 포트 40001   →   목적지 포트 443 <tspan fill="#64748b">(끝까지 그대로)</tspan>      순서 번호 · ACK</text><rect x="78" y="350" width="824" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="90" y="369" font-weight="bold" fill="#1e3a8a">응용 계층: HTTP 요청 (TLS로 암호화)</text><text x="90" y="390" fill="#1e293b">GET /video  Host: www.example.com   <tspan fill="#64748b">← 중간 장비는 못 읽음</tspan></text>
<text x="30" y="458" fill="#b91c1c">서버 역캡슐화: 프레임 → IP 패킷 → TCP(포트 443) → TLS 복호화 → HTTP 해석 → 응답은 같은 길 반대로</text>
</g>
<text x="30" y="488" font-size="11" fill="#64748b">바뀌는 것: MAC(구간마다), TTL(홉마다 −1), 출발지 IP·포트(NAT에서 한 번).  그대로: 목적지 IP, 목적지 포트, 암호화된 내용.</text>
</svg>
