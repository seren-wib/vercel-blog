<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="Pretendard, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="340" fill="#ffffff" rx="8"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/></marker></defs>
  <text x="20" y="32" font-size="16" font-weight="bold" fill="#1e293b">What the CPU does over time</text>
  <text x="20" y="78" font-weight="bold" fill="#1e293b">Single-tasking</text>
  <text x="20" y="96" font-size="12" fill="#64748b">one job at a time</text>
  <rect x="170" y="60" width="92" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="216" y="82" text-anchor="middle" fill="#1e293b">A</text>
  <rect x="264" y="60" width="92" height="34" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="310" y="82" text-anchor="middle" fill="#64748b">idle (I/O)</text>
  <rect x="358" y="60" width="92" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="404" y="82" text-anchor="middle" fill="#1e293b">A</text>
  <rect x="452" y="60" width="92" height="34" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="498" y="82" text-anchor="middle" fill="#64748b">idle (I/O)</text>
  <rect x="546" y="60" width="92" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="592" y="82" text-anchor="middle" fill="#1e293b">B</text>
  <rect x="640" y="60" width="92" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="686" y="82" text-anchor="middle" fill="#1e293b">B</text>
  <text x="170" y="112" font-size="12" fill="#dc2626">CPU sits idle while the job waits for I/O</text>
  <text x="20" y="158" font-weight="bold" fill="#1e293b">Multiprogramming</text>
  <text x="20" y="176" font-size="12" fill="#64748b">switch on I/O wait</text>
  <rect x="170" y="140" width="92" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="216" y="162" text-anchor="middle" fill="#1e293b">A</text>
  <rect x="264" y="140" width="92" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="310" y="162" text-anchor="middle" fill="#1e293b">B (A waits I/O)</text>
  <rect x="358" y="140" width="92" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="404" y="162" text-anchor="middle" fill="#1e293b">A</text>
  <rect x="452" y="140" width="92" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="498" y="162" text-anchor="middle" fill="#1e293b">B (A waits I/O)</text>
  <rect x="546" y="140" width="92" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="592" y="162" text-anchor="middle" fill="#1e293b">A</text>
  <rect x="640" y="140" width="92" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="686" y="162" text-anchor="middle" fill="#1e293b">B</text>
  <text x="170" y="192" font-size="12" fill="#64748b">A waits for I/O → CPU runs B instead, no idle time</text>
  <text x="20" y="238" font-weight="bold" fill="#1e293b">Time Sharing</text>
  <text x="20" y="256" font-size="12" fill="#64748b">switch every time slice</text>
  <rect x="170" y="220" width="45" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="192.5" y="242" text-anchor="middle" fill="#1e293b">A</text>
  <rect x="217" y="220" width="45" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="239.5" y="242" text-anchor="middle" fill="#1e293b">B</text>
  <rect x="264" y="220" width="45" height="34" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="286.5" y="242" text-anchor="middle" fill="#1e293b">C</text>
  <rect x="311" y="220" width="45" height="34" rx="5" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="333.5" y="242" text-anchor="middle" fill="#1e293b">D</text>
  <rect x="358" y="220" width="45" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380.5" y="242" text-anchor="middle" fill="#1e293b">A</text>
  <rect x="405" y="220" width="45" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="427.5" y="242" text-anchor="middle" fill="#1e293b">B</text>
  <rect x="452" y="220" width="45" height="34" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="474.5" y="242" text-anchor="middle" fill="#1e293b">C</text>
  <rect x="499" y="220" width="45" height="34" rx="5" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="521.5" y="242" text-anchor="middle" fill="#1e293b">D</text>
  <rect x="546" y="220" width="45" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="568.5" y="242" text-anchor="middle" fill="#1e293b">A</text>
  <rect x="593" y="220" width="45" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="615.5" y="242" text-anchor="middle" fill="#1e293b">B</text>
  <rect x="640" y="220" width="45" height="34" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="662.5" y="242" text-anchor="middle" fill="#1e293b">C</text>
  <rect x="687" y="220" width="45" height="34" rx="5" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="709.5" y="242" text-anchor="middle" fill="#1e293b">D</text>
  <path d="M 170 268 v 6 h 45 v -6" fill="none" stroke="#64748b"/>
  <text x="170" y="290" font-size="12" fill="#64748b">1 time slice → OS forces a switch (preemption) even without I/O wait</text>
  <line x1="170" y1="318" x2="734" y2="318" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="704" y="312" font-size="12" fill="#64748b">time</text>
</svg>
