<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" font-family='Pretendard, "Apple SD Gothic Neo", -apple-system, Helvetica, Arial, sans-serif' font-size="13">
<rect width="980" height="420" fill="#ffffff" rx="8"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#475569"/></marker></defs>
<text x="20" y="32" font-size="17" font-weight="bold" fill="#1e293b">Payment: start, Toss window, confirm</text>
<text x="20" y="52" font-size="12" fill="#64748b">The PG call runs outside any DB transaction. Only status DONE counts as approved.</text>
<rect x="20" y="80" width="170" height="300" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="105" y="235" text-anchor="middle" font-weight="bold" fill="#1e293b"></text>
<text x="105" y="104" text-anchor="middle" font-weight="bold" fill="#1e293b">browser</text>
<rect x="400" y="80" width="230" height="300" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="515" y="235" text-anchor="middle" font-weight="bold" fill="#1e3a8a"></text>
<text x="515" y="104" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Django</text>
<rect x="790" y="80" width="170" height="300" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/><text x="875" y="235" text-anchor="middle" font-weight="bold" fill="#3b0764"></text>
<text x="875" y="104" text-anchor="middle" font-weight="bold" fill="#3b0764">Toss (test mode)</text>
<path d="M190 135H396" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="293" y="127" text-anchor="middle" font-size="11" fill="#64748b">POST /api/orders/&lt;id&gt;/payments/</text>
<text x="515" y="140" text-anchor="middle" font-size="12" fill="#1d4ed8">payment row READY</text>
<path d="M190 185H786" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="488" y="177" text-anchor="middle" font-size="11" fill="#64748b">requestPayment() opens the payment window</text>
<path d="M786 225H194" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="488" y="217" text-anchor="middle" font-size="11" fill="#64748b">successUrl?paymentKey&amp;orderId&amp;amount</text>
<path d="M190 268H396" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="293" y="260" text-anchor="middle" font-size="11" fill="#64748b">POST /api/payments/confirm/</text>
<text x="515" y="268" text-anchor="middle" font-size="12" fill="#1d4ed8">amount = start amount?</text>
<path d="M630 290H786" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="708" y="282" text-anchor="middle" font-size="11" fill="#64748b">yes: confirm API</text>
<path d="M786 318H634" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="708" y="334" text-anchor="middle" font-size="11" fill="#64748b">status DONE</text>
<text x="515" y="320" text-anchor="middle" font-size="12" fill="#065f46">SUCCESS, order PAID</text>
<text x="515" y="352" text-anchor="middle" font-size="12" fill="#b91c1c">no: CANCELLED, 409 PAYMENT_MISMATCH</text>
<text x="515" y="368" text-anchor="middle" font-size="11" fill="#64748b">PG not called (spike step 4)</text>
<text x="20" y="405" font-size="12" fill="#334155">Timeout, 5xx, non-JSON or dropped connection: payment stays READY, 502 PG_ERROR.</text>
</svg>
