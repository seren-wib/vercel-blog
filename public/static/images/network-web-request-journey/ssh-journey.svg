<svg xmlns="http://www.w3.org/2000/svg" width="980" height="804" viewBox="0 0 980 804" font-family='Pretendard, "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif' font-size="13">
<rect width="980" height="804" fill="#ffffff" rx="8"/>
<text x="20" y="32" font-size="17" font-weight="bold" fill="#1e293b">ssh user@server.example.com: 연결 단계와 키 입력 한 번</text>
<text x="20" y="52" font-size="12" fill="#64748b">위: 연결이 만들어지는 순서 (하나씩 나타남).  아래: 연결 뒤 키 하나 누를 때 패킷이 가는 길. 경로는 웹 요청과 같고 목적지 포트만 22</text>
<text x="110" y="76" text-anchor="middle" font-weight="bold" fill="#1e3a8a">노트북 (ssh)</text>
<text x="870" y="76" text-anchor="middle" font-weight="bold" fill="#1e3a8a">서버 (sshd :22)</text>
<line x1="110" y1="84" x2="110" y2="330" stroke="#94a3b8" stroke-dasharray="4 4"/>
<line x1="870" y1="84" x2="870" y2="330" stroke="#94a3b8" stroke-dasharray="4 4"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#475569"/></marker></defs>
<g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.0000;1"/><line x1="116" y1="106" x2="864" y2="106" stroke="#475569" marker-end="url(#ah)"/>
<rect x="190" y="89" width="600" height="15" fill="#ffffff"/>
<text x="490" y="101" text-anchor="middle" font-size="12" fill="#1e293b">① TCP 3-way handshake (SYN → SYN+ACK → ACK), 목적지 포트 22</text></g>
<g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.1250;1"/><line x1="116" y1="136" x2="864" y2="136" stroke="#475569" marker-start="url(#ah)" marker-end="url(#ah)"/>
<rect x="190" y="119" width="600" height="15" fill="#ffffff"/>
<text x="490" y="131" text-anchor="middle" font-size="12" fill="#1e293b">② 버전 교환: "SSH-2.0-OpenSSH_…" 한 줄씩 (평문)</text></g>
<g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.2500;1"/><line x1="116" y1="166" x2="864" y2="166" stroke="#475569" marker-start="url(#ah)" marker-end="url(#ah)"/>
<rect x="190" y="149" width="600" height="15" fill="#ffffff"/>
<text x="490" y="161" text-anchor="middle" font-size="12" fill="#1e293b">③ 알고리즘 협상: 키 교환·암호·무결성 방식 고르기</text></g>
<g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.3750;1"/><line x1="116" y1="196" x2="864" y2="196" stroke="#b91c1c" marker-start="url(#ah)" marker-end="url(#ah)"/>
<rect x="190" y="179" width="600" height="15" fill="#ffffff"/>
<text x="490" y="191" text-anchor="middle" font-size="12" fill="#1e293b">④ 키 교환(ECDH) → 세션 키 생김. 서버는 호스트 키로 서명해서 보냄 🔒</text></g>
<g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.5000;1"/><circle cx="110" cy="226" r="5" fill="#b91c1c"/>
<rect x="190" y="209" width="600" height="15" fill="#ffffff"/>
<text x="490" y="221" text-anchor="middle" font-size="12" fill="#1e293b">⑤ 노트북: ~/.ssh/known_hosts의 fingerprint와 호스트 키 비교 (처음이면 yes/no 물음) 🔒</text></g>
<g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.6250;1"/><line x1="116" y1="256" x2="864" y2="256" stroke="#b91c1c" marker-end="url(#ah)"/>
<rect x="190" y="239" width="600" height="15" fill="#ffffff"/>
<text x="490" y="251" text-anchor="middle" font-size="12" fill="#1e293b">⑥ 사용자 인증: 개인키로 서명 → 서버가 authorized_keys의 공개키로 확인 🔒</text></g>
<g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.7500;1"/><line x1="116" y1="286" x2="864" y2="286" stroke="#b91c1c" marker-end="url(#ah)"/>
<rect x="190" y="269" width="600" height="15" fill="#ffffff"/>
<text x="490" y="281" text-anchor="middle" font-size="12" fill="#1e293b">⑦ 채널 열기 + 가상 터미널(pty) + 셸 시작 🔒</text></g>
<g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.8750;1"/><line x1="116" y1="316" x2="864" y2="316" stroke="#b91c1c" marker-start="url(#ah)" marker-end="url(#ah)"/>
<rect x="190" y="299" width="600" height="15" fill="#ffffff"/>
<text x="490" y="311" text-anchor="middle" font-size="12" fill="#1e293b">⑧ 키 입력 → 서버 셸 → 화면 출력. 전부 암호화된 패킷 🔒</text></g>
<text x="20" y="194" font-size="11" font-weight="bold" fill="#b91c1c">↓ 여기부터</text><text x="20" y="208" font-size="11" font-weight="bold" fill="#b91c1c">암호화</text>
<line x1="90" y1="410" x2="890" y2="410" stroke="#cbd5e1" stroke-width="3"/>
<text x="190" y="448" text-anchor="middle" font-size="11" fill="#64748b">링크 1 · Wi-Fi</text>
<text x="390" y="448" text-anchor="middle" font-size="11" fill="#64748b">링크 2 · ISP 회선</text>
<text x="590" y="448" text-anchor="middle" font-size="11" fill="#64748b">링크 3 · 백본</text>
<text x="790" y="448" text-anchor="middle" font-size="11" fill="#64748b">링크 4 · 서버 LAN</text>
<rect x="28" y="386" width="124" height="48" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
<text x="90" y="406" text-anchor="middle" font-weight="bold" fill="#1e293b">노트북</text>
<text x="90" y="423" text-anchor="middle" font-size="10.5" fill="#64748b">192.168.1.20 (사설)</text>
<rect x="228" y="386" width="124" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
<text x="290" y="406" text-anchor="middle" font-weight="bold" fill="#1e293b">집 공유기</text>
<text x="290" y="423" text-anchor="middle" font-size="10.5" fill="#64748b">NAT</text>
<rect x="428" y="386" width="124" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
<text x="490" y="406" text-anchor="middle" font-weight="bold" fill="#1e293b">ISP 라우터</text>
<text x="490" y="423" text-anchor="middle" font-size="10.5" fill="#64748b">라우터 A</text>
<rect x="628" y="386" width="124" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
<text x="690" y="406" text-anchor="middle" font-weight="bold" fill="#1e293b">라우터 B</text>
<text x="690" y="423" text-anchor="middle" font-size="10.5" fill="#64748b">인터넷 구간</text>
<rect x="828" y="386" width="124" height="48" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
<text x="890" y="406" text-anchor="middle" font-weight="bold" fill="#1e293b">SSH 서버</text>
<text x="890" y="423" text-anchor="middle" font-size="10.5" fill="#64748b">192.0.2.22 : 22</text>
<rect y="368" width="24" height="14" rx="3" fill="#ef4444"><animate attributeName="x" dur="12s" repeatCount="indefinite" values="142;142;214;342;342;414;542;542;614;742;742;814;814" keyTimes="0.0000;0.0417;0.2167;0.2500;0.2917;0.4667;0.5000;0.5417;0.7167;0.7500;0.7917;0.9667;1.0000"/></rect>
<g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="1;0;0;0;1" keyTimes="0.0000;0.2500;0.5000;0.7500;1"/>
<text x="30" y="486" font-weight="bold" fill="#1e293b">지금 구간: <tspan fill="#b91c1c">링크 1 · Wi-Fi</tspan>  <tspan font-weight="normal" fill="#64748b">(빨간 글씨 = 이 구간에서 바뀐 값)</tspan></text>
<rect x="30" y="500" width="920" height="234" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="42" y="519" font-weight="bold" fill="#5b21b6">링크 계층: 프레임</text><text x="42" y="540" fill="#1e293b">출발지 MAC <tspan fill="#b91c1c" font-weight="bold">노트북</tspan>   →   목적지 MAC <tspan fill="#b91c1c" font-weight="bold">공유기</tspan></text><rect x="46" y="550" width="888" height="174" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="58" y="569" font-weight="bold" fill="#854d0e">네트워크 계층: IP 패킷</text><text x="58" y="590" fill="#1e293b">출발지 IP 192.168.1.20   →   목적지 IP 192.0.2.22 (SSH 서버)      TTL <tspan fill="#b91c1c" font-weight="bold">64</tspan></text><rect x="62" y="600" width="856" height="114" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="74" y="619" font-weight="bold" fill="#166534">전송 계층: TCP 세그먼트</text><text x="74" y="640" fill="#1e293b">출발지 포트 52000   →   목적지 포트 <tspan font-weight="bold">22</tspan><tspan fill="#64748b"> (끝까지 그대로)</tspan></text><rect x="78" y="650" width="824" height="54" rx="8" fill="#fae8ff" stroke="#c026d3"/><text x="90" y="669" font-weight="bold" fill="#86198f">SSH 패킷 (세션 키로 암호화 + 무결성 확인값)</text><text x="90" y="690" fill="#1e293b"><tspan fill="#64748b">채널 데이터: 키 입력 'l' 한 글자  ← 중간 장비는 못 읽음</tspan></text>
<text x="30" y="758" fill="#b91c1c">키 입력 → ssh가 세션 키로 암호화 → TCP 22 → 첫 구간 목적지는 게이트웨이(공유기)</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0;0" keyTimes="0.0000;0.2500;0.5000;0.7500;1"/>
<text x="30" y="486" font-weight="bold" fill="#1e293b">지금 구간: <tspan fill="#b91c1c">링크 2 · ISP 회선</tspan>  <tspan font-weight="normal" fill="#64748b">(빨간 글씨 = 이 구간에서 바뀐 값)</tspan></text>
<rect x="30" y="500" width="920" height="234" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="42" y="519" font-weight="bold" fill="#5b21b6">링크 계층: 프레임</text><text x="42" y="540" fill="#1e293b">출발지 MAC <tspan fill="#b91c1c" font-weight="bold">공유기</tspan>   →   목적지 MAC <tspan fill="#b91c1c" font-weight="bold">ISP 라우터</tspan></text><rect x="46" y="550" width="888" height="174" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="58" y="569" font-weight="bold" fill="#854d0e">네트워크 계층: IP 패킷</text><text x="58" y="590" fill="#1e293b">출발지 IP <tspan fill="#b91c1c" font-weight="bold">203.0.113.5</tspan>   →   목적지 IP 192.0.2.22 (SSH 서버)      TTL <tspan fill="#b91c1c" font-weight="bold">63</tspan></text><rect x="62" y="600" width="856" height="114" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="74" y="619" font-weight="bold" fill="#166534">전송 계층: TCP 세그먼트</text><text x="74" y="640" fill="#1e293b">출발지 포트 <tspan fill="#b91c1c" font-weight="bold">40003</tspan>   →   목적지 포트 <tspan font-weight="bold">22</tspan><tspan fill="#64748b"> (끝까지 그대로)</tspan></text><rect x="78" y="650" width="824" height="54" rx="8" fill="#fae8ff" stroke="#c026d3"/><text x="90" y="669" font-weight="bold" fill="#86198f">SSH 패킷 (세션 키로 암호화 + 무결성 확인값)</text><text x="90" y="690" fill="#1e293b"><tspan fill="#64748b">채널 데이터: 키 입력 'l' 한 글자  ← 중간 장비는 못 읽음</tspan></text>
<text x="30" y="758" fill="#b91c1c">NAT: 사설 IP·포트 → 공인 IP·포트. (밖에서 집 PC로 ssh하려면 공유기 포트 포워딩 필요)</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;0;1;0;0" keyTimes="0.0000;0.2500;0.5000;0.7500;1"/>
<text x="30" y="486" font-weight="bold" fill="#1e293b">지금 구간: <tspan fill="#b91c1c">링크 3 · 백본</tspan>  <tspan font-weight="normal" fill="#64748b">(빨간 글씨 = 이 구간에서 바뀐 값)</tspan></text>
<rect x="30" y="500" width="920" height="234" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="42" y="519" font-weight="bold" fill="#5b21b6">링크 계층: 프레임</text><text x="42" y="540" fill="#1e293b">출발지 MAC <tspan fill="#b91c1c" font-weight="bold">ISP 라우터</tspan>   →   목적지 MAC <tspan fill="#b91c1c" font-weight="bold">라우터 B</tspan></text><rect x="46" y="550" width="888" height="174" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="58" y="569" font-weight="bold" fill="#854d0e">네트워크 계층: IP 패킷</text><text x="58" y="590" fill="#1e293b">출발지 IP 203.0.113.5   →   목적지 IP 192.0.2.22 (SSH 서버)      TTL <tspan fill="#b91c1c" font-weight="bold">62</tspan></text><rect x="62" y="600" width="856" height="114" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="74" y="619" font-weight="bold" fill="#166534">전송 계층: TCP 세그먼트</text><text x="74" y="640" fill="#1e293b">출발지 포트 40003   →   목적지 포트 <tspan font-weight="bold">22</tspan><tspan fill="#64748b"> (끝까지 그대로)</tspan></text><rect x="78" y="650" width="824" height="54" rx="8" fill="#fae8ff" stroke="#c026d3"/><text x="90" y="669" font-weight="bold" fill="#86198f">SSH 패킷 (세션 키로 암호화 + 무결성 확인값)</text><text x="90" y="690" fill="#1e293b"><tspan fill="#64748b">채널 데이터: 키 입력 'l' 한 글자  ← 중간 장비는 못 읽음</tspan></text>
<text x="30" y="758" fill="#b91c1c">라우터는 IP만 보고 전달. SSH 내용은 암호화돼서 못 읽음 (Telnet이면 평문이라 다 보임)</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;0;0;1;0" keyTimes="0.0000;0.2500;0.5000;0.7500;1"/>
<text x="30" y="486" font-weight="bold" fill="#1e293b">지금 구간: <tspan fill="#b91c1c">링크 4 · 서버 LAN</tspan>  <tspan font-weight="normal" fill="#64748b">(빨간 글씨 = 이 구간에서 바뀐 값)</tspan></text>
<rect x="30" y="500" width="920" height="234" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="42" y="519" font-weight="bold" fill="#5b21b6">링크 계층: 프레임</text><text x="42" y="540" fill="#1e293b">출발지 MAC <tspan fill="#b91c1c" font-weight="bold">라우터 B</tspan>   →   목적지 MAC <tspan fill="#b91c1c" font-weight="bold">SSH 서버</tspan></text><rect x="46" y="550" width="888" height="174" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="58" y="569" font-weight="bold" fill="#854d0e">네트워크 계층: IP 패킷</text><text x="58" y="590" fill="#1e293b">출발지 IP 203.0.113.5   →   목적지 IP 192.0.2.22 (SSH 서버)      TTL <tspan fill="#b91c1c" font-weight="bold">61</tspan></text><rect x="62" y="600" width="856" height="114" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="74" y="619" font-weight="bold" fill="#166534">전송 계층: TCP 세그먼트</text><text x="74" y="640" fill="#1e293b">출발지 포트 40003   →   목적지 포트 <tspan font-weight="bold">22</tspan><tspan fill="#64748b"> (끝까지 그대로)</tspan></text><rect x="78" y="650" width="824" height="54" rx="8" fill="#fae8ff" stroke="#c026d3"/><text x="90" y="669" font-weight="bold" fill="#86198f">SSH 패킷 (세션 키로 암호화 + 무결성 확인값)</text><text x="90" y="690" fill="#1e293b"><tspan fill="#64748b">채널 데이터: 키 입력 'l' 한 글자  ← 중간 장비는 못 읽음</tspan></text>
<text x="30" y="758" fill="#b91c1c">sshd: 복호화·무결성 확인 → 셸에 'l' 전달 → 화면 출력(에코)을 다시 암호화해서 돌려보냄</text>
</g>
<text x="30" y="788" font-size="11" fill="#64748b">SSH는 TCP 위에서 자기 암호화(④ 키 교환)를 함. 그래서 경로·NAT·라우터 처리는 웹 요청과 똑같고, 다른 건 포트(22)와 위의 연결 단계뿐.</text>
</svg>
