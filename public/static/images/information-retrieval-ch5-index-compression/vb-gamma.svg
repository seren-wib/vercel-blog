</text><text x="505" y="388" font-size="12" text-anchor="middle" font-weight="400" fill="#e67700" >len(offset)=3 in unary</text><line x1="582" y1="352" x2="608" y2="352" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/><rect x="610" y="335" width="200" height="34" rx="5" fill="#fff" stroke="#212529" stroke-width="1.5"/><text x="650" y="358" font-size="16" text-anchor="middle" font-weight="700" fill="#e67700" font-family="Consolas, monospace">1110</text><text x="718" y="358" font-size="16" text-anchor="middle" font-weight="700" fill="#1c7ed6" font-family="Consolas, monospace">101</text><text x="710" y="388" font-size="12" text-anchor="middle" font-weight="400" fill="#212529" >γ(13) = 1110,101</text><text x="20" y="430" font-size="13"  font-weight="400" fill="#495057" >unary n = n ones + final 0 (3 → 1110)  ·  total length = 2⌊log₂G⌋ + 1 bits (always odd)</text><text x="20" y="452" font-size="13"  font-weight="400" fill="#495057" >decode: read 1s until the 0 → that many offset bits → put the 1 back in front</text></svg>