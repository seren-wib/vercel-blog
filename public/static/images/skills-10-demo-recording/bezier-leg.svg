<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="1200" height="390" fill="#FFFFFF"/><text x="32" y="44" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#374151" text-anchor="start">한 번의 mouse move: cubic Bezier leg</text><line x1="120" y1="330" x2="860" y2="300" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="6 6"/><text x="470" y="340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="middle" font-style="italic">직선 (plain mouse.move는 이 위를 순간이동)</text><line x1="120" y1="330" x2="330" y2="120" stroke="#C98A1B" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="860" y1="300" x2="640" y2="140" stroke="#C98A1B" stroke-width="1.2" stroke-dasharray="3 4"/><path d="M120,330 C330,120 640,140 860,300" fill="none" stroke="#3B6FD8" stroke-width="3"/><path d="M860,300 Q878 316 890 320" fill="none" stroke="#C0392B" stroke-width="2.4"/><path d="M890 320 L868 306" fill="none" stroke="#2F9461" stroke-width="2.4" marker-end="url(#ah)"/><circle cx="120" cy="330" r="6" fill="#374151"/><circle cx="860" cy="300" r="6" fill="#374151"/><circle cx="330" cy="120" r="6" fill="#C98A1B"/><circle cx="640" cy="140" r="6" fill="#C98A1B"/><text x="110" y="358" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">from (현재 위치)</text><text x="700" y="366" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">to (요소 안 랜덤 점)</text><text x="300" y="106" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A5D0C" text-anchor="start">c1: 20~40% 지점 + normal × bend</text><text x="600" y="126" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A5D0C" text-anchor="start">c2: 60~80% 지점 + normal × bend</text><text x="905" y="330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8E2A20" text-anchor="start">overshoot 2~5%</text><text x="905" y="350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#1E6B44" text-anchor="start">→ 2.5배 속도로 보정</text><rect x="930" y="90" width="240" height="190" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="944" y="118" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#374151" text-anchor="start">규칙</text><text x="944" y="140" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 손목이 그리는 호</text><text x="944" y="162" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">bend ≤ 160 px</text><text x="944" y="184" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">duration = min(1300,</text><text x="944" y="206" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">220 + dist × 0.7~1.05) ms</text><text x="944" y="228" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">step ≈ 18 ms, easeInOut</text><text x="944" y="250" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">tremor ≤ 1.2 px</text><text x="944" y="272" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">dist &gt; 250 px면 35% overshoot</text></svg>
