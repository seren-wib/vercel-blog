<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" font-family='Pretendard, "Apple SD Gothic Neo", -apple-system, Helvetica, Arial, sans-serif' font-size="13">
<rect width="980" height="400" fill="#ffffff" rx="8"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#475569"/></marker></defs>
<text x="20" y="32" font-size="17" font-weight="bold" fill="#1e293b">Fitting images into the Google Docs page body</text>
<text x="20" y="52" font-size="12" fill="#64748b">Docs ignores % widths and max-width on imported HTML; only px works. Page body: 624 × 864 px.</text>
<text x="160" y="88" text-anchor="middle" font-weight="bold" fill="#1e293b">before #65</text>
<rect x="80" y="100" width="160" height="220" fill="#f8fafc" stroke="#94a3b8"/>
<text x="160" y="116" text-anchor="middle" font-size="11" fill="#64748b">page body</text>
<rect x="50" y="150" width="250" height="80" fill="#fee2e2" stroke="#f87171" fill-opacity="0.85"/>
<text x="175" y="195" text-anchor="middle" font-size="12" fill="#991b1b">1600 px wide PNG</text>
<text x="160" y="350" text-anchor="middle" font-size="12" fill="#b91c1c">overflows the width</text>
<text x="490" y="88" text-anchor="middle" font-weight="bold" fill="#1e293b">#65: width capped at 624</text>
<rect x="410" y="100" width="160" height="220" fill="#f8fafc" stroke="#94a3b8"/>
<rect x="440" y="108" width="100" height="262" fill="#fef3c7" stroke="#f59e0b" fill-opacity="0.85"/>
<text x="490" y="225" text-anchor="middle" font-size="12" fill="#92400e">tall flow chart</text>
<text x="490" y="243" text-anchor="middle" font-size="11" fill="#92400e">468 × 1168 pt</text>
<text x="490" y="390" text-anchor="middle" font-size="12" fill="#b45309">still overflows the 648 pt body height</text>
<text x="820" y="88" text-anchor="middle" font-weight="bold" fill="#1e293b">#69: width and height</text>
<rect x="740" y="100" width="160" height="220" fill="#f8fafc" stroke="#94a3b8"/>
<rect x="790" y="100" width="60" height="220" fill="#dcfce7" stroke="#22c55e" fill-opacity="0.85"/>
<text x="820" y="350" text-anchor="middle" font-size="12" fill="#15803d">scale = min(624/w, 864/h, 1)</text>
<text x="820" y="370" text-anchor="middle" font-size="11" fill="#64748b">600 × 2000 → 259 × 864</text>
</svg>
