<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" font-family='Pretendard, "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif' font-size="13">
<rect width="980" height="720" fill="#ffffff" rx="8"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#dc2626"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#16a34a"/></marker>
</defs>
<text x="20" y="32" font-size="17" font-weight="bold" fill="#1e293b">Direct exposure vs overlay network</text>
<text x="20" y="52" font-size="12" fill="#64748b">Red: connection that starts from outside (inbound). Green: connection the device opens itself (outbound).</text>
<rect x="20" y="70" width="940" height="270" rx="10" fill="#fff7f7" stroke="#fecaca"/>
<text x="40" y="96" font-weight="bold" fill="#7f1d1d">A. Port forwarding: SSH exposed directly</text>
<rect x="50" y="130" width="170" height="70" rx="8" fill="#fee2e2" stroke="#ef4444"/>
<text x="135" y="160" text-anchor="middle" font-weight="bold" fill="#7f1d1d">internet</text>
<text x="135" y="180" text-anchor="middle" font-size="12" fill="#991b1b">anyone, incl. brute-force bots</text>
<rect x="390" y="120" width="210" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="495" y="146" text-anchor="middle" font-weight="bold" fill="#1e293b">home router (NAT)</text>
<text x="495" y="168" text-anchor="middle" font-size="12" fill="#334155">public IP :22 → desktop :22</text>
<text x="495" y="188" text-anchor="middle" font-size="12" fill="#334155">+ DDNS when the IP changes</text>
<rect x="760" y="130" width="170" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="845" y="160" text-anchor="middle" font-weight="bold" fill="#1e3a8a">desktop :22</text>
<text x="845" y="180" text-anchor="middle" font-size="12" fill="#1e3a8a">sshd faces the whole internet</text>
<line x1="222" y1="165" x2="386" y2="165" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
<line x1="602" y1="165" x2="756" y2="165" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
<text x="304" y="155" text-anchor="middle" font-size="12" fill="#dc2626">inbound :22 open</text>
<rect x="390" y="245" width="210" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="495" y="272" text-anchor="middle" font-weight="bold" fill="#1e293b">campus NAT</text>
<text x="495" y="294" text-anchor="middle" font-size="12" fill="#334155">not my router: no forwarding</text>
<rect x="760" y="245" width="170" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="845" y="276" text-anchor="middle" font-weight="bold" fill="#1e3a8a">laptop</text>
<text x="845" y="296" text-anchor="middle" font-size="12" fill="#1e3a8a">campus Wi-Fi</text>
<line x1="602" y1="280" x2="758" y2="280" stroke="#94a3b8" stroke-width="2"/>
<line x1="222" y1="190" x2="386" y2="275" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
<text x="345" y="262" font-size="22" font-weight="bold" fill="#dc2626">✕</text>
<text x="70" y="300" font-size="12" fill="#991b1b">inbound packet has no NAT table entry → dropped</text>
<rect x="20" y="360" width="940" height="340" rx="10" fill="#f6fdf8" stroke="#bbf7d0"/>
<text x="40" y="386" font-weight="bold" fill="#14532d">B. Overlay (Tailscale): every device dials out, routers open 0 inbound ports</text>
<rect x="250" y="404" width="220" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="360" y="430" text-anchor="middle" font-weight="bold" fill="#1e293b">coordination server</text>
<text x="360" y="450" text-anchor="middle" font-size="12" fill="#334155">public keys + endpoints only</text>
<rect x="510" y="404" width="220" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="620" y="430" text-anchor="middle" font-weight="bold" fill="#1e293b">DERP relay</text>
<text x="620" y="450" text-anchor="middle" font-size="12" fill="#334155">fallback over HTTPS :443</text>
<rect x="60" y="560" width="150" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="135" y="584" text-anchor="middle" font-weight="bold" fill="#1e3a8a">phone</text>
<text x="135" y="602" text-anchor="middle" font-size="11" fill="#1e3a8a">behind carrier CGNAT</text>
<rect x="290" y="560" width="150" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="365" y="584" text-anchor="middle" font-weight="bold" fill="#1e3a8a">tablet</text>
<text x="365" y="602" text-anchor="middle" font-size="11" fill="#1e3a8a">any Wi-Fi</text>
<rect x="540" y="560" width="150" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="615" y="584" text-anchor="middle" font-weight="bold" fill="#1e3a8a">laptop</text>
<text x="615" y="602" text-anchor="middle" font-size="11" fill="#1e3a8a">behind campus NAT</text>
<rect x="770" y="560" width="150" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="845" y="584" text-anchor="middle" font-weight="bold" fill="#1e3a8a">desktop</text>
<text x="845" y="602" text-anchor="middle" font-size="11" fill="#1e3a8a">behind home router</text>
<line x1="135" y1="558" x2="300" y2="470" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
<line x1="365" y1="558" x2="355" y2="470" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
<line x1="615" y1="558" x2="400" y2="470" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
<line x1="845" y1="558" x2="440" y2="470" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
<path d="M615 618 Q730 670 845 618" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="730" y="682" text-anchor="middle" font-size="12" fill="#6d28d9">WireGuard tunnel, direct (UDP hole punching)</text>
<path d="M135 618 Q250 670 365 618" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="250" y="682" text-anchor="middle" font-size="12" fill="#6d28d9">if punching fails → via DERP</text>
<text x="40" y="424" font-size="12" fill="#166534">each device dials out only</text>
<text x="40" y="442" font-size="12" fill="#166534">→ its NAT table gets an entry</text>
<text x="40" y="460" font-size="12" fill="#166534">→ peers can reach each other</text>
</svg>
