<svg xmlns="http://www.w3.org/2000/svg" width="900" height="348" viewBox="0 0 900 348" role="img" aria-label="Terminal output">
  <rect width="900" height="348" rx="12" fill="#0d1117"/>
  <rect width="900" height="36" rx="12" fill="#161b22"/>
  <rect y="24" width="900" height="12" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="450" y="23" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">demo.stairnoworks.com from the desktop</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#e6edf3">
    <text x="24" y="64" xml:space="preserve">https://demo.stairnoworks.com/ -&gt; 200</text>
    <text x="24" y="84" xml:space="preserve">https://nope-xyz.stairnoworks.com/ -&gt; 404</text>
    <text x="24" y="104" xml:space="preserve">http://demo.stairnoworks.com/ -&gt; 200        (Always Use HTTPS still off)</text>
    <text x="24" y="124" xml:space="preserve">$ curl -s https://demo.stairnoworks.com/headers   (podinfo echoes request headers; excerpt)</text>
    <text x="24" y="144" xml:space="preserve">"X-Forwarded-For":["203.0.113.10,10.42.0.21"]</text>
    <text x="24" y="164" xml:space="preserve">"X-Forwarded-Host":["demo.stairnoworks.com"]</text>
    <text x="24" y="184" xml:space="preserve">"X-Forwarded-Port":["443"]</text>
    <text x="24" y="204" xml:space="preserve">"X-Forwarded-Proto":["https"]</text>
    <text x="24" y="224" xml:space="preserve">"X-Forwarded-Server":["traefik-84d68f6dbf-lfm5r"]</text>
    <text x="24" y="244" xml:space="preserve">$ openssl s_client ... | openssl x509 -noout -ext subjectAltName -issuer -enddate</text>
    <text x="24" y="264" xml:space="preserve">X509v3 Subject Alternative Name:</text>
    <text x="24" y="284" xml:space="preserve">    DNS:*.stairnoworks.com, DNS:stairnoworks.com</text>
    <text x="24" y="304" xml:space="preserve">issuer=C=US, O=Let's Encrypt, CN=YE1</text>
    <text x="24" y="324" xml:space="preserve">notAfter=Jan 15 05:58:53 2027 GMT</text>
  </g>
</svg>
