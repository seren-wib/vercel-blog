<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" font-family='Pretendard, "Apple SD Gothic Neo", -apple-system, Helvetica, Arial, sans-serif' font-size="13">
<rect width="980" height="400" fill="#ffffff" rx="8"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#475569"/></marker></defs>
<text x="20" y="32" font-size="17" font-weight="bold" fill="#1e293b">Ten concurrent orders for the last bag: DEFERRED vs IMMEDIATE</text>
<text x="20" y="52" font-size="12" fill="#64748b">Spike #73, 30 rounds each. Stock was right in both modes; only the error differs.</text>
<rect x="20" y="75" width="455" height="300" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
<text x="40" y="100" font-weight="bold" fill="#7f1d1d">DEFERRED (default)</text>
<text x="455" y="100" text-anchor="end" font-size="11" fill="#64748b">walk in, then try to lock</text>
<rect x="40" y="118" width="190" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/><text x="135" y="136" text-anchor="middle" font-weight="bold" fill="#1e293b">BEGIN</text><text x="135" y="154" text-anchor="middle" font-size="12" fill="#334155">read cart, stock</text>
<rect x="40" y="190" width="190" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/><text x="135" y="217" text-anchor="middle" font-weight="bold" fill="#1e293b">upgrade to write lock</text>
<rect x="40" y="262" width="190" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5"/><text x="135" y="284" text-anchor="middle" font-weight="bold" fill="#7f1d1d">SQLITE_BUSY at once</text><text x="135" y="302" text-anchor="middle" font-size="12" fill="#b91c1c">database is locked → 500</text>
<path d="M135 162V186" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M135 234V258" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="250" y="210" font-size="12" fill="#334155">another connection</text>
<text x="250" y="228" font-size="12" fill="#334155">committed in between</text>
<text x="250" y="282" font-size="12" fill="#b91c1c">68 of 300 requests</text>
<text x="250" y="300" font-size="12" fill="#b91c1c">timeout=20 does not help</text>
<text x="40" y="350" font-size="12" fill="#334155">no waiting: max server time 16.86 ms</text>
<rect x="505" y="75" width="455" height="300" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="525" y="100" font-weight="bold" fill="#064e3b">IMMEDIATE</text>
<text x="940" y="100" text-anchor="end" font-size="11" fill="#64748b">queue at the door</text>
<rect x="525" y="118" width="190" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/><text x="620" y="136" text-anchor="middle" font-weight="bold" fill="#1e293b">BEGIN IMMEDIATE</text><text x="620" y="154" text-anchor="middle" font-size="12" fill="#334155">take write lock first</text>
<rect x="525" y="190" width="190" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/><text x="620" y="217" text-anchor="middle" font-weight="bold" fill="#1e293b">wait up to timeout=20</text>
<rect x="525" y="262" width="190" height="52" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/><text x="620" y="284" text-anchor="middle" font-weight="bold" fill="#064e3b">conditional UPDATE</text><text x="620" y="302" text-anchor="middle" font-size="12" fill="#065f46">stock_quantity &gt;= n</text>
<path d="M620 162V186" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M620 234V258" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="735" y="282" font-size="12" fill="#065f46">winner: 201 (30 of 30 rounds)</text>
<text x="735" y="300" font-size="12" fill="#065f46">others: 409, 270 in total</text>
<text x="735" y="318" font-size="12" fill="#065f46">500: 0</text>
<text x="525" y="350" font-size="12" fill="#334155">p95 41.96 ms over 300 requests (local)</text>
</svg>
