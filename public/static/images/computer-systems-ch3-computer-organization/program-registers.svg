<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="Pretendard, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="820" height="470" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/></marker>
  </defs>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#1e293b">Registers used to run a program</text>

  <!-- storage -->
  <rect x="20" y="180" width="130" height="64" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="85" y="206" text-anchor="middle" font-weight="bold" fill="#1e293b">Storage</text>
  <text x="85" y="226" text-anchor="middle" font-size="12" fill="#64748b">program file</text>
  <line x1="150" y1="212" x2="208" y2="212" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="179" y="200" text-anchor="middle" font-size="12" fill="#1e293b">① OS</text>
  <text x="179" y="232" text-anchor="middle" font-size="12" fill="#1e293b">loads</text>

  <!-- RAM -->
  <rect x="210" y="60" width="190" height="390" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="305" y="82" text-anchor="middle" font-weight="bold" fill="#1e293b">Main memory (RAM)</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12">
    <rect x="220" y="94" width="170" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="230" y="113" fill="#64748b">A0</text><text x="260" y="113" fill="#1e293b">156C LOAD R5,[6C]</text>
    <rect x="220" y="126" width="170" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="230" y="145" fill="#64748b">A2</text><text x="260" y="145" fill="#1e293b">166D LOAD R6,[6D]</text>
    <rect x="220" y="158" width="170" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="230" y="177" fill="#64748b">A4</text><text x="260" y="177" fill="#1e293b">5056 ADD R0,R5,R6</text>
    <rect x="220" y="190" width="170" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="230" y="209" fill="#64748b">A6</text><text x="260" y="209" fill="#1e293b">306E STORE R0,[6E]</text>
    <rect x="220" y="222" width="170" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="230" y="241" fill="#64748b">A8</text><text x="260" y="241" fill="#1e293b">C000 HALT</text>
    <text x="305" y="274" text-anchor="middle" fill="#94a3b8">⋮</text>
    <rect x="220" y="290" width="170" height="28" rx="4" fill="#dcfce7" stroke="#86efac"/>
    <text x="230" y="309" fill="#64748b">6C</text><text x="260" y="309" fill="#1e293b">data</text>
    <rect x="220" y="322" width="170" height="28" rx="4" fill="#dcfce7" stroke="#86efac"/>
    <text x="230" y="341" fill="#64748b">6D</text><text x="260" y="341" fill="#1e293b">data</text>
    <rect x="220" y="354" width="170" height="28" rx="4" fill="#dcfce7" stroke="#86efac"/>
    <text x="230" y="373" fill="#64748b">6E</text><text x="260" y="373" fill="#1e293b">result</text>
  </g>
  <text x="305" y="410" text-anchor="middle" font-size="12" fill="#3b82f6">blue: instructions (2 B each)</text>
  <text x="305" y="430" text-anchor="middle" font-size="12" fill="#16a34a">green: data</text>

  <!-- CPU -->
  <rect x="470" y="60" width="330" height="390" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="782" y="438" text-anchor="end" font-weight="bold" fill="#1e293b">CPU</text>

  <!-- PC -->
  <rect x="490" y="98" width="130" height="58" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="555" y="117" text-anchor="middle" font-weight="bold" fill="#1e293b">PC</text>
  <text x="555" y="135" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#1e293b">A0 → A2</text>
  <text x="555" y="150" text-anchor="middle" font-size="11" fill="#64748b">next instr. address</text>

  <!-- IR -->
  <rect x="650" y="98" width="130" height="58" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="715" y="117" text-anchor="middle" font-weight="bold" fill="#1e293b">IR</text>
  <text x="715" y="135" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#1e293b">156C</text>
  <text x="715" y="150" text-anchor="middle" font-size="11" fill="#64748b">current instruction</text>

  <!-- general registers -->
  <rect x="490" y="186" width="130" height="164" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="555" y="205" text-anchor="middle" font-weight="bold" fill="#1e293b">General registers</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#1e293b" text-anchor="middle">
    <text x="555" y="228">R0  result</text>
    <text x="555" y="250">⋮</text>
    <text x="555" y="272">R5  [6C]</text>
    <text x="555" y="294">R6  [6D]</text>
    <text x="555" y="316">⋮</text>
    <text x="555" y="338">RF</text>
  </g>

  <!-- ALU -->
  <rect x="650" y="186" width="130" height="50" rx="6" fill="#fee2e2" stroke="#f87171"/>
  <text x="715" y="207" text-anchor="middle" font-weight="bold" fill="#1e293b">ALU</text>
  <text x="715" y="225" text-anchor="middle" font-size="11" fill="#64748b">computes</text>
  <line x1="622" y1="211" x2="648" y2="211" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- status register -->
  <rect x="650" y="272" width="130" height="78" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="715" y="291" text-anchor="middle" font-weight="bold" fill="#1e293b">Status register</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1e293b">
    <rect x="660" y="302" width="24" height="22" rx="3" fill="#fff" stroke="#ef4444"/><text x="672" y="317">Z</text>
    <rect x="688" y="302" width="24" height="22" rx="3" fill="#fff" stroke="#ef4444"/><text x="700" y="317">N</text>
    <rect x="716" y="302" width="24" height="22" rx="3" fill="#fff" stroke="#ef4444"/><text x="728" y="317">C</text>
    <rect x="744" y="302" width="24" height="22" rx="3" fill="#fff" stroke="#ef4444"/><text x="756" y="317">V</text>
  </g>
  <text x="715" y="341" text-anchor="middle" font-size="9" fill="#64748b">zero · neg · carry · overflow</text>
  <line x1="715" y1="237" x2="715" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="708" y="258" text-anchor="end" font-size="12" fill="#1e293b">④ state</text>

  <!-- ② fetch: PC points to address, instruction goes to IR -->
  <line x1="490" y1="127" x2="393" y2="110" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="440" y="132" text-anchor="middle" font-size="12" fill="#b45309">② address</text>
  <path d="M 390 100 L 440 100 L 440 48 L 715 48 L 715 96" fill="none" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="577" y="43" text-anchor="middle" font-size="12" fill="#6d28d9">② fetch instruction → IR, then decode · execute</text>

  <!-- ③ data -->
  <line x1="392" y1="304" x2="488" y2="272" stroke="#16a34a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="440" y="310" text-anchor="middle" font-size="12" fill="#15803d">③ LOAD</text>
  <text x="440" y="326" text-anchor="middle" font-size="12" fill="#15803d">STORE</text>

  <!-- ⑤ jump -->
  <path d="M 780 330 L 792 330 L 792 80 L 600 80 L 600 96" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="706" y="74" text-anchor="end" font-size="12" fill="#dc2626">⑤ JUMP reads flags</text>

  <text x="490" y="378" font-size="12" fill="#1e293b">Normal: PC + 2 after each fetch</text>
  <text x="490" y="398" font-size="12" fill="#dc2626">JUMP taken: PC = new address</text>
</svg>
