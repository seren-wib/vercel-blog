<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="1200" height="470" fill="#FFFFFF"/><text x="32" y="44" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#374151" text-anchor="start">unity-mcp-setting: 7 steps</text><rect x="32" y="80" width="260" height="120" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="48" y="112" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#374151" text-anchor="start">1. target check</text><text x="48" y="142" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="13" font-weight="400" fill="#374151" text-anchor="start">Packages/manifest.json</text><text x="48" y="176" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 주소 확인</text><rect x="322" y="80" width="260" height="120" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="338" y="112" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#374151" text-anchor="start">2. add package</text><text x="338" y="142" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="13" font-weight="400" fill="#374151" text-anchor="start">com.coplaydev.unity-mcp</text><text x="338" y="176" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 부품 주문서 한 줄</text><rect x="612" y="80" width="260" height="120" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="628" y="112" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#374151" text-anchor="start">3. register server</text><text x="628" y="142" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="13" font-weight="400" fill="#374151" text-anchor="start">claude mcp add --scope local</text><text x="628" y="176" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 전화번호 저장</text><rect x="902" y="80" width="260" height="120" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/><text x="918" y="112" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#374151" text-anchor="start">4. already connected?</text><text x="918" y="142" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="13" font-weight="400" fill="#374151" text-anchor="start">ToolSearch "unity"</text><text x="918" y="176" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">있으면 여기서 끝</text><rect x="176" y="290" width="260" height="120" rx="10" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.6"/><text x="192" y="322" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#374151" text-anchor="start">5. focus Unity</text><text x="192" y="352" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="13" font-weight="400" fill="#374151" text-anchor="start">window.ps1 -App Unity</text><text x="192" y="386" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 공장 불 켜기</text><rect x="466" y="290" width="260" height="120" rx="10" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.6"/><text x="482" y="322" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#374151" text-anchor="start">6. wait for server</text><text x="482" y="352" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="13" font-weight="400" fill="#374151" text-anchor="start">wait-unity-mcp.ps1, ≤300 s</text><text x="482" y="386" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 개점 기다리기</text><rect x="756" y="290" width="260" height="120" rx="10" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.6"/><text x="772" y="322" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#374151" text-anchor="start">7. reload VS Code</text><text x="772" y="352" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="13" font-weight="400" fill="#374151" text-anchor="start">window.ps1 -App VSCode -Reload</text><text x="772" y="386" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">대화가 끊기니 보고 먼저</text><line x1="292" y1="140" x2="320" y2="140" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><line x1="582" y1="140" x2="610" y2="140" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><line x1="872" y1="140" x2="900" y2="140" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><path d="M1032,200 L1032,245 L306,245 L306,286" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><line x1="436" y1="350" x2="464" y2="350" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><line x1="726" y1="350" x2="754" y2="350" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><text x="32" y="450" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">1-4: files and registration (Claude Code tools)    5-7: Windows window control and waiting (PowerShell scripts)</text></svg>