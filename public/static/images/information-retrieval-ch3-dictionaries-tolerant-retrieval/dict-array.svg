<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif" font-size="14">
<rect width="760" height="420" fill="#ffffff"/>
<defs><pattern id="pad" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f1f1f1"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d6d6d6" stroke-width="2"/></pattern></defs>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#222">Dictionary stored as an array of fixed-width entries</text><text x="135" y="66" text-anchor="middle" font-size="12" fill="#555">row</text><text x="260" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">term (20 bytes)</text><text x="395" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">df (4 B)</text><text x="465" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">pointer (4 B)</text><text x="100" y="99" text-anchor="end" font-size="11" fill="#888">byte 0</text><rect x="110" y="76" width="50" height="34" fill="#eef1f5" stroke="#888" stroke-width="1.2"/><text x="135" y="98" text-anchor="middle" font-size="14" fill="#222">0</text><rect x="160" y="76" width="200" height="34" fill="url(#pad)" stroke="#888" stroke-width="1.2"/><rect x="161" y="77" width="10" height="32" fill="#fff"/><text x="166" y="98" font-size="14" fill="#222">a</text><rect x="360" y="76" width="70" height="34" fill="#fff" stroke="#888" stroke-width="1.2"/><text x="395" y="98" text-anchor="middle" font-size="14" fill="#222">656,265</text><rect x="430" y="76" width="70" height="34" fill="#fff" stroke="#888" stroke-width="1.2"/><circle cx="465" cy="93" r="4" fill="#1f4e79"/><path d="M469,93 L532,93" stroke="#1f4e79" stroke-width="1.6"/><path d="M532,88 L540,93 L532,98 z" fill="#1f4e79"/><rect x="540" y="80" width="38" height="26" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.2"/><text x="559" y="98" text-anchor="middle" font-size="12" fill="#222">1</text><rect x="584" y="80" width="38" height="26" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.2"/><text x="603" y="98" text-anchor="middle" font-size="12" fill="#222">2</text><rect x="628" y="80" width="38" height="26" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.2"/><text x="647" y="98" text-anchor="middle" font-size="12" fill="#222">3</text><rect x="672" y="80" width="38" height="26" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.2"/><text x="691" y="98" text-anchor="middle" font-size="12" fill="#222">...</text><text x="100" y="139" text-anchor="end" font-size="11" fill="#888">byte 28</text><rect x="110" y="116" width="50" height="34" fill="#fff3c4" stroke="#888" stroke-width="2"/><text x="135" y="138" text-anchor="middle" font-size="14" fill="#222">1</text><rect x="160" y="116" width="200" height="34" fill="url(#pad)" stroke="#d4a017" stroke-width="2"/><rect x="161" y="117" width="60" height="32" fill="#fff"/><text x="166" y="138" font-size="14" fill="#222">aachen</text><rect x="360" y="116" width="70" height="34" fill="#fff" stroke="#d4a017" stroke-width="2"/><text x="395" y="138" text-anchor="middle" font-size="14" fill="#222">65</text><rect x="430" y="116" width="70" height="34" fill="#fff" stroke="#d4a017" stroke-width="2"/><circle cx="465" cy="133" r="4" fill="#1f4e79"/><path d="M469,133 L532,133" stroke="#1f4e79" stroke-width="1.6"/><path d="M532,128 L540,133 L532,138 z" fill="#1f4e79"/><rect x="540" y="120" width="38" height="26" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.2"/><text x="559" y="138" text-anchor="middle" font-size="12" fill="#222">4</text><rect x="584" y="120" width="38" height="26" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.2"/><text x="603" y="138" text-anchor="middle" font-size="12" fill="#222">19</text><rect x="628" y="120" width="38" height="26" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.2"/><text x="647" y="138" text-anchor="middle" font-size="12" fill="#222">...</text><text x="100" y="179" text-anchor="end" font-size="11" fill="#888"></text><rect x="110" y="156" width="50" height="34" fill="#eef1f5" stroke="#888" stroke-width="1.2"/><text x="135" y="178" text-anchor="middle" font-size="14" fill="#222">...</text><rect x="160" y="156" width="200" height="34" fill="#fff" stroke="#888" stroke-width="1.2"/><rect x="360" y="156" width="70" height="34" fill="#fff" stroke="#888" stroke-width="1.2"/><rect x="430" y="156" width="70" height="34" fill="#fff" stroke="#888" stroke-width="1.2"/><text x="260" y="178" text-anchor="middle" font-size="14" fill="#222">...</text><text x="395" y="178" text-anchor="middle" font-size="14" fill="#222">...</text><text x="465" y="178" text-anchor="middle" font-size="14" fill="#222">...</text><text x="100" y="219" text-anchor="end" font-size="11" fill="#888">byte 28M</text><rect x="110" y="196" width="50" height="34" fill="#eef1f5" stroke="#888" stroke-width="1.2"/><text x="135" y="218" text-anchor="middle" font-size="14" fill="#222">M</text><rect x="160" y="196" width="200" height="34" fill="url(#pad)" stroke="#888" stroke-width="1.2"/><rect x="161" y="197" width="40" height="32" fill="#fff"/><text x="166" y="218" font-size="14" fill="#222">zulu</text><rect x="360" y="196" width="70" height="34" fill="#fff" stroke="#888" stroke-width="1.2"/><text x="395" y="218" text-anchor="middle" font-size="14" fill="#222">221</text><rect x="430" y="196" width="70" height="34" fill="#fff" stroke="#888" stroke-width="1.2"/><circle cx="465" cy="213" r="4" fill="#1f4e79"/><path d="M469,213 L532,213" stroke="#1f4e79" stroke-width="1.6"/><path d="M532,208 L540,213 L532,218 z" fill="#1f4e79"/><rect x="540" y="200" width="38" height="26" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.2"/><text x="559" y="218" text-anchor="middle" font-size="12" fill="#222">7</text><rect x="584" y="200" width="38" height="26" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.2"/><text x="603" y="218" text-anchor="middle" font-size="12" fill="#222">40</text><rect x="628" y="200" width="38" height="26" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.2"/><text x="647" y="218" text-anchor="middle" font-size="12" fill="#222">...</text><text x="540" y="66" font-size="12" font-weight="bold" fill="#555">postings list (stored elsewhere)</text><text x="235" y="252" font-size="14" fill="#222"></text><text x="160" y="250" font-size="12" fill="#777">short words are padded with empty space (striped) so every row is 28 bytes</text><line x1="20" y1="272" x2="740" y2="272" stroke="#e3e3e3"/><text x="20" y="300" font-size="14" font-weight="bold" fill="#1f4e79">Looking up the query term "aachen"</text><rect x="20" y="318" width="120" height="40" fill="#fff3c4" stroke="#d4a017" stroke-width="2"/><text x="80" y="343" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">"aachen"</text><path d="M140,338 L182,338" stroke="#555" stroke-width="1.6"/><path d="M182,333 L190,338 L182,343 z" fill="#555"/><rect x="192" y="318" width="190" height="40" fill="#eef1f5" stroke="#555" stroke-width="1.5"/><text x="287" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">hash  or  tree</text><text x="287" y="352" text-anchor="middle" font-size="11" fill="#555">(Step 1: word -> row number)</text><path d="M382,338 L424,338" stroke="#555" stroke-width="1.6"/><path d="M424,333 L432,338 L424,343 z" fill="#555"/><rect x="434" y="318" width="80" height="40" fill="#fff3c4" stroke="#d4a017" stroke-width="2"/><text x="474" y="343" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">row 1</text><path d="M514,338 L556,338" stroke="#555" stroke-width="1.6"/><path d="M556,333 L564,338 L556,343 z" fill="#555"/><text x="570" y="334" font-size="12" font-weight="bold" fill="#222">Step 2: jump to byte</text><text x="570" y="350" font-size="12" fill="#222">1 x 28 = 28, read df 65,</text><text x="570" y="366" font-size="12" fill="#222">follow pointer</text><text x="20" y="396" font-size="12" fill="#555">The array only works if you already know the row number. Hash and tree are the two ways to get it from the word.</text></svg>
