<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e86c1"/></marker>
    <marker id="ak" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- ===== Row 1: 1:N ===== -->
  <g transform="translate(0,20)">
    <text x="20" y="10" font-weight="bold" font-size="14" fill="#2e86c1">1:N   WORKS_FOR</text>
    <rect x="20" y="24" width="100" height="32" fill="#eef4fb" stroke="#333"/><text x="70" y="44" text-anchor="middle" font-weight="bold">EMPLOYEE</text>
    <line x1="120" y1="40" x2="140" y2="40" stroke="#333"/><text x="124" y="34">N</text>
    <polygon points="185,18 230,40 185,62 140,40" fill="#fff" stroke="#333"/><text x="185" y="44" text-anchor="middle" font-size="10">WORKS_FOR</text>
    <line x1="230" y1="40" x2="250" y2="40" stroke="#333"/><text x="238" y="34">1</text>
    <rect x="250" y="24" width="100" height="32" fill="#eef4fb" stroke="#333"/><text x="300" y="44" text-anchor="middle" font-weight="bold">DEPARTMENT</text>
    <line x1="362" y1="40" x2="400" y2="40" stroke="#555" stroke-width="2" marker-end="url(#ak)"/>

    <text x="420" y="18" font-weight="bold">EMPLOYEE</text>
    <g stroke="#333" fill="#fff"><rect x="420" y="24" width="70" height="28"/><rect x="490" y="24" width="40" height="28"/><rect x="530" y="24" width="60" height="28" fill="#d6eaf8"/></g>
    <g text-anchor="middle"><text x="455" y="42" text-decoration="underline">Ssn</text><text x="510" y="42">...</text><text x="560" y="42" font-weight="bold">Dno</text></g>
    <text x="650" y="18" font-weight="bold">DEPARTMENT</text>
    <g stroke="#333" fill="#fff"><rect x="650" y="24" width="80" height="28"/><rect x="730" y="24" width="80" height="28"/></g>
    <g text-anchor="middle"><text x="690" y="42" text-decoration="underline">Dnumber</text><text x="770" y="42">Dname</text></g>
    <line x1="590" y1="38" x2="646" y2="38" stroke="#2e86c1" stroke-width="2" marker-end="url(#ab)"/>
    <text x="420" y="78" font-size="12" fill="#333">FK goes to the <tspan font-weight="bold">N side</tspan>: one employee = one department,</text>
    <text x="420" y="96" font-size="12" fill="#333">so one Dno cell is enough.</text><text x="420" y="114" font-size="12" fill="#888">(Ssn in DEPARTMENT would need many values in one cell.)</text>
  </g>

  <line x1="20" y1="140" x2="860" y2="140" stroke="#ddd"/>

  <!-- ===== Row 2: 1:1 ===== -->
  <g transform="translate(0,160)">
    <text x="20" y="10" font-weight="bold" font-size="14" fill="#2e86c1">1:1   MANAGES</text>
    <rect x="20" y="24" width="100" height="32" fill="#eef4fb" stroke="#333"/><text x="70" y="44" text-anchor="middle" font-weight="bold">EMPLOYEE</text>
    <line x1="120" y1="40" x2="140" y2="40" stroke="#333"/><text x="124" y="34">1</text>
    <polygon points="185,18 230,40 185,62 140,40" fill="#fff" stroke="#333"/><text x="185" y="44" text-anchor="middle" font-size="10">MANAGES</text>
    <line x1="230" y1="37" x2="250" y2="37" stroke="#333"/><line x1="230" y1="43" x2="250" y2="43" stroke="#333"/><text x="238" y="32">1</text>
    <rect x="250" y="24" width="100" height="32" fill="#eef4fb" stroke="#333"/><text x="300" y="44" text-anchor="middle" font-weight="bold">DEPARTMENT</text>
    <text x="232" y="74" font-size="10" fill="#d35400">double line = total</text>
    <line x1="362" y1="40" x2="400" y2="40" stroke="#555" stroke-width="2" marker-end="url(#ak)"/>

    <text x="420" y="18" font-weight="bold">DEPARTMENT</text>
    <g stroke="#333" fill="#fff"><rect x="420" y="24" width="80" height="28"/><rect x="500" y="24" width="40" height="28"/><rect x="540" y="24" width="80" height="28" fill="#d6eaf8"/><rect x="620" y="24" width="120" height="28" fill="#eafaf1"/></g>
    <g text-anchor="middle"><text x="460" y="42" text-decoration="underline">Dnumber</text><text x="520" y="42">...</text><text x="580" y="42" font-weight="bold">Mgr_ssn</text><text x="680" y="42">Mgr_start_date</text></g>
    <text x="760" y="18" font-weight="bold">EMPLOYEE</text>
    <g stroke="#333" fill="#fff"><rect x="760" y="24" width="70" height="28"/></g>
    <text x="795" y="42" text-anchor="middle" text-decoration="underline">Ssn</text>
    <path d="M580,52 L580,66 L795,66 L795,56" fill="none" stroke="#2e86c1" stroke-width="2" marker-end="url(#ab)"/>
    <text x="420" y="88" font-size="12" fill="#333">FK goes to the <tspan font-weight="bold">total participation side</tspan>: no NULLs.</text>
    <text x="420" y="106" font-size="12" fill="#888">In EMPLOYEE most rows would be NULL (most are not managers).</text>
    <text x="420" y="124" font-size="12" fill="#27ae60">Relationship attribute Start_date moves along with the FK.</text>
  </g>

  <line x1="20" y1="300" x2="860" y2="300" stroke="#ddd"/>

  <!-- ===== Row 3: M:N ===== -->
  <g transform="translate(0,320)">
    <text x="20" y="10" font-weight="bold" font-size="14" fill="#2e86c1">M:N   WORKS_ON</text>
    <rect x="20" y="24" width="100" height="32" fill="#eef4fb" stroke="#333"/><text x="70" y="44" text-anchor="middle" font-weight="bold">EMPLOYEE</text>
    <line x1="120" y1="40" x2="140" y2="40" stroke="#333"/><text x="124" y="34">M</text>
    <polygon points="185,18 230,40 185,62 140,40" fill="#fff" stroke="#333"/><text x="185" y="44" text-anchor="middle" font-size="10">WORKS_ON</text>
    <line x1="230" y1="40" x2="250" y2="40" stroke="#333"/><text x="238" y="34">N</text>
    <rect x="250" y="24" width="100" height="32" fill="#eef4fb" stroke="#333"/><text x="300" y="44" text-anchor="middle" font-weight="bold">PROJECT</text>
    <line x1="185" y1="62" x2="185" y2="80" stroke="#333"/>
    <ellipse cx="185" cy="94" rx="32" ry="14" fill="#fff" stroke="#333"/><text x="185" y="98" text-anchor="middle">Hours</text>
    <line x1="362" y1="40" x2="400" y2="40" stroke="#555" stroke-width="2" marker-end="url(#ak)"/>

    <text x="420" y="18" font-weight="bold">EMPLOYEE</text>
    <g stroke="#333" fill="#fff"><rect x="420" y="24" width="70" height="28"/><rect x="490" y="24" width="40" height="28"/></g>
    <g text-anchor="middle"><text x="455" y="42" text-decoration="underline">Ssn</text><text x="510" y="42">...</text></g>
    <text x="720" y="18" font-weight="bold">PROJECT</text>
    <g stroke="#333" fill="#fff"><rect x="720" y="24" width="80" height="28"/><rect x="800" y="24" width="50" height="28"/></g>
    <g text-anchor="middle"><text x="760" y="42" text-decoration="underline">Pnumber</text><text x="825" y="42">...</text></g>

    <text x="552" y="108" font-weight="bold" text-anchor="end">WORKS_ON</text><text x="758" y="108" fill="#c0392b">(new table)</text>
    <g stroke="#333" fill="#fff"><rect x="560" y="90" width="70" height="28" fill="#d6eaf8"/><rect x="630" y="90" width="60" height="28" fill="#d6eaf8"/><rect x="690" y="90" width="60" height="28" fill="#eafaf1"/></g>
    <g text-anchor="middle"><text x="595" y="108" text-decoration="underline">Essn</text><text x="660" y="108" text-decoration="underline">Pno</text><text x="720" y="108">Hours</text></g>
    <path d="M595,90 L595,70 L455,70 L455,56" fill="none" stroke="#2e86c1" stroke-width="2" marker-end="url(#ab)"/>
    <path d="M660,90 L660,70 L760,70 L760,56" fill="none" stroke="#2e86c1" stroke-width="2" marker-end="url(#ab)"/>
    <text x="420" y="144" font-size="12" fill="#333">One FK cell cannot hold M:N → <tspan font-weight="bold">new table</tspan>, both PKs as FKs.</text>
    <text x="420" y="162" font-size="12" fill="#333">PK = (Essn, Pno).  <tspan fill="#27ae60">Hours goes into the new table.</tspan></text>
  </g>
</svg>
