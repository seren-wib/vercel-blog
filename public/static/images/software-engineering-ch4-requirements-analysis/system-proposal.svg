    <rect x="265" y="355" width="230" height="80" rx="6" fill="#fdf6ec" stroke="#c07a20" stroke-width="1.5"/>
    <rect x="265" y="355" width="230" height="26" rx="6" fill="#fbe9cf" stroke="#c07a20" stroke-width="1.5"/>
