<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="1200" height="500" fill="#FFFFFF"/><text x="32" y="44" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#374151" text-anchor="start">매 세션 고정 입력과 필요할 때만 여는 파일</text><rect x="32" y="80" width="520" height="390" rx="10" fill="#EAF2FF" stroke="#3B6FD8" stroke-width="1.6"/><text x="52" y="112" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#234C9E" text-anchor="start">Always-loaded context</text><text x="52" y="134" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">책상 위 메모: 세션마다 다시 읽힘</text><rect x="52" y="160" width="480" height="60" rx="10" fill="#FFFFFF" stroke="#B9CDF2" stroke-width="1.6"/><text x="68" y="186" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#374151" text-anchor="start">Instruction file</text><text x="68" y="207" font-family="'JetBrains Mono', Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">CLAUDE.md · AGENTS.md · GEMINI.md</text><rect x="52" y="234" width="480" height="60" rx="10" fill="#FFFFFF" stroke="#B9CDF2" stroke-width="1.6"/><text x="68" y="260" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#374151" text-anchor="start">Global memory index</text><text x="68" y="281" font-family="'JetBrains Mono', Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">memory/global/MEMORY.md</text><rect x="52" y="308" width="480" height="60" rx="10" fill="#FFFFFF" stroke="#B9CDF2" stroke-width="1.6"/><text x="68" y="334" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#374151" text-anchor="start">Skill list</text><text x="68" y="355" font-family="'JetBrains Mono', Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">name + description × 13</text><rect x="52" y="382" width="480" height="60" rx="10" fill="#FFFFFF" stroke="#B9CDF2" stroke-width="1.6"/><text x="68" y="408" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#374151" text-anchor="start">MCP tool list, hook output</text><rect x="648" y="80" width="520" height="390" rx="10" fill="#E8F6EE" stroke="#2F9E62" stroke-width="1.6"/><text x="668" y="112" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1D6B41" text-anchor="start">Loaded on demand</text><text x="668" y="134" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">서랍 속 매뉴얼: 그 일을 할 때만 꺼냄</text><rect x="668" y="160" width="480" height="84" rx="10" fill="#FFFFFF" stroke="#A9DABE" stroke-width="1.6"/><text x="684" y="188" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#374151" text-anchor="start">SKILL.md body</text><text x="684" y="210" font-family="'JetBrains Mono', Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">~/.claude/skills/&lt;name&gt;/SKILL.md</text><text x="684" y="230" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">작업이 description과 맞을 때</text><rect x="668" y="280" width="480" height="84" rx="10" fill="#FFFFFF" stroke="#A9DABE" stroke-width="1.6"/><text x="684" y="308" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#374151" text-anchor="start">Sub-files</text><text x="684" y="330" font-family="'JetBrains Mono', Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">setup.md · sites/*.md · scripts</text><text x="684" y="350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">SKILL.md 본문이 가리킬 때만</text><rect x="668" y="392" width="480" height="60" rx="10" fill="#FFFFFF" stroke="#A9DABE" stroke-width="1.6"/><text x="684" y="428" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#374151" text-anchor="start">Memory note bodies</text><line x1="532" y1="344" x2="666" y2="206" stroke="#4B5563" stroke-width="1.6" marker-end="url(#ah)"/><text x="570" y="258" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start" font-style="italic">match</text><line x1="908" y1="244" x2="908" y2="278" stroke="#4B5563" stroke-width="1.6" marker-end="url(#ah)"/></svg>
