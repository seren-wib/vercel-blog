<text x="100" y="68" text-anchor="middle" font-weight="bold" fill="#1e293b">Host A</text><rect x="35" y="80" width="130" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="100" y="104" text-anchor="middle" font-size="12" fill="#1e293b">Application</text><rect x="35" y="124" width="130" height="38" rx="6" fill="#dcfce7" stroke="#22c55e"/><text x="100" y="148" text-anchor="middle" font-size="12" fill="#1e293b">Transport</text><rect x="35" y="168" width="130" height="38" rx="6" fill="#fef9c3" stroke="#eab308"/><text x="100" y="192" text-anchor="middle" font-size="12" fill="#1e293b">Network (IP)</text><rect x="35" y="212" width="130" height="38" rx="6" fill="#ede9fe" stroke="#8b5cf6"/><text x="100" y="236" text-anchor="middle" font-size="12" fill="#1e293b">Link (MAC)</text><rect x="35" y="256" width="130" height="38" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="100" y="280" text-anchor="middle" font-size="12" fill="#1e293b">Physical (signal)</text><text x="270" y="68" text-anchor="middle" font-weight="bold" fill="#1e293b">Repeater</text><rect x="205" y="256" width="130" height="38" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="270" y="280" text-anchor="middle" font-size="12" fill="#1e293b">Physical (signal)</text><text x="450" y="68" text-anchor="middle" font-weight="bold" fill="#1e293b">Switch</text><rect x="385" y="212" width="130" height="38" rx="6" fill="#ede9fe" stroke="#8b5cf6"/><text x="450" y="236" text-anchor="middle" font-size="12" fill="#1e293b">Link (MAC)</text><rect x="385" y="256" width="130" height="38" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="450" y="280" text-anchor="middle" font-size="12" fill="#1e293b">Physical (signal)</text><text x="630" y="68" text-anchor="middle" font-weight="bold" fill="#1e293b">Router</text><rect x="565" y="168" width="130" height="38" rx="6" fill="#fef9c3" stroke="#eab308"/><text x="630" y="192" text-anchor="middle" font-size="12" fill="#1e293b">Network (IP)</text><rect x="565" y="212" width="130" height="38" rx="6" fill="#ede9fe" stroke="#8b5cf6"/><text x="630" y="236" text-anchor="middle" font-size="12" fill="#1e293b">Link (MAC)</text><rect x="565" y="256" width="130" height="38" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="630" y="280" text-anchor="middle" font-size="12" fill="#1e293b">Physical (signal)</text><text x="800" y="68" text-anchor="middle" font-weight="bold" fill="#1e293b">Host B</text><rect x="735" y="80" width="130" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="800" y="104" text-anchor="middle" font-size="12" fill="#1e293b">Application</text><rect x="735" y="124" width="130" height="38" rx="6" fill="#dcfce7" stroke="#22c55e"/><text x="800" y="148" text-anchor="middle" font-size="12" fill="#1e293b">Transport</text><rect x="735" y="168" width="130" height="38" rx="6" fill="#fef9c3" stroke="#eab308"/><text x="800" y="192" text-anchor="middle" font-size="12" fill="#1e293b">Network (IP)</text><rect x="735" y="212" width="130" height="38" rx="6" fill="#ede9fe" stroke="#8b5cf6"/><text x="800" y="236" text-anchor="middle" font-size="12" fill="#1e293b">Link (MAC)</text><rect x="735" y="256" width="130" height="38" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="800" y="280" text-anchor="middle" font-size="12" fill="#1e293b">Physical (signal)</text><polyline points="47,99 47,275 270,275 450,275 450,231 450,275 630,275 630,187 630,275 853,275 853,99" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8"/><circle r="6" fill="#dc2626"><animateMotion dur="8s" repeatCount="indefinite" path="M47,99 L47,275 L270,275 L450,275 L450,231 L450,275 L630,275 L630,187 L630,275 L853,275 L853,99"/></circle><text x="270" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">reads nothing:</text><text x="270" y="338" text-anchor="middle" font-size="12" fill="#1e293b">just boosts the signal</text><text x="450" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">reads the MAC address</text><text x="450" y="338" text-anchor="middle" font-size="12" fill="#1e293b">→ picks the port</text><text x="630" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">reads the IP address</text><text x="630" y="338" text-anchor="middle" font-size="12" fill="#1e293b">→ picks the next network</text><text x="20" y="380" font-size="11" fill="#64748b">Red dot = one packet. Hosts use all layers; a device only goes up to the layer it needs, then back down to send.</text></svg>
