<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="900" height="360" fill="#fff"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#495057"/></marker></defs><text x="20" y="30" font-size="16"  font-weight="700" fill="#212529" >One block, token stream: caesar(1) brutus(1) caesar(2) noble(2) brutus(2)</text><rect x="20" y="50" width="400" height="290" rx="8" fill="#f8f9fa" stroke="#adb5bd"/><text x="220" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#1c7ed6" >BSBI: (termID, docID) pairs, sort all</text><text x="40" y="100" font-size="12"  font-weight="400" fill="#495057" >term → termID (kept for ALL blocks)</text><text x="40" y="118" font-size="13"  font-weight="400" fill="#212529" font-family="Consolas, monospace">brutus=1  caesar=2  noble=3</text><text x="60" y="145" font-size="12"  font-weight="400" fill="#495057" >pairs</text><text x="260" y="145" font-size="12"  font-weight="400" fill="#495057" >sorted</text><text x="60" y="170" font-size="13"  font-weight="400" fill="#212529" font-family="Consolas, monospace">(2,1)</text><text x="60" y="192" font-size="13"  font-weight="400" fill="#212529" font-family="Consolas, monospace">(1,1)</text><text x="60" y="214" font-size="13"  font-weight="400" fill="#212529" font-family="Consolas, monospace">(2,2)</text><text x="60" y="236" font-size="13"  font-weight="400" fill="#212529" font-family="Consolas, monospace">(3,2)</text><text x="60" y="258" font-size="13"  font-weight="400" fill="#212529" font-family="Consolas, monospace">(1,2)</text><text x="260" y="170" font-size="13"  font-weight="400" fill="#212529" font-family="Consolas, monospace">(1,1)</text><text x="260" y="192" font-size="13"  font-weight="400" fill="#212529" font-family="Consolas, monospace">(1,2)</text><text x="260" y="214" font-size="13"  font-weight="400" fill="#212529" font-family="Consolas, monospace">(2,1)</text><text x="260" y="236" font-size="13"  font-weight="400" fill="#212529" font-family="Consolas, monospace">(2,2)</text><text x="260" y="258" font-size="13"  font-weight="400" fill="#212529" font-family="Consolas, monospace">(3,2)</text><line x1="130" y1="215" x2="240" y2="215" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><text x="185" y="207" font-size="12" text-anchor="middle" font-weight="400" fill="#495057" >sort</text><text x="40" y="300" font-size="12"  font-weight="400" fill="#d9480f" >sort cost: every posting (pairs)</text><text x="40" y="320" font-size="12"  font-weight="400" fill="#d9480f" >needs global term→termID dictionary</text><rect x="460" y="50" width="420" height="290" rx="8" fill="#fff9db" stroke="#adb5bd"/><text x="670" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#e67700" >SPIMI: per-block dictionary, no pair sort</text><text x="480" y="100" font-size="12"  font-weight="400" fill="#495057" >hash dictionary (insertion order)</text><rect x="480" y="112" width="80" height="26" rx="4" fill="#fff" stroke="#868e96"/><text x="520" y="130" font-size="13" text-anchor="middle" font-weight="400" fill="#212529" font-family="Consolas, monospace">caesar</text><line x1="562" y1="125" x2="588" y2="125" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><text x="594" y="130" font-size="13"  font-weight="400" fill="#212529" font-family="Consolas, monospace">1 → 2</text><rect x="480" y="146" width="80" height="26" rx="4" fill="#fff" stroke="#868e96"/><text x="520" y="164" font-size="13" text-anchor="middle" font-weight="400" fill="#212529" font-family="Consolas, monospace">brutus</text><line x1="562" y1="159" x2="588" y2="159" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><text x="594" y="164" font-size="13"  font-weight="400" fill="#212529" font-family="Consolas, monospace">1 → 2</text><rect x="480" y="180" width="80" height="26" rx="4" fill="#fff" stroke="#868e96"/><text x="520" y="198" font-size="13" text-anchor="middle" font-weight="400" fill="#212529" font-family="Consolas, monospace">noble</text><line x1="562" y1="193" x2="588" y2="193" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><text x="594" y="198" font-size="13"  font-weight="400" fill="#212529" font-family="Consolas, monospace">2</text><text x="480" y="236" font-size="12"  font-weight="400" fill="#495057" >memory full → sort only the terms → write</text><text x="500" y="260" font-size="13"  font-weight="400" fill="#212529" font-family="Consolas, monospace">brutus  1 → 2</text><text x="500" y="280" font-size="13"  font-weight="400" fill="#212529" font-family="Consolas, monospace">caesar  1 → 2</text><text x="500" y="300" font-size="13"  font-weight="400" fill="#212529" font-family="Consolas, monospace">noble  2</text><text x="700" y="280" font-size="12"  font-weight="400" fill="#495057" >block index</text><text x="700" y="296" font-size="12"  font-weight="400" fill="#495057" >(own dictionary)</text><text x="480" y="330" font-size="12"  font-weight="400" fill="#d9480f" >postings added to the list as tokens arrive</text></svg>