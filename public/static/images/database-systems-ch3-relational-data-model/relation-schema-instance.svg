<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#27ae60"/></marker>
    <marker id="ay" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b7950b"/></marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>

  <!-- Schema label -->
  <rect x="20" y="16" width="840" height="46" rx="6" fill="#eef4fb" stroke="#2e86c1"/>
  <text x="32" y="36" font-weight="bold" fill="#2e86c1">Relation schema  R(A1, A2, ..., An)  =  STUDENT(Name, Ssn, Age, Gpa)</text>
  <text x="32" y="54" font-size="12" fill="#2e86c1">the frame: relation name + attribute names/types, no data.  Degree n = 4</text>

  <!-- R and A labels -->
  <text x="200" y="98" font-weight="bold" font-size="16">STUDENT</text>
  <text x="290" y="98" font-size="13" fill="#2e86c1">= R</text>
  <g text-anchor="middle" font-size="12" fill="#2e86c1" font-weight="bold">
    <text x="275" y="122">A1</text><text x="415" y="122">A2</text><text x="530" y="122">A3</text><text x="620" y="122">A4</text>
  </g>

  <!-- Header row (schema) -->
  <g stroke="#333" fill="#dfe8f5">
    <rect x="200" y="128" width="150" height="34"/><rect x="350" y="128" width="130" height="34"/>
    <rect x="480" y="128" width="100" height="34"/><rect x="580" y="128" width="80" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="bold">
    <text x="275" y="150">Name</text><text x="415" y="150">Ssn</text><text x="530" y="150">Age</text><text x="620" y="150">Gpa</text>
  </g>

  <!-- Data rows (instance) -->
  <g stroke="#333" fill="#ffffff">
    <rect x="200" y="162" width="150" height="34"/><rect x="350" y="162" width="130" height="34"/><rect x="480" y="162" width="100" height="34"/><rect x="580" y="162" width="80" height="34"/>
    <rect x="200" y="196" width="150" height="34"/><rect x="350" y="196" width="130" height="34"/><rect x="480" y="196" width="100" height="34"/><rect x="580" y="196" width="80" height="34"/>
    <rect x="200" y="230" width="150" height="34"/><rect x="350" y="230" width="130" height="34"/><rect x="480" y="230" width="100" height="34"/><rect x="580" y="230" width="80" height="34" fill="#fff6d6"/>
  </g>
  <!-- tuple t1 highlight -->
  <rect x="200" y="162" width="460" height="34" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Age column highlight -->
  <rect x="480" y="128" width="100" height="136" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="6 3"/>

  <g text-anchor="middle">
    <text x="282" y="184">Dick Davidson</text><text x="422" y="184">422-11-2320</text><text x="535" y="184">25</text><text x="627" y="184">3.53</text>
    <text x="282" y="218">Rohan Panchal</text><text x="422" y="218">489-22-1100</text><text x="535" y="218">28</text><text x="627" y="218">3.93</text>
    <text x="282" y="252">Barbara Benson</text><text x="422" y="252">533-69-1238</text><text x="535" y="252">19</text><text x="627" y="252" fill="#b7950b" font-weight="bold">NULL</text>
  </g>
  <!-- v labels on t1 -->
  <g font-size="10" fill="#c0392b" font-weight="bold">
    <text x="204" y="173">v1</text><text x="354" y="173">v2</text><text x="484" y="173">v3</text><text x="584" y="173">v4</text>
  </g>

  <!-- tuple labels -->
  <g font-size="13" text-anchor="end">
    <text x="190" y="184" fill="#c0392b" font-weight="bold">t1</text>
    <text x="190" y="218">t2</text>
    <text x="190" y="252">t3</text>
  </g>
  <text x="30" y="300" font-size="13" fill="#c0392b" font-weight="bold">Tuple t1 = &lt;v1, v2, v3, v4&gt;</text>
  <text x="30" y="318" font-size="12" fill="#c0392b">= &lt;Dick Davidson, 422-11-2320, 25, 3.53&gt;  (one row)</text>
  <line x1="110" y1="286" x2="196" y2="186" stroke="#c0392b" marker-end="url(#ar)"/>

  <!-- instance bracket -->
  <path d="M668,162 L680,162 L680,264 L668,264" fill="none" stroke="#555" stroke-width="1.5"/>
  <text x="690" y="180" font-size="13" font-weight="bold" fill="#555">Relation instance</text>
  <text x="690" y="197" font-size="13" font-weight="bold" fill="#555">(state)</text>
  <text x="690" y="216" font-size="13" fill="#555">r(R) = {t1, t2, t3}</text>
  <text x="690" y="234" font-size="12" fill="#555">rows stored now, m = 3</text>
  <text x="690" y="250" font-size="12" fill="#555">changes on insert/delete</text>

  <!-- NULL -->
  <line x1="700" y1="300" x2="645" y2="268" stroke="#b7950b" marker-end="url(#ay)"/>
  <text x="706" y="306" font-size="12" fill="#b7950b" font-weight="bold">or NULL</text>
  <text x="706" y="322" font-size="12" fill="#b7950b">(value unknown)</text>

  <!-- domain -->
  <line x1="530" y1="334" x2="530" y2="270" stroke="#27ae60" marker-end="url(#ag)"/>
  <text x="340" y="354" font-size="13" fill="#27ae60" font-weight="bold">dom(A3) = dom(Age) = integers 15 ~ 80</text>
  <text x="340" y="372" font-size="12" fill="#27ae60">every v3 must be in dom(Age): 25 OK, 200 or "twenty" not OK</text>

  <!-- footer -->
  <text x="30" y="420" font-size="13" fill="#333">Schema = header row (fixed).  Instance = rows under it (changes over time).</text>
  <text x="30" y="442" font-size="12" fill="#888">Degree n = number of attributes (4),  m = number of tuples (3)</text>
</svg>
