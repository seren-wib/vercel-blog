<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Pretendard, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="m2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#2563eb"/></marker><marker id="m16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#16a34a"/></marker><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#dc2626"/></marker><marker id="m9333ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#9333ea"/></marker></defs>
<rect width="960" height="520" fill="#ffffff" rx="8"/>
<text x="20" y="32" font-size="17" font-weight="bold" fill="#1e293b">How TCP turns lossy IP into an ordered byte stream</text>
<text x="20" y="52" font-size="12" fill="#64748b">Each segment carries 100 bytes. seq = number of its first byte. ACK n = "I have every byte before n".</text>
<text x="200" y="78" text-anchor="middle" font-weight="bold" fill="#1e293b">Laptop (sender)</text>
<text x="620" y="78" text-anchor="middle" font-weight="bold" fill="#1e293b">Server (receiver)</text>
<line x1="200" y1="86" x2="200" y2="450" stroke="#94a3b8" stroke-width="2"/>
<line x1="620" y1="86" x2="620" y2="450" stroke="#94a3b8" stroke-width="2"/>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0286;0.9714"/><line x1="200" y1="95" x2="620" y2="118" stroke="#2563eb" stroke-width="2" marker-end="url(#m2563eb)"/><text x="222" y="89" font-size="11" text-anchor="start" fill="#2563eb">A  seq=1</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1000;0.9714"/><line x1="620" y1="124" x2="200" y2="147" stroke="#16a34a" stroke-width="2" marker-end="url(#m16a34a)"/><text x="598" y="140" font-size="11" text-anchor="end" fill="#16a34a">ACK 101</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1714;0.9714"/><line x1="200" y1="163" x2="410" y2="175" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/><text x="222" y="158" font-size="11" fill="#dc2626">B  seq=101</text><text x="420" y="182" font-size="20" font-weight="bold" fill="#dc2626">✕</text><text x="445" y="181" font-size="11" fill="#dc2626">dropped at a full router queue</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2429;0.9714"/><line x1="200" y1="184" x2="620" y2="207" stroke="#2563eb" stroke-width="2" marker-end="url(#m2563eb)"/><text x="222" y="178" font-size="11" text-anchor="start" fill="#2563eb">C  seq=201</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3000;0.9714"/><line x1="620" y1="213" x2="200" y2="236" stroke="#16a34a" stroke-width="2" marker-end="url(#m16a34a)"/><text x="598" y="229" font-size="11" text-anchor="end" fill="#16a34a">ACK 101  (dup 1)</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3571;0.9714"/><line x1="200" y1="246" x2="620" y2="269" stroke="#2563eb" stroke-width="2" marker-end="url(#m2563eb)"/><text x="222" y="240" font-size="11" text-anchor="start" fill="#2563eb">D  seq=301</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4143;0.9714"/><line x1="620" y1="275" x2="200" y2="298" stroke="#16a34a" stroke-width="2" marker-end="url(#m16a34a)"/><text x="598" y="291" font-size="11" text-anchor="end" fill="#16a34a">ACK 101  (dup 2)</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4714;0.9714"/><line x1="200" y1="308" x2="620" y2="331" stroke="#2563eb" stroke-width="2" marker-end="url(#m2563eb)"/><text x="222" y="302" font-size="11" text-anchor="start" fill="#2563eb">E  seq=401</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5286;0.9714"/><line x1="620" y1="337" x2="200" y2="360" stroke="#16a34a" stroke-width="2" marker-end="url(#m16a34a)"/><text x="598" y="353" font-size="11" text-anchor="end" fill="#16a34a">ACK 101  (dup 3)</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5857;0.9714"/><text x="188" y="378" text-anchor="end" font-size="11" font-weight="bold" fill="#9333ea">3 dup ACKs →</text><text x="188" y="392" text-anchor="end" font-size="11" font-weight="bold" fill="#9333ea">fast retransmit B</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6429;0.9714"/><line x1="200" y1="385" x2="620" y2="408" stroke="#9333ea" stroke-width="2" marker-end="url(#m9333ea)"/><text x="222" y="379" font-size="11" text-anchor="start" fill="#9333ea">B  seq=101  (again)</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.7143;0.9714"/><line x1="620" y1="414" x2="200" y2="437" stroke="#16a34a" stroke-width="2" marker-end="url(#m16a34a)"/><text x="598" y="430" font-size="11" text-anchor="end" fill="#16a34a">ACK 501</text></g>
<text x="660" y="100" font-weight="bold" fill="#1e293b">Server receive buffer</text>
<text x="660" y="116" font-size="11" fill="#64748b">what the app can read with recv()</text>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0714;0.2429"/><rect x="660" y="130" width="50" height="34" rx="4" fill="#dcfce7" stroke="#22c55e" /><text x="685" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">A</text><text x="660" y="186" font-size="11" fill="#166534">A in order → app can read 100 B</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2429;0.3571"/><rect x="660" y="130" width="50" height="34" rx="4" fill="#dcfce7" stroke="#22c55e" /><text x="685" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">A</text><rect x="714" y="130" width="50" height="34" rx="4" fill="#ffffff" stroke="#dc2626" stroke-dasharray="4 3"/><text x="739" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">?</text><rect x="768" y="130" width="50" height="34" rx="4" fill="#fef9c3" stroke="#eab308" /><text x="793" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">C</text><text x="660" y="186" font-size="11" fill="#854d0e">C held: there is a hole at byte 101</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3571;0.4714"/><rect x="660" y="130" width="50" height="34" rx="4" fill="#dcfce7" stroke="#22c55e" /><text x="685" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">A</text><rect x="714" y="130" width="50" height="34" rx="4" fill="#ffffff" stroke="#dc2626" stroke-dasharray="4 3"/><text x="739" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">?</text><rect x="768" y="130" width="50" height="34" rx="4" fill="#fef9c3" stroke="#eab308" /><text x="793" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">C</text><rect x="822" y="130" width="50" height="34" rx="4" fill="#fef9c3" stroke="#eab308" /><text x="847" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">D</text><text x="660" y="186" font-size="11" fill="#854d0e">C, D held out of order</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4714;0.6857"/><rect x="660" y="130" width="50" height="34" rx="4" fill="#dcfce7" stroke="#22c55e" /><text x="685" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">A</text><rect x="714" y="130" width="50" height="34" rx="4" fill="#ffffff" stroke="#dc2626" stroke-dasharray="4 3"/><text x="739" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">?</text><rect x="768" y="130" width="50" height="34" rx="4" fill="#fef9c3" stroke="#eab308" /><text x="793" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">C</text><rect x="822" y="130" width="50" height="34" rx="4" fill="#fef9c3" stroke="#eab308" /><text x="847" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">D</text><rect x="876" y="130" width="50" height="34" rx="4" fill="#fef9c3" stroke="#eab308" /><text x="901" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">E</text><text x="660" y="186" font-size="11" fill="#854d0e">C, D, E held; app still sees only A</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6857;0.9714"/><rect x="660" y="130" width="50" height="34" rx="4" fill="#dcfce7" stroke="#22c55e" /><text x="685" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">A</text><rect x="714" y="130" width="50" height="34" rx="4" fill="#dcfce7" stroke="#22c55e" /><text x="739" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">B</text><rect x="768" y="130" width="50" height="34" rx="4" fill="#dcfce7" stroke="#22c55e" /><text x="793" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">C</text><rect x="822" y="130" width="50" height="34" rx="4" fill="#dcfce7" stroke="#22c55e" /><text x="847" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">D</text><rect x="876" y="130" width="50" height="34" rx="4" fill="#dcfce7" stroke="#22c55e" /><text x="901" y="152" text-anchor="middle" font-weight="bold" fill="#1e293b">E</text><text x="660" y="186" font-size="11" fill="#166534">hole filled → app reads A B C D E in order</text></g>
<text x="660" y="230" font-weight="bold" fill="#1e293b">What else TCP is doing</text>
<text x="660" y="252" font-size="11.5" fill="#334155">• timeout: no ACK within RTO → resend</text>
<text x="660" y="272" font-size="11.5" fill="#334155">• flow control: receiver window (rwnd)</text>
<text x="670" y="288" font-size="11.5" fill="#334155">says how much buffer is free</text>
<text x="660" y="308" font-size="11.5" fill="#334155">• congestion control: loss shrinks the</text>
<text x="670" y="324" font-size="11.5" fill="#334155">congestion window (cwnd)</text>
<text x="660" y="344" font-size="11.5" fill="#334155">• in flight ≤ min(rwnd, cwnd)</text>
<text x="660" y="364" font-size="11.5" fill="#334155">• routers in between never see this:</text>
<text x="670" y="380" font-size="11.5" fill="#334155">TCP runs only on the two end hosts</text>
<text x="20" y="490" font-size="11" fill="#64748b">IP is best effort: it may drop, delay, duplicate or reorder packets. TCP fixes that at the ends with seq, ACK and retransmission.</text>
<text x="20" y="507" font-size="11" fill="#64748b">UDP does none of this: each datagram arrives once, late, or never, and the app decides what to do.</text>
</svg>
