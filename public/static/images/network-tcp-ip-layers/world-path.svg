<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Pretendard, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">
<rect width="980" height="560" fill="#ffffff" rx="8"/>
<text x="20" y="32" font-size="17" font-weight="bold" fill="#1e293b">Seoul to São Paulo: the networks a chat message really crosses</text>
<text x="20" y="52" font-size="12" fill="#64748b">One possible path. Box color = the highest layer that box works at. Distances are rough estimates, not measured routes.</text>
<path d="M105 113 H865 V253 H105 V393 H865" fill="none" stroke="#cbd5e1" stroke-width="4"/>
<path d="M865 136 V230" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-dasharray="10 5"/>
<path d="M105 276 V370" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-dasharray="10 5"/>
<text x="852" y="172" text-anchor="end" font-size="12" font-weight="bold" fill="#0369a1">Transpacific submarine cable ≈ 9,000 km</text>
<text x="852" y="189" text-anchor="end" font-size="11" fill="#0369a1">fiber pairs, many wavelengths (WDM), optical repeaters along the seabed</text>
<text x="118" y="312" font-size="12" font-weight="bold" fill="#0369a1">US → Brazil: land fiber + submarine cable ≈ 11,000 km</text>
<text x="118" y="329" font-size="11" fill="#0369a1">a new TCP connection: the server pushes "Hi" to the friend's open connection</text>
<rect x="30" y="90" width="150" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="105" y="109" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#1e293b">Laptop (Seoul)</text><text x="105" y="126" text-anchor="middle" font-size="10.5" fill="#475569">Wi-Fi · CSMA/CA</text>
<rect x="220" y="90" width="150" height="46" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="295" y="109" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#1e293b">Home router</text><text x="295" y="126" text-anchor="middle" font-size="10.5" fill="#475569">NAT · default gateway</text>
<rect x="410" y="90" width="150" height="46" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="485" y="109" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#1e293b">Access network</text><text x="485" y="126" text-anchor="middle" font-size="10.5" fill="#475569">FTTH: ONT → OLT</text>
<rect x="600" y="90" width="150" height="46" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="675" y="109" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#1e293b">Korean ISP core</text><text x="675" y="126" text-anchor="middle" font-size="10.5" fill="#475569">own AS · OSPF inside</text>
<rect x="790" y="90" width="150" height="46" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="865" y="109" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#1e293b">Landing station</text><text x="865" y="126" text-anchor="middle" font-size="10.5" fill="#475569">Busan · cable meets land</text>
<rect x="30" y="230" width="150" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="105" y="249" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#1e293b">Chat server</text><text x="105" y="266" text-anchor="middle" font-size="10.5" fill="#475569">TCP/TLS ends here</text>
<rect x="220" y="230" width="150" height="46" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="295" y="249" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#1e293b">DC router + LB</text><text x="295" y="266" text-anchor="middle" font-size="10.5" fill="#475569">picks one server</text>
<rect x="410" y="230" width="150" height="46" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="485" y="249" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#1e293b">IXP</text><text x="485" y="266" text-anchor="middle" font-size="10.5" fill="#475569">peering switch fabric</text>
<rect x="600" y="230" width="150" height="46" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="675" y="249" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#1e293b">Tier 1 backbone</text><text x="675" y="266" text-anchor="middle" font-size="10.5" fill="#475569">BGP transit</text>
<rect x="790" y="230" width="150" height="46" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="865" y="249" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#1e293b">Landing station</text><text x="865" y="266" text-anchor="middle" font-size="10.5" fill="#475569">US west coast</text>
<rect x="30" y="370" width="150" height="46" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="105" y="389" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#1e293b">Landing station</text><text x="105" y="406" text-anchor="middle" font-size="10.5" fill="#475569">Brazil northeast coast</text>
<rect x="220" y="370" width="150" height="46" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="295" y="389" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#1e293b">Brazilian ISP</text><text x="295" y="406" text-anchor="middle" font-size="10.5" fill="#475569">own AS · BGP</text>
<rect x="410" y="370" width="150" height="46" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="485" y="389" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#1e293b">Mobile core</text><text x="485" y="406" text-anchor="middle" font-size="10.5" fill="#475569">CGNAT · 100.64.0.0/10</text>
<rect x="600" y="370" width="150" height="46" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="675" y="389" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#1e293b">LTE base station</text><text x="675" y="406" text-anchor="middle" font-size="10.5" fill="#475569">scheduled radio, no CSMA</text>
<rect x="790" y="370" width="150" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="865" y="389" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#1e293b">Friend's phone</text><text x="865" y="406" text-anchor="middle" font-size="10.5" fill="#475569">São Paulo · app shows "Hi"</text>
<circle r="8" fill="#ef4444" stroke="#ffffff" stroke-width="2"><animateMotion dur="16s" repeatCount="indefinite" path="M105 113 H865 V253 H105 V393 H865" keyPoints="0;1;1" keyTimes="0;0.94;1" calcMode="linear"/></circle>
<text x="20" y="455" font-weight="bold" fill="#1e293b">Where the time goes (one way)</text>
<text x="20" y="476" font-size="12" fill="#334155">propagation: ≈ 20,000 km ÷ ≈ 200,000 km/s in fiber ≈ 100 ms (estimate). No upgrade makes light faster, so distance sets the floor.</text>
<text x="20" y="495" font-size="12" fill="#334155">transmission: frame size ÷ link rate (1500 B on 1 Gbps = 12 µs per hop). processing: header checks, table lookups (µs per router).</text>
<text x="20" y="514" font-size="12" fill="#334155">queuing: waiting in a router buffer behind other traffic. It changes packet by packet: that is jitter, and a full queue means loss.</text>
<rect x="20" y="528" width="14" height="14" rx="3" fill="#dbeafe" stroke="#3b82f6"/><text x="40" y="540" font-size="11" fill="#475569">host: all layers</text>
<rect x="150" y="528" width="14" height="14" rx="3" fill="#fef9c3" stroke="#eab308"/><text x="170" y="540" font-size="11" fill="#475569">router: up to network</text>
<rect x="310" y="528" width="14" height="14" rx="3" fill="#ede9fe" stroke="#8b5cf6"/><text x="330" y="540" font-size="11" fill="#475569">switch / radio / PON: up to link</text>
<rect x="520" y="528" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#64748b"/><text x="540" y="540" font-size="11" fill="#475569">cable, repeater, landing: physical</text>
</svg>
