    <text x="24" y="144" xml:space="preserve"></text>
    <text x="24" y="164" xml:space="preserve">$ kubectl -n kube-system get helmchart monitoring -o jsonpath='{.spec.chart}  {.spec.version}'</text>
    <text x="24" y="184" xml:space="preserve">oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack  93.1.1</text>
    <text x="24" y="204" xml:space="preserve"></text>
    <text x="24" y="224" xml:space="preserve">$ kubectl -n monitoring get pods</text>
