<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="820" height="300" fill="#ffffff"/>

  <!-- EMPLOYEE (owner) -->
  <rect x="40" y="110" width="130" height="44" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="105" y="137" text-anchor="middle" font-weight="bold">EMPLOYEE</text>
  <text x="105" y="90" text-anchor="middle" font-size="12" fill="#555">owner (identifying) entity</text>
  <!-- Ssn key -->
  <ellipse cx="105" cy="210" rx="34" ry="14" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="105" y="214" text-anchor="middle" text-decoration="underline">Ssn</text>
  <line x1="105" y1="154" x2="105" y2="196" stroke="#222" stroke-width="1.5"/>

  <!-- line owner -> relationship, single (partial) -->
  <line x1="170" y1="132" x2="290" y2="132" stroke="#222" stroke-width="1.5"/>
  <text x="275" y="124" text-anchor="end" font-weight="bold">1</text>

  <!-- Identifying relationship: double diamond -->
  <path d="M290,132 L370,88 L450,132 L370,176 z" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <path d="M302,132 L370,95 L438,132 L370,169 z" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="370" y="136" text-anchor="middle" font-size="10">DEPENDENTS_OF</text>
  <text x="370" y="60" text-anchor="middle" font-size="12" fill="#c0392b">identifying relationship (double diamond)</text>

  <!-- line relationship -> weak entity, double (total) -->
  <line x1="450" y1="128" x2="570" y2="128" stroke="#222" stroke-width="1.5"/>
  <line x1="450" y1="136" x2="570" y2="136" stroke="#222" stroke-width="1.5"/>
  <text x="462" y="122" font-weight="bold">N</text>

  <!-- DEPENDENT: double rectangle -->
  <rect x="570" y="106" width="150" height="52" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <rect x="576" y="112" width="138" height="40" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="645" y="137" text-anchor="middle" font-weight="bold">DEPENDENT</text>
  <text x="645" y="90" text-anchor="middle" font-size="12" fill="#c0392b">weak entity (double rectangle)</text>

  <!-- DEPENDENT attributes -->
  <ellipse cx="585" cy="225" rx="52" ry="14" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="585" y="229" text-anchor="middle" font-size="12" text-decoration="underline" style="text-decoration-style: dashed">Dependent_name</text>
  <line x1="610" y1="158" x2="590" y2="211" stroke="#222" stroke-width="1.5"/>
  <ellipse cx="700" cy="225" rx="28" ry="14" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="700" y="229" text-anchor="middle" font-size="12">Sex</text>
  <line x1="670" y1="158" x2="695" y2="211" stroke="#222" stroke-width="1.5"/>
  <ellipse cx="770" cy="180" rx="42" ry="14" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="770" y="184" text-anchor="middle" font-size="12">Relationship</text>
  <line x1="720" y1="150" x2="735" y2="170" stroke="#222" stroke-width="1.5"/>
  <text x="585" y="256" text-anchor="middle" font-size="11" fill="#c0392b">partial key (dashed underline)</text>

  <!-- Bottom notes -->
  <text x="40" y="284" font-size="12" fill="#555">double line on the weak side = total participation (every dependent has an owner).  real key of DEPENDENT = Ssn of owner + Dependent_name</text>
</svg>
