<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" font-family="Pretendard, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="290" fill="#ffffff" rx="8"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/></marker></defs>
  <text x="20" y="32" font-size="16" font-weight="bold" fill="#1e293b">Concurrency vs Parallelism</text>
  <text x="20" y="72" font-weight="bold" fill="#1e293b">Concurrency</text>
  <text x="20" y="90" font-size="12" fill="#64748b">1 core, take turns</text>
  <rect x="230" y="60" width="40" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="250" y="82" text-anchor="middle" fill="#1e293b">A</text>
  <rect x="272" y="60" width="40" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="292" y="82" text-anchor="middle" fill="#1e293b">B</text>
  <rect x="314" y="60" width="40" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="334" y="82" text-anchor="middle" fill="#1e293b">A</text>
  <rect x="356" y="60" width="40" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="376" y="82" text-anchor="middle" fill="#1e293b">B</text>
  <rect x="398" y="60" width="40" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="418" y="82" text-anchor="middle" fill="#1e293b">A</text>
  <rect x="440" y="60" width="40" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="460" y="82" text-anchor="middle" fill="#1e293b">B</text>
  <rect x="482" y="60" width="40" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="502" y="82" text-anchor="middle" fill="#1e293b">A</text>
  <rect x="524" y="60" width="40" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="544" y="82" text-anchor="middle" fill="#1e293b">B</text>
  <rect x="566" y="60" width="40" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="586" y="82" text-anchor="middle" fill="#1e293b">A</text>
  <rect x="608" y="60" width="40" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="628" y="82" text-anchor="middle" fill="#1e293b">B</text>
  <rect x="650" y="60" width="40" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="670" y="82" text-anchor="middle" fill="#1e293b">A</text>
  <rect x="692" y="60" width="40" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="712" y="82" text-anchor="middle" fill="#1e293b">B</text>
  <text x="230" y="114" font-size="12" fill="#64748b">only one job runs at any instant, but A and B both look like they are running</text>
  <text x="20" y="162" font-weight="bold" fill="#1e293b">Parallelism</text>
  <text x="20" y="180" font-size="12" fill="#64748b">2 cores, same moment</text>
  <text x="160" y="172" font-weight="bold" fill="#1e293b">Core 1</text>
  <rect x="230" y="150" width="502" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="481" y="172" text-anchor="middle" fill="#1e293b">A</text>
  <text x="160" y="216" font-weight="bold" fill="#1e293b">Core 2</text>
  <rect x="230" y="194" width="502" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="481" y="216" text-anchor="middle" fill="#1e293b">B</text>
  <text x="230" y="250" font-size="12" fill="#64748b">A and B really run at the same moment (each core can still time-share inside)</text>
  <line x1="230" y1="270" x2="734" y2="270" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="704" y="264" font-size="12" fill="#64748b">time</text>
</svg>
