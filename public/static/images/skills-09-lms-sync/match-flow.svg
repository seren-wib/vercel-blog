<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect width="1200" height="420" fill="#FFFFFF"/><text x="32" y="44" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#374151" text-anchor="start">LMS 항목 하나가 "이미 있음"인지 가르는 순서</text><rect x="32" y="80" width="230" height="110" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="46" y="108" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#374151" text-anchor="start">LMS item</text><text x="46" y="130" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 게시판의 유인물 한 장</text><text x="46" y="152" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="14" font-weight="400" fill="#374151" text-anchor="start">module id</text><rect x="310" y="80" width="250" height="110" rx="10" fill="#EAF2FF" stroke="#3B6FD8" stroke-width="1.6"/><text x="324" y="108" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#234C9E" text-anchor="start">manifest hit?</text><text x="324" y="130" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 받은 목록에 번호가 있나</text><text x="324" y="152" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="14" font-weight="400" fill="#374151" text-anchor="start">.lms-sync.json</text><text x="324" y="174" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">path 있음 or sha1 일치</text><rect x="608" y="80" width="250" height="110" rx="10" fill="#EAF2FF" stroke="#3B6FD8" stroke-width="1.6"/><text x="622" y="108" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#234C9E" text-anchor="start">name match?</text><text x="622" y="130" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 같은 이름 파일이 있나</text><text x="622" y="152" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">과목 폴더 전체, 모든 확장자</text><rect x="906" y="80" width="262" height="110" rx="10" fill="#FFF4E0" stroke="#C98A1B" stroke-width="1.6"/><text x="920" y="108" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#8A5D0C" text-anchor="start">SHA-1 match?</text><text x="920" y="130" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">비유: 이름표 말고 지문</text><text x="920" y="152" font-family="'JetBrains Mono', Consolas, 'D2Coding', monospace" font-size="14" font-weight="400" fill="#374151" text-anchor="start">crypto.subtle.digest</text><text x="920" y="174" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">같은 확장자 로컬 파일과</text><rect x="310" y="270" width="250" height="100" rx="10" fill="#E8F6EE" stroke="#2E9E5B" stroke-width="1.6"/><text x="324" y="298" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'No