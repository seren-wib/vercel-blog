<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="12">
  <rect width="760" height="560" fill="#fff"/>
  <rect x="230" y="14" width="300" height="38" rx="8" fill="#2b5d8a"/>
  <text x="380" y="39" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">System Proposal</text>

  <!-- column 1 -->
  <g>
    <rect x="20" y="70" width="230" height="120" rx="6" fill="#f3f7fb" stroke="#2b5d8a" stroke-width="1.5"/>
    <rect x="20" y="70" width="230" height="26" rx="6" fill="#e6f0fa" stroke="#2b5d8a" stroke-width="1.5"/>
    <text x="135" y="88" text-anchor="middle" font-weight="bold" font-size="13">1. Proposal Summary</text>
    <text x="32" y="116">1.1 Development Goals</text>
    <text x="32" y="136">1.2 Development Content</text>
    <text x="32" y="156">1.3 WBS</text>
    <text x="32" y="176">1.4 Glossary</text>

    <rect x="20" y="205" width="230" height="120" rx="6" fill="#f3f7fb" stroke="#2b5d8a" stroke-width="1.5"/>
    <rect x="20" y="205" width="230" height="26" rx="6" fill="#e6f0fa" stroke="#2b5d8a" stroke-width="1.5"/>
    <text x="135" y="223" text-anchor="middle" font-weight="bold" font-size="13">2. System Request</text>
    <text x="32" y="251">2.1 Project Sponsor</text>
    <text x="32" y="271">2.2 System Users</text>
    <text x="32" y="291">2.3 Business Need</text>
    <text x="32" y="311">2.4 Special Issues, Constraints</text>

    <rect x="20" y="340" width="230" height="100" rx="6" fill="#f3f7fb" stroke="#2b5d8a" stroke-width="1.5"/>
    <rect x="20" y="340" width="230" height="26" rx="6" fill="#e6f0fa" stroke="#2b5d8a" stroke-width="1.5"/>
    <text x="135" y="358" text-anchor="middle" font-weight="bold" font-size="13">3. Requirements Analysis</text>
    <text x="32" y="386">3.1 Functional</text>
    <text x="32" y="406">3.2 Non-functional</text>
    <text x="32" y="426">3.3 Domain</text>

    <rect x="20" y="455" width="230" height="80" rx="6" fill="#f3f7fb" stroke="#2b5d8a" stroke-width="1.5"/>
    <rect x="20" y="455" width="230" height="26" rx="6" fill="#e6f0fa" stroke="#2b5d8a" stroke-width="1.5"/>
    <text x="135" y="473" text-anchor="middle" font-weight="bold" font-size="13">4. Work Plan</text>
    <text x="32" y="501">4.1 CPM Network, Task List</text>
    <text x="32" y="521">4.2 Gantt Chart Schedule</text>
  </g>

  <!-- column 2 -->
  <g>
    <rect x="265" y="70" width="230" height="80" rx="6" fill="#f3f7fb" stroke="#2b5d8a" stroke-width="1.5"/>
    <rect x="265" y="70" width="230" height="26" rx="6" fill="#e6f0fa" stroke="#2b5d8a" stroke-width="1.5"/>
    <text x="380" y="88" text-anchor="middle" font-weight="bold" font-size="13">5. Organization, Job Description</text>
    <text x="277" y="116">5.1 Staffing</text>
    <text x="277" y="136">5.2 Job Description</text>

    <rect x="265" y="165" width="230" height="120" rx="6" fill="#f3f7fb" stroke="#2b5d8a" stroke-width="1.5"/>
    <rect x="265" y="165" width="230" height="26" rx="6" fill="#e6f0fa" stroke="#2b5d8a" stroke-width="1.5"/>
    <text x="380" y="183" text-anchor="middle" font-weight="bold" font-size="13">6. Feasibility Analysis</text>
    <text x="277" y="211">6.1 Economic</text>
    <text x="277" y="231">6.2 Technical</text>
    <text x="277" y="251">6.3 Organizational</text>
    <text x="277" y="271">6.4 Legal</text>

    <rect x="265" y="300" width="230" height="40" rx="6" fill="#e6f0fa" stroke="#2b5d8a" stroke-width="1.5"/>
