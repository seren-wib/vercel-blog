<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e86c1"/></marker>
    <marker id="ak" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="820" height="320" fill="#ffffff"/>

  <text x="20" y="24" font-weight="bold" fill="#555">ER diagram</text>
  <text x="380" y="24" font-weight="bold" fill="#555">Relations</text>

  <!-- multivalued attribute -->
  <ellipse cx="110" cy="66" rx="62" ry="20" fill="#fff" stroke="#333"/>
  <ellipse cx="110" cy="66" rx="55" ry="14" fill="none" stroke="#333"/>
  <text x="110" y="70" text-anchor="middle">Locations</text>
  <text x="180" y="50" font-size="11" fill="#d35400">multivalued (double oval)</text>
  <line x1="110" y1="86" x2="110" y2="120" stroke="#333"/>
  <rect x="40" y="120" width="140" height="36" fill="#eef4fb" stroke="#333"/>
  <text x="110" y="143" text-anchor="middle" font-weight="bold">DEPARTMENT</text>
  <line x1="80" y1="156" x2="70" y2="190" stroke="#333"/>
  <line x1="140" y1="156" x2="160" y2="190" stroke="#333"/>
  <ellipse cx="65" cy="204" rx="40" ry="15" fill="#fff" stroke="#333"/>
  <text x="65" y="208" text-anchor="middle">Dname</text>
  <ellipse cx="165" cy="204" rx="44" ry="15" fill="#fff" stroke="#333"/>
  <text x="165" y="208" text-anchor="middle" text-decoration="underline">Dnumber</text>

  <line x1="300" y1="140" x2="350" y2="140" stroke="#555" stroke-width="2.5" marker-end="url(#ak)"/>

  <!-- DEPARTMENT -->
  <text x="380" y="58" font-weight="bold">DEPARTMENT</text>
  <g stroke="#333" fill="#fff">
    <rect x="380" y="64" width="120" height="30"/><rect x="500" y="64" width="100" height="30" fill="#fdecea"/>
  </g>
  <g text-anchor="middle"><text x="440" y="84">Dname</text><text x="550" y="84" text-decoration="underline">Dnumber</text></g>
  <text x="615" y="84" font-size="11" fill="#888">(no Locations column)</text>

  <!-- DEPT_LOCATIONS -->
  <text x="500" y="158" font-weight="bold">DEPT_LOCATIONS</text>
  <g stroke="#333" fill="#fff">
    <rect x="500" y="164" width="100" height="30" fill="#d6eaf8"/><rect x="600" y="164" width="110" height="30" fill="#fdecea"/>
    <rect x="500" y="194" width="100" height="26"/><rect x="600" y="194" width="110" height="26"/>
    <rect x="500" y="220" width="100" height="26"/><rect x="600" y="220" width="110" height="26"/>
    <rect x="500" y="246" width="100" height="26"/><rect x="600" y="246" width="110" height="26"/>
  </g>
  <g text-anchor="middle">
    <text x="550" y="184" text-decoration="underline">Dnumber</text><text x="655" y="184" text-decoration="underline">Dlocation</text>
    <text x="550" y="212">5</text><text x="655" y="212">Seoul</text>
    <text x="550" y="238">5</text><text x="655" y="238">Incheon</text>
    <text x="550" y="264">3</text><text x="655" y="264">Seoul</text>
  </g>
  <line x1="550" y1="164" x2="550" y2="98" stroke="#2e86c1" stroke-width="2" marker-end="url(#ab)"/>
  <text x="558" y="134" font-size="12" fill="#2e86c1">FK</text>
  <text x="720" y="225" font-size="11" fill="#555">one row per</text>
  <text x="720" y="240" font-size="11" fill="#555">location;</text>
  <text x="720" y="255" font-size="11" fill="#555">5 repeats</text>

  <g font-size="13" fill="#333">
    <text x="20" y="296">Multivalued attribute → new table: owner PK (as FK) + the attribute.  PK = both together.</text>
  </g>
</svg>
