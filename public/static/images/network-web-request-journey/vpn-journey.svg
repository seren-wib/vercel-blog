<svg xmlns="http://www.w3.org/2000/svg" width="980" height="702" viewBox="0 0 980 702" font-family='Pretendard, "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif' font-size="13">
<rect width="980" height="702" fill="#ffffff" rx="8"/>
<text x="20" y="32" font-size="17" font-weight="bold" fill="#1e293b">VPN을 켜고 같은 웹 요청을 보낼 때</text>
<text x="20" y="52" font-size="12" fill="#64748b">원래 패킷(10.8.0.2 → 192.0.2.10:443)을 통째로 암호화해서 바깥 IP·UDP 헤더로 한 겹 더 감싸 VPN 서버까지 보냄</text>
<line x1="90" y1="128" x2="890" y2="128" stroke="#cbd5e1" stroke-width="3"/>
<rect x="90" y="119" width="600" height="18" rx="9" fill="#e879f9" opacity="0.35"/>
<text x="390" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#86198f">VPN 터널 (암호화된 통로)</text>
<text x="190" y="166" text-anchor="middle" font-size="11" fill="#64748b">링크 1 · Wi-Fi (터널 안)</text>
<text x="390" y="166" text-anchor="middle" font-size="11" fill="#64748b">링크 2 · ISP 회선 (터널 안)</text>
<text x="590" y="166" text-anchor="middle" font-size="11" fill="#64748b">링크 3 · 인터넷 (터널 안)</text>
<text x="790" y="166" text-anchor="middle" font-size="11" fill="#64748b">링크 4 · VPN 서버 → 웹 서버 (터널 밖)</text>
<rect x="28" y="104" width="124" height="48" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
<text x="90" y="124" text-anchor="middle" font-weight="bold" fill="#1e293b">노트북</text>
<text x="90" y="141" text-anchor="middle" font-size="10.5" fill="#64748b">가상 IP 10.8.0.2</text>
<rect x="228" y="104" width="124" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
<text x="290" y="124" text-anchor="middle" font-weight="bold" fill="#1e293b">집 공유기</text>
<text x="290" y="141" text-anchor="middle" font-size="10.5" fill="#64748b">NAT</text>
<rect x="428" y="104" width="124" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
<text x="490" y="124" text-anchor="middle" font-weight="bold" fill="#1e293b">ISP 라우터</text>
<text x="490" y="141" text-anchor="middle" font-size="10.5" fill="#64748b">바깥 헤더만 봄</text>
<rect x="628" y="104" width="124" height="48" rx="8" fill="#fae8ff" stroke="#c026d3"/>
<text x="690" y="124" text-anchor="middle" font-weight="bold" fill="#1e293b">VPN 서버</text>
<text x="690" y="141" text-anchor="middle" font-size="10.5" fill="#64748b">198.51.100.7</text>
<rect x="828" y="104" width="124" height="48" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
<text x="890" y="124" text-anchor="middle" font-weight="bold" fill="#1e293b">웹 서버</text>
<text x="890" y="141" text-anchor="middle" font-size="10.5" fill="#64748b">192.0.2.10 : 443</text>
<rect y="86" width="24" height="14" rx="3" fill="#ef4444"><animate attributeName="x" dur="12s" repeatCount="indefinite" values="142;142;214;342;342;414;542;542;614;742;742;814;814" keyTimes="0.0000;0.0417;0.2167;0.2500;0.2917;0.4667;0.5000;0.5417;0.7167;0.7500;0.7917;0.9667;1.0000"/></rect>
<g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="1;0;0;0;1" keyTimes="0.0000;0.2500;0.5000;0.7500;1"/>
<text x="30" y="204" font-weight="bold" fill="#1e293b">지금 구간: <tspan fill="#b91c1c">링크 1 · Wi-Fi (터널 안)</tspan>  <tspan font-weight="normal" fill="#64748b">(빨간 글씨 = 이 구간에서 바뀐 값)</tspan></text>
<rect x="30" y="218" width="920" height="414" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="42" y="237" font-weight="bold" fill="#5b21b6">링크 계층: 프레임</text><text x="42" y="258" fill="#1e293b">출발지 MAC <tspan fill="#b91c1c" font-weight="bold">노트북</tspan>   →   목적지 MAC <tspan fill="#b91c1c" font-weight="bold">공유기</tspan></text><rect x="46" y="268" width="888" height="354" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="58" y="287" font-weight="bold" fill="#854d0e">바깥 IP 헤더 (VPN이 새로 붙인 것)</text><text x="58" y="308" fill="#1e293b">출발지 IP 192.168.1.20   →   목적지 IP <tspan font-weight="bold">198.51.100.7 (VPN 서버)</tspan>      TTL <tspan fill="#b91c1c" font-weight="bold">64</tspan></text><rect x="62" y="318" width="856" height="294" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="74" y="337" font-weight="bold" fill="#166534">바깥 UDP 헤더</text><text x="74" y="358" fill="#1e293b">출발지 포트 50000   →   목적지 포트 51820 (WireGuard 예)</text><rect x="78" y="368" width="824" height="234" rx="8" fill="#fae8ff" stroke="#c026d3"/><text x="90" y="387" font-weight="bold" fill="#86198f">VPN 암호화 구간: 아래 원래 패킷 전체가 암호화됨 (공유기·ISP는 못 읽음)</text><text x="90" y="408" fill="#1e293b"><tspan fill="#64748b">VPN 헤더 + 인증 태그</tspan></text><rect x="94" y="418" width="792" height="174" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="106" y="437" font-weight="bold" fill="#475569">원래 IP 패킷</text><text x="106" y="458" fill="#1e293b"><tspan fill="#64748b">10.8.0.2 (VPN 가상 IP)  →  192.0.2.10 (진짜 목적지)</tspan></text><rect x="110" y="468" width="760" height="114" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="122" y="487" font-weight="bold" fill="#475569">원래 TCP 세그먼트</text><text x="122" y="508" fill="#1e293b"><tspan fill="#64748b">→ 포트 443</tspan></text><rect x="126" y="518" width="728" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="138" y="537" font-weight="bold" fill="#475569">TLS로 암호화된 HTTP</text><text x="138" y="558" fill="#1e293b"><tspan fill="#64748b">GET /video</tspan></text>
<text x="30" y="656" fill="#b91c1c">노트북 VPN 클라이언트: 원래 패킷 암호화 → 바깥 UDP·IP 헤더 붙임. 바깥 목적지는 VPN 서버</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0;0" keyTimes="0.0000;0.2500;0.5000;0.7500;1"/>
<text x="30" y="204" font-weight="bold" fill="#1e293b">지금 구간: <tspan fill="#b91c1c">링크 2 · ISP 회선 (터널 안)</tspan>  <tspan font-weight="normal" fill="#64748b">(빨간 글씨 = 이 구간에서 바뀐 값)</tspan></text>
<rect x="30" y="218" width="920" height="414" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="42" y="237" font-weight="bold" fill="#5b21b6">링크 계층: 프레임</text><text x="42" y="258" fill="#1e293b">출발지 MAC <tspan fill="#b91c1c" font-weight="bold">공유기</tspan>   →   목적지 MAC <tspan fill="#b91c1c" font-weight="bold">ISP 라우터</tspan></text><rect x="46" y="268" width="888" height="354" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="58" y="287" font-weight="bold" fill="#854d0e">바깥 IP 헤더 (VPN이 새로 붙인 것)</text><text x="58" y="308" fill="#1e293b">출발지 IP <tspan fill="#b91c1c" font-weight="bold">203.0.113.5</tspan>   →   목적지 IP <tspan font-weight="bold">198.51.100.7 (VPN 서버)</tspan>      TTL <tspan fill="#b91c1c" font-weight="bold">63</tspan></text><rect x="62" y="318" width="856" height="294" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="74" y="337" font-weight="bold" fill="#166534">바깥 UDP 헤더</text><text x="74" y="358" fill="#1e293b">출발지 포트 <tspan fill="#b91c1c" font-weight="bold">40002</tspan>   →   목적지 포트 51820 (WireGuard 예)</text><rect x="78" y="368" width="824" height="234" rx="8" fill="#fae8ff" stroke="#c026d3"/><text x="90" y="387" font-weight="bold" fill="#86198f">VPN 암호화 구간: 아래 원래 패킷 전체가 암호화됨 (공유기·ISP는 못 읽음)</text><text x="90" y="408" fill="#1e293b"><tspan fill="#64748b">VPN 헤더 + 인증 태그</tspan></text><rect x="94" y="418" width="792" height="174" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="106" y="437" font-weight="bold" fill="#475569">원래 IP 패킷</text><text x="106" y="458" fill="#1e293b"><tspan fill="#64748b">10.8.0.2 (VPN 가상 IP)  →  192.0.2.10 (진짜 목적지)</tspan></text><rect x="110" y="468" width="760" height="114" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="122" y="487" font-weight="bold" fill="#475569">원래 TCP 세그먼트</text><text x="122" y="508" fill="#1e293b"><tspan fill="#64748b">→ 포트 443</tspan></text><rect x="126" y="518" width="728" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="138" y="537" font-weight="bold" fill="#475569">TLS로 암호화된 HTTP</text><text x="138" y="558" fill="#1e293b"><tspan fill="#64748b">GET /video</tspan></text>
<text x="30" y="656" fill="#b91c1c">공유기 NAT는 바깥 헤더만 바꿈. 안쪽 패킷은 암호화돼 있어서 손 안 댐</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;0;1;0;0" keyTimes="0.0000;0.2500;0.5000;0.7500;1"/>
<text x="30" y="204" font-weight="bold" fill="#1e293b">지금 구간: <tspan fill="#b91c1c">링크 3 · 인터넷 (터널 안)</tspan>  <tspan font-weight="normal" fill="#64748b">(빨간 글씨 = 이 구간에서 바뀐 값)</tspan></text>
<rect x="30" y="218" width="920" height="414" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="42" y="237" font-weight="bold" fill="#5b21b6">링크 계층: 프레임</text><text x="42" y="258" fill="#1e293b">출발지 MAC <tspan fill="#b91c1c" font-weight="bold">ISP 라우터</tspan>   →   목적지 MAC <tspan fill="#b91c1c" font-weight="bold">VPN 서버</tspan></text><rect x="46" y="268" width="888" height="354" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="58" y="287" font-weight="bold" fill="#854d0e">바깥 IP 헤더 (VPN이 새로 붙인 것)</text><text x="58" y="308" fill="#1e293b">출발지 IP 203.0.113.5   →   목적지 IP <tspan font-weight="bold">198.51.100.7 (VPN 서버)</tspan>      TTL <tspan fill="#b91c1c" font-weight="bold">62</tspan></text><rect x="62" y="318" width="856" height="294" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="74" y="337" font-weight="bold" fill="#166534">바깥 UDP 헤더</text><text x="74" y="358" fill="#1e293b">출발지 포트 40002   →   목적지 포트 51820 (WireGuard 예)</text><rect x="78" y="368" width="824" height="234" rx="8" fill="#fae8ff" stroke="#c026d3"/><text x="90" y="387" font-weight="bold" fill="#86198f">VPN 암호화 구간: 아래 원래 패킷 전체가 암호화됨 (공유기·ISP는 못 읽음)</text><text x="90" y="408" fill="#1e293b"><tspan fill="#64748b">VPN 헤더 + 인증 태그</tspan></text><rect x="94" y="418" width="792" height="174" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="106" y="437" font-weight="bold" fill="#475569">원래 IP 패킷</text><text x="106" y="458" fill="#1e293b"><tspan fill="#64748b">10.8.0.2 (VPN 가상 IP)  →  192.0.2.10 (진짜 목적지)</tspan></text><rect x="110" y="468" width="760" height="114" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="122" y="487" font-weight="bold" fill="#475569">원래 TCP 세그먼트</text><text x="122" y="508" fill="#1e293b"><tspan fill="#64748b">→ 포트 443</tspan></text><rect x="126" y="518" width="728" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="138" y="537" font-weight="bold" fill="#475569">TLS로 암호화된 HTTP</text><text x="138" y="558" fill="#1e293b"><tspan fill="#64748b">GET /video</tspan></text>
<text x="30" y="656" fill="#b91c1c">ISP가 아는 것: '이 집이 VPN 서버랑 통신 중'까지. 진짜 목적지·내용은 모름</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;0;0;1;0" keyTimes="0.0000;0.2500;0.5000;0.7500;1"/>
<text x="30" y="204" font-weight="bold" fill="#1e293b">지금 구간: <tspan fill="#b91c1c">링크 4 · VPN 서버 → 웹 서버 (터널 밖)</tspan>  <tspan font-weight="normal" fill="#64748b">(빨간 글씨 = 이 구간에서 바뀐 값)</tspan></text>
<rect x="30" y="218" width="920" height="234" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="42" y="237" font-weight="bold" fill="#5b21b6">링크 계층: 프레임</text><text x="42" y="258" fill="#1e293b">출발지 MAC <tspan fill="#b91c1c" font-weight="bold">VPN 서버</tspan>   →   목적지 MAC <tspan fill="#b91c1c" font-weight="bold">다음 라우터</tspan></text><rect x="46" y="268" width="888" height="174" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="58" y="287" font-weight="bold" fill="#854d0e">IP 패킷 (원래 패킷, 바깥 껍데기 벗김)</text><text x="58" y="308" fill="#1e293b">출발지 IP <tspan fill="#b91c1c" font-weight="bold">198.51.100.7</tspan> (VPN 서버 NAT)   →   목적지 IP 192.0.2.10      TTL <tspan fill="#b91c1c" font-weight="bold">63</tspan></text><rect x="62" y="318" width="856" height="114" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="74" y="337" font-weight="bold" fill="#166534">TCP 세그먼트</text><text x="74" y="358" fill="#1e293b">출발지 포트 <tspan fill="#b91c1c" font-weight="bold">35000</tspan>   →   목적지 포트 443</text><rect x="78" y="368" width="824" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="90" y="387" font-weight="bold" fill="#1e3a8a">응용 계층: HTTP 요청 (TLS 암호화는 그대로 남음)</text><text x="90" y="408" fill="#1e293b"><tspan fill="#64748b">GET /video</tspan></text>
<text x="30" y="476" fill="#b91c1c">VPN 서버: 바깥 헤더 벗기고 복호화 → 출발지 10.8.0.2를 자기 IP로 NAT → 웹 서버는 VPN 서버 IP만 봄</text>
</g>
<text x="30" y="686" font-size="11" fill="#64748b">VPN 암호화는 노트북 ~ VPN 서버 구간만. 그 뒤로는 일반 인터넷(HTTPS면 TLS만 남음). 응답은 VPN 서버에서 다시 터널에 넣어 돌아옴.</text>
</svg>
