<svg xmlns="http://www.w3.org/2000/svg" width="900" height="508" viewBox="0 0 900 508" role="img" aria-label="Terminal output">
  <rect width="900" height="508" rx="12" fill="#0d1117"/>
  <rect width="900" height="36" rx="12" fill="#161b22"/>
  <rect y="24" width="900" height="12" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="450" y="23" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">k3s-leader — admission refusals</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#e6edf3">
    <text x="24" y="64" xml:space="preserve">$ kubectl create --dry-run=server --as=system:serviceaccount:deploy:deploy-executor -f - &lt;&lt;'EOF'</text>
    <text x="24" y="84" xml:space="preserve">apiVersion: v1</text>
    <text x="24" y="104" xml:space="preserve">kind: Service</text>
    <text x="24" y="124" xml:space="preserve">metadata: {name: cache, namespace: proj-demo}</text>
    <text x="24" y="144" xml:space="preserve">spec: {selector: {app: web}, externalIPs: ["192.168.77.11"], ports: [{port: 5000}]}</text>
    <text x="24" y="164" xml:space="preserve">EOF</text>
    <text x="24" y="184" xml:space="preserve"><tspan fill="#79c0ff">Warning</tspan>: spec.externalIPs is deprecated and may no longer be implemented in some clusters</text>
    <text x="24" y="204" xml:space="preserve">The services "cache" is invalid: : ValidatingAdmissionPolicy 'wanggane-student-services'</text>
    <text x="24" y="224" xml:space="preserve">  with binding 'wanggane-student-services' denied request:</text>
    <text x="24" y="244" xml:space="preserve">  a Service in a student space must not set externalIPs</text>
    <text x="24" y="264" xml:space="preserve"></text>
    <text x="24" y="284" xml:space="preserve">$ kubectl create --dry-run=server -f - &lt;&lt;'EOF'</text>
    <text x="24" y="304" xml:space="preserve">apiVersion: v1</text>
    <text x="24" y="324" xml:space="preserve">kind: Pod</text>
    <text x="24" y="344" xml:space="preserve">metadata: {name: pin, namespace: proj-demo}</text>
    <text x="24" y="364" xml:space="preserve">spec:</text>
    <text x="24" y="384" xml:space="preserve">  nodeName: k3s-leader</text>
    <text x="24" y="404" xml:space="preserve">  ...</text>
    <text x="24" y="424" xml:space="preserve">EOF</text>
    <text x="24" y="444" xml:space="preserve"><tspan fill="#79c0ff">Warning</tspan>: would violate PodSecurity "restricted:latest": allowPrivilegeEscalation != false ...</text>
    <text x="24" y="464" xml:space="preserve">The pods "pin" is invalid: : ValidatingAdmissionPolicy 'wanggane-student-pods'</text>
    <text x="24" y="484" xml:space="preserve">  with binding 'wanggane-student-pods' denied request: student Pods must not set nodeName</text>
  </g>
</svg>
