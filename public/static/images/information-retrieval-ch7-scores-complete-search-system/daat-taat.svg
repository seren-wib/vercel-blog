<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <!-- Panel A: document-at-a-time -->
  <text x="20" y="26" font-size="17" font-weight="bold" fill="#222">Document-at-a-time: finish one document, then the next</text>

  <g font-size="12" fill="#c05621" text-anchor="middle" font-weight="bold">
    <circle cx="180" cy="52" r="11" fill="#fbd38d"/><text x="180" y="56">1</text>
    <circle cx="270" cy="52" r="11" fill="#fbd38d"/><text x="270" y="56">2</text>
    <circle cx="360" cy="52" r="11" fill="#fbd38d"/><text x="360" y="56">3</text>
    <circle cx="450" cy="52" r="11" fill="#fbd38d"/><text x="450" y="56">4</text>
    <circle cx="540" cy="52" r="11" fill="#fbd38d"/><text x="540" y="56">5</text>
    <circle cx="630" cy="52" r="11" fill="#fbd38d"/><text x="630" y="56">6</text>
    <circle cx="720" cy="52" r="11" fill="#fbd38d"/><text x="720" y="56">7</text>
  </g>
  <g font-size="13" fill="#444" text-anchor="middle">
    <text x="180" y="80">doc 1</text><text x="270" y="80">doc 5</text><text x="360" y="80">doc 7</text>
    <text x="450" y="80">doc 13</text><text x="540" y="80">doc 17</text><text x="630" y="80">doc 83</text><text x="720" y="80">doc 87</text>
  </g>
  <g fill="none" stroke="#dd6b20" stroke-width="2" stroke-dasharray="5 3">
    <rect x="136" y="86" width="88" height="88" rx="6"/>
    <rect x="226" y="86" width="88" height="88" rx="6"/>
    <rect x="316" y="86" width="88" height="88" rx="6"/>
    <rect x="406" y="86" width="88" height="88" rx="6"/>
    <rect x="496" y="86" width="88" height="88" rx="6"/>
    <rect x="586" y="86" width="88" height="88" rx="6"/>
    <rect x="676" y="86" width="88" height="88" rx="6"/>
  </g>
  <g font-size="14" fill="#222">
    <text x="20" y="117">Brutus</text>
    <text x="20" y="159">Caesar</text>
  </g>
  <!-- Brutus row: 1,7,83,87 -->
  <g fill="#e2e8f0" stroke="#4a5568">
    <rect x="140" y="92" width="80" height="36" rx="4"/>
    <rect x="320" y="92" width="80" height="36" rx="4"/>
    <rect x="590" y="92" width="80" height="36" rx="4"/>
    <rect x="680" y="92" width="80" height="36" rx="4"/>
    <rect x="140" y="134" width="80" height="36" rx="4"/>
    <rect x="230" y="134" width="80" height="36" rx="4"/>
    <rect x="410" y="134" width="80" height="36" rx="4"/>
    <rect x="500" y="134" width="80" height="36" rx="4"/>
  </g>
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="180" y="115">tf 2</text><text x="360" y="115">tf 3</text><text x="630" y="115">tf 1</text><text x="720" y="115">tf 2</text>
    <text x="180" y="157">tf 1</text><text x="270" y="157">tf 1</text><text x="450" y="157">tf 1</text><text x="540" y="157">tf 1</text>
  </g>
  <text x="20" y="198" font-size="13" fill="#555">Score of doc 1 is final before doc 5 starts. Every list must use the same order (docID or PageRank).</text>

  <line x1="20" y1="220" x2="780" y2="220" stroke="#cbd5e0"/>

  <!-- Panel B: term-at-a-time -->
  <text x="20" y="250" font-size="17" font-weight="bold" fill="#222">Term-at-a-time: finish one postings list, then the next</text>
  <g font-size="13" fill="#444" text-anchor="middle">
    <text x="180" y="276">doc 1</text><text x="270" y="276">doc 5</text><text x="360" y="276">doc 7</text>
    <text x="450" y="276">doc 13</text><text x="540" y="276">doc 17</text><text x="630" y="276">doc 83</text><text x="720" y="276">doc 87</text>
  </g>
  <g fill="none" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="5 3">
    <rect x="134" y="284" width="632" height="44" rx="6"/>
    <rect x="134" y="332" width="632" height="44" rx="6"/>
  </g>
  <g font-size="12" fill="#2b6cb0" text-anchor="middle" font-weight="bold">
    <circle cx="112" cy="306" r="11" fill="#bee3f8"/><text x="112" y="310">1</text>
    <circle cx="112" cy="354" r="11" fill="#bee3f8"/><text x="112" y="358">2</text>
  </g>
  <g font-size="14" fill="#222">
    <text x="20" y="311">Brutus</text>
    <text x="20" y="359">Caesar</text>
  </g>
  <g fill="#e2e8f0" stroke="#4a5568">
    <rect x="140" y="288" width="80" height="36" rx="4"/>
    <rect x="320" y="288" width="80" height="36" rx="4"/>
    <rect x="590" y="288" width="80" height="36" rx="4"/>
    <rect x="680" y="288" width="80" height="36" rx="4"/>
    <rect x="140" y="336" width="80" height="36" rx="4"/>
    <rect x="230" y="336" width="80" height="36" rx="4"/>
    <rect x="410" y="336" width="80" height="36" rx="4"/>
    <rect x="500" y="336" width="80" height="36" rx="4"/>
  </g>
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="180" y="311">tf 2</text><text x="360" y="311">tf 3</text><text x="630" y="311">tf 1</text><text x="720" y="311">tf 2</text>
    <text x="180" y="359">tf 1</text><text x="270" y="359">tf 1</text><text x="450" y="359">tf 1</text><text x="540" y="359">tf 1</text>
  </g>
  <!-- accumulators -->
  <text x="20" y="413" font-size="14" fill="#222">Accumulators</text>
  <g fill="#c6f6d5" stroke="#2f855a">
    <rect x="140" y="390" width="80" height="36" rx="4"/>
    <rect x="230" y="390" width="80" height="36" rx="4"/>
    <rect x="320" y="390" width="80" height="36" rx="4"/>
    <rect x="410" y="390" width="80" height="36" rx="4"/>
    <rect x="500" y="390" width="80" height="36" rx="4"/>
    <rect x="590" y="390" width="80" height="36" rx="4"/>
    <rect x="680" y="390" width="80" height="36" rx="4"/>
  </g>
  <g font-size="13" fill="#22543d" text-anchor="middle">
    <text x="180" y="413">B + C</text><text x="270" y="413">C</text><text x="360" y="413">B</text>
    <text x="450" y="413">C</text><text x="540" y="413">C</text><text x="630" y="413">B</text><text x="720" y="413">B</text>
  </g>
  <text x="20" y="455" font-size="13" fill="#555">Every score stays partial until the last list is done. Lists may use different orders (e.g. weight-sorted).</text>
</svg>
