<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="Helvetica, Arial, AppleGothic, sans-serif" font-size="14"><rect width="760" height="400" fill="#fff"/>
<text x="60" y="30" font-weight="bold">AND</text>
<line x1="20" y1="60" x2="60" y2="60" stroke="#000" stroke-width="2"/>
<line x1="20" y1="100" x2="60" y2="100" stroke="#000" stroke-width="2"/>
<path transform="translate(60,50)" d="M0,0 H40 A30,30 0 0 1 40,60 H0 Z" fill="none" stroke="#000" stroke-width="2"/>
<line x1="130" y1="80" x2="170" y2="80" stroke="#000" stroke-width="2"/>
<text x="5" y="64" >A</text>
<text x="5" y="104" >B</text>
<text x="176" y="84" >Y</text>
<text x="20" y="140" font-size="12" fill="#444">A B | Y</text><text x="20" y="156" font-size="12" fill="#444">0 0 | 0</text><text x="20" y="172" font-size="12" fill="#444">0 1 | 0</text><text x="20" y="188" font-size="12" fill="#444">1 0 | 0</text><text x="20" y="204" font-size="12" fill="#444">1 1 | 1</text>
<text x="250" y="30" font-weight="bold">OR</text>
<line x1="210" y1="60" x2="255" y2="60" stroke="#000" stroke-width="2"/>
<line x1="210" y1="100" x2="255" y2="100" stroke="#000" stroke-width="2"/>
<path transform="translate(250,50)" d="M0,0 Q20,30 0,60 Q40,60 70,30 Q40,0 0,0 Z" fill="none" stroke="#000" stroke-width="2"/>
<line x1="320" y1="80" x2="360" y2="80" stroke="#000" stroke-width="2"/>
<text x="195" y="64" >A</text>
<text x="195" y="104" >B</text>
<text x="366" y="84" >Y</text>
<text x="210" y="140" font-size="12" fill="#444">A B | Y</text><text x="210" y="156" font-size="12" fill="#444">0 0 | 0</text><text x="210" y="172" font-size="12" fill="#444">0 1 | 1</text><text x="210" y="188" font-size="12" fill="#444">1 0 | 1</text><text x="210" y="204" font-size="12" fill="#444">1 1 | 1</text>
<text x="440" y="30" font-weight="bold">XOR</text>
<line x1="400" y1="60" x2="445" y2="60" stroke="#000" stroke-width="2"/>
<line x1="400" y1="100" x2="445" y2="100" stroke="#000" stroke-width="2"/>
<path transform="translate(440,50)" d="M8,0 Q28,30 8,60 Q48,60 78,30 Q48,0 8,0 Z" fill="none" stroke="#000" stroke-width="2"/><path transform="translate(440,50)" d="M0,0 Q20,30 0,60" fill="none" stroke="#000" stroke-width="2"/>
<line x1="518" y1="80" x2="548" y2="80" stroke="#000" stroke-width="2"/>
<text x="385" y="64" >A</text>
<text x="385" y="104" >B</text>
<text x="554" y="84" >Y</text>
<text x="400" y="140" font-size="12" fill="#444">A B | Y</text><text x="400" y="156" font-size="12" fill="#444">0 0 | 0</text><text x="400" y="172" font-size="12" fill="#444">0 1 | 1</text><text x="400" y="188" font-size="12" fill="#444">1 0 | 1</text><text x="400" y="204" font-size="12" fill="#444">1 1 | 0</text>
<text x="645" y="30" font-weight="bold">NOT</text>
<line x1="605" y1="80" x2="645" y2="80" stroke="#000" stroke-width="2"/>
<path transform="translate(645,55)" d="M0,0 L50,25.0 L0,50 Z" fill="none" stroke="#000" stroke-width="2"/><circle cx="701" cy="80.0" r="6" fill="#fff" stroke="#000" stroke-width="2"/>
<line x1="707" y1="80" x2="745" y2="80" stroke="#000" stroke-width="2"/>
<text x="590" y="84" >A</text>
<text x="749" y="84" >Y</text>
<text x="590" y="140" font-size="12" fill="#444">A | Y</text><text x="590" y="156" font-size="12" fill="#444">0 | 1</text><text x="590" y="172" font-size="12" fill="#444">1 | 0</text>
<text x="20" y="250" font-weight="bold">기호 구분</text>
<text x="20" y="275" font-size="13">AND: 한쪽은 평평하고 반대쪽은 둥근 D 모양</text>
<text x="20" y="295" font-size="13">OR: 입력쪽이 안으로 휘어 들어간 방패 모양</text>
<text x="20" y="315" font-size="13">XOR: OR 모양 앞에 곡선이 하나 더 붙음</text>
<text x="20" y="335" font-size="13">NOT: 삼각형 끝에 작은 동그라미(버블). 버블 = 반전</text>
<text x="20" y="370" font-size="13" fill="#555">입력은 왼쪽, 출력은 오른쪽. 게이트끼리 선으로 이으면 논리회로.</text>
</svg>