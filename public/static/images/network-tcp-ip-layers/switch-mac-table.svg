<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Pretendard, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#16a34a"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#dc2626"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#475569"/></marker>
</defs>
<rect width="900" height="430" fill="#ffffff" rx="8"/>
<text x="20" y="32" font-size="16" font-weight="bold" fill="#1e293b">Switch: learn by source MAC, forward by destination MAC</text>
<rect x="210" y="160" width="180" height="80" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="300" y="205" text-anchor="middle" font-weight="bold" font-size="15">Switch</text><line x1="125" y1="110" x2="240" y2="160" stroke="#94a3b8" stroke-width="2"/><rect x="35" y="90" width="90" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="80" y="115" text-anchor="middle" font-weight="bold">PC A</text><text x="182.5" y="127" text-anchor="middle" font-size="11" fill="#64748b">port 1</text><line x1="125" y1="300" x2="240" y2="240" stroke="#94a3b8" stroke-width="2"/><rect x="35" y="280" width="90" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="80" y="305" text-anchor="middle" font-weight="bold">PC B</text><text x="182.5" y="262" text-anchor="middle" font-size="11" fill="#64748b">port 2</text><line x1="565" y1="200" x2="390" y2="200" stroke="#94a3b8" stroke-width="2"/><rect x="475" y="180" width="90" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="520" y="205" text-anchor="middle" font-weight="bold">Server</text><text x="477.5" y="192" text-anchor="middle" font-size="11" fill="#64748b">port 3</text><text x="640" y="80" font-weight="bold" fill="#1e293b">MAC address table</text>
<rect x="640" y="90" width="230" height="30" fill="#f1f5f9" stroke="#cbd5e1"/><text x="652" y="110" font-weight="bold">MAC</text><text x="800" y="110" font-weight="bold">port</text>
<rect x="640" y="120" width="230" height="30" fill="#fff" stroke="#cbd5e1"/><text x="652" y="140">PC B's MAC</text><text x="800" y="140">2</text>
<rect x="640" y="150" width="230" height="30" fill="#fff" stroke="#cbd5e1"/><text x="652" y="170">Server's MAC</text><text x="800" y="170">3</text>
<g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.200"/><rect x="640" y="180" width="230" height="30" fill="#fef9c3" stroke="#eab308"/><text x="652" y="200" font-weight="bold" fill="#854d0e">PC A's MAC (new)</text><text x="800" y="200" font-weight="bold" fill="#854d0e">1</text></g>
<g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;0;1;0;0;0" keyTimes="0.000;0.200;0.400;0.600;0.800;1"/><rect x="637" y="148" width="236" height="34" fill="none" stroke="#dc2626" stroke-width="3"/></g><g><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="1;0;0;0;0;1" keyTimes="0.000;0.200;0.400;0.600;0.800;1"/><line x1="125" y1="118" x2="236" y2="156" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/><rect x="110" y="60" width="150" height="24" rx="4" fill="#fef2f2" stroke="#475569"/><text x="185" y="76" text-anchor="middle" font-size="11" fill="#1e293b">dst MAC: Server</text></g><g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0;0;0" keyTimes="0.000;0.200;0.400;0.600;0.800;1"/><text x="640" y="240" font-size="12" fill="#854d0e">came in on port 1 from PC A → write it down</text></g><g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;0;1;0;0;0" keyTimes="0.000;0.200;0.400;0.600;0.800;1"/><text x="640" y="240" font-size="12" fill="#b91c1c">look up dst MAC → Server is on port 3</text></g><g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;0;0;1;0;0" keyTimes="0.000;0.200;0.400;0.600;0.800;1"/><line x1="392" y1="200" x2="472" y2="200" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/><text x="150" y="310" font-size="12" fill="#64748b">port 2: nothing sent</text><line x1="238" y1="244" x2="128" y2="292" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="4 4"/></g><g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;0;0;0;1;0" keyTimes="0.000;0.200;0.400;0.600;0.800;1"/><rect x="110" y="60" width="150" height="24" rx="4" fill="#fef2f2" stroke="#475569"/><text x="185" y="76" text-anchor="middle" font-size="11" fill="#1e293b">dst MAC: FF:FF:FF:FF:FF:FF</text><line x1="125" y1="118" x2="236" y2="156" stroke="#475569" stroke-width="3" marker-end="url(#ak)"/><line x1="238" y1="244" x2="128" y2="292" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/><line x1="392" y1="200" x2="472" y2="200" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/></g><g opacity="1"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="1;0;0;0;0;1" keyTimes="0.000;0.200;0.400;0.600;0.800;1"/><text x="450" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">① PC A sends a frame whose destination MAC is the server</text></g><g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0;0;0" keyTimes="0.000;0.200;0.400;0.600;0.800;1"/><text x="450" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">② Switch learns: PC A's MAC is on port 1 (from the source MAC)</text></g><g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;0;1;0;0;0" keyTimes="0.000;0.200;0.400;0.600;0.800;1"/><text x="450" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">③ Switch looks up the destination MAC in the table → port 3</text></g><g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;0;0;1;0;0" keyTimes="0.000;0.200;0.400;0.600;0.800;1"/><text x="450" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">④ Frame goes out port 3 only. PC B never sees it (unicast)</text></g><g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;0;0;0;1;0" keyTimes="0.000;0.200;0.400;0.600;0.800;1"/><text x="450" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">⑤ Broadcast (FF:FF…) or unknown destination → every port except the one it came in on</text></g></svg>
