    <text x="277" y="401">8.1 Use-Case Diagram</text>
    <text x="277" y="421">8.2 Use-Case Description</text>

    <rect x="265" y="450" width="230" height="100" rx="6" fill="#fdf6ec" stroke="#c07a20" stroke-width="1.5"/>
    <rect x="265" y="450" width="230" height="26" rx="6" fill="#fbe9cf" stroke="#c07a20" stroke-width="1.5"/>
    <text x="380" y="468" text-anchor="middle" font-weight="bold" font-size="13">9. Structural Modeling</text>
    <text x="277" y="494">9.1 Class Diagram</text>
    <text x="277" y="512">9.2 CRC Cards, Class Spec</text>
    <text x="277" y="530">9.3 DB Schema  9.4 Data Structure</text>
  </g>

  <!-- column 3 -->
  <g>
    <rect x="510" y="70" width="230" height="100" rx="6" fill="#fdf6ec" stroke="#c07a20" stroke-width="1.5"/>
    <rect x="510" y="70" width="230" height="26" rx="6" fill="#fbe9cf" stroke="#c07a20" stroke-width="1.5"/>
    <text x="625" y="88" text-anchor="middle" font-weight="bold" font-size="13">10. Behavioral Modeling</text>
    <text x="522" y="116">10.1 Sequence Diagram</text>
    <text x="522" y="136">10.2 Activity Diagram</text>
    <text x="522" y="156">10.3 Method Algorithm Spec</text>

    <rect x="510" y="185" width="230" height="160" rx="6" fill="#f3f7fb" stroke="#2b5d8a" stroke-width="1.5"/>
    <rect x="510" y="185" width="230" height="26" rx="6" fill="#e6f0fa" stroke="#2b5d8a" stroke-width="1.5"/>
    <text x="625" y="203" text-anchor="middle" font-weight="bold" font-size="13">11. Technical Management</text>
    <text x="522" y="231">11.1 Standard Methodology</text>
    <text x="522" y="251">11.2 Change Management</text>
    <text x="522" y="271">11.3 Risk Management</text>
    <text x="522" y="291">11.4 Progress Management</text>
    <text x="522" y="311">11.5 Reporting Schedule</text>
    <text x="522" y="331">11.6 Problem Resolution</text>

    <rect x="510" y="360" width="230" height="36" rx="6" fill="#e6f0fa" stroke="#2b5d8a" stroke-width="1.5"/>
    <text x="625" y="383" text-anchor="middle" font-weight="bold" font-size="13">12. Maintenance Plan</text>
    <rect x="510" y="406" width="230" height="36" rx="6" fill="#e6f0fa" stroke="#2b5d8a" stroke-width="1.5"/>
    <text x="625" y="429" text-anchor="middle" font-weight="bold" font-size="13">13. Installation, Acceptance Plan</text>
    <rect x="510" y="452" width="230" height="36" rx="6" fill="#e6f0fa" stroke="#2b5d8a" stroke-width="1.5"/>
    <text x="625" y="475" text-anchor="middle" font-weight="bold" font-size="13">14. Other Risks, Constraints</text>
    <rect x="510" y="498" width="230" height="36" rx="6" fill="#fff" stroke="#2b5d8a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="625" y="521" text-anchor="middle" font-size="13">Appendix, References</text>
  </g>
</svg>
