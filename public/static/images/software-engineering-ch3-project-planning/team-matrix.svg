  <g stroke="#c07a1e" stroke-width="1.2"><line x1="110" y1="112" x2="520" y2="112"/><line x1="110" y1="162" x2="520" y2="162"/><line x1="110" y1="212" x2="520" y2="212"/><line x1="110" y1="262" x2="520" y2="262"/></g>
