<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>

  <!-- Relation name -->
  <text x="190" y="74" font-weight="bold" font-size="16">STUDENT</text>

  <!-- Header row -->
  <rect x="190" y="84" width="130" height="34" fill="#dfe8f5" stroke="#333"/>
  <rect x="320" y="84" width="130" height="34" fill="#dfe8f5" stroke="#333"/>
  <rect x="450" y="84" width="130" height="34" fill="#dfe8f5" stroke="#333"/>
  <text x="255" y="106" text-anchor="middle" font-weight="bold">StudentID</text>
  <text x="385" y="106" text-anchor="middle" font-weight="bold">Name</text>
  <text x="515" y="106" text-anchor="middle" font-weight="bold">Dept</text>

  <!-- Data rows -->
  <g stroke="#333" fill="#ffffff">
    <rect x="190" y="118" width="130" height="34"/><rect x="320" y="118" width="130" height="34"/><rect x="450" y="118" width="130" height="34"/>
    <rect x="190" y="152" width="130" height="34"/><rect x="320" y="152" width="130" height="34"/><rect x="450" y="152" width="130" height="34"/>
    <rect x="190" y="186" width="130" height="34"/><rect x="320" y="186" width="130" height="34"/><rect x="450" y="186" width="130" height="34"/>
  </g>
  <!-- highlighted tuple -->
  <rect x="190" y="152" width="390" height="34" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="255" y="140">2021001</text><text x="385" y="140">Kim</text><text x="515" y="140">CS</text>
    <text x="255" y="174">2021002</text><text x="385" y="174">Lee</text><text x="515" y="174">SW</text>
    <text x="255" y="208">2021003</text><text x="385" y="208">Park</text><text x="515" y="208">CS</text>
  </g>

  <!-- highlighted attribute column -->
  <rect x="320" y="84" width="130" height="136" fill="none" stroke="#2e86c1" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- Relation schema label -->
  <text x="190" y="40" font-size="13" fill="#c0392b">Relation schema: STUDENT(StudentID, Name, Dept)</text>
  <line x1="300" y1="46" x2="300" y2="82" stroke="#c0392b" marker-end="url(#arrow)"/>

  <!-- Attribute label -->
  <text x="610" y="70" font-size="13" fill="#2e86c1">Attribute (column)</text>
  <line x1="606" y1="66" x2="455" y2="90" stroke="#2e86c1" marker-end="url(#arrow)"/>

  <!-- Tuple label -->
  <text x="30" y="174" font-size="13" fill="#c0392b">Tuple (row)</text>
  <line x1="112" y1="170" x2="186" y2="170" stroke="#c0392b" marker-end="url(#arrow)"/>

  <!-- Relation state -->
  <path d="M590,118 L600,118 L600,220 L590,220" fill="none" stroke="#555"/>
  <text x="610" y="172" font-size="13" fill="#555">Relation state</text>
  <text x="610" y="190" font-size="12" fill="#555">(all tuples now)</text>

  <!-- Domain -->
  <text x="190" y="262" font-size="13" fill="#27ae60">Domain: set of allowed values of an attribute</text>
  <text x="190" y="282" font-size="12" fill="#27ae60">dom(StudentID) = 7-digit integer</text>
  <text x="190" y="300" font-size="12" fill="#27ae60">dom(Dept) = {CS, SW, EE, ...}</text>
  <line x1="300" y1="246" x2="300" y2="226" stroke="#27ae60" marker-end="url(#arrow)"/>

  <!-- Degree / cardinality -->
  <text x="190" y="340" font-size="12" fill="#555">Degree = 3 (number of attributes), Cardinality = 3 (number of tuples)</text>

  <!-- footer -->
  <text x="190" y="378" font-size="12" fill="#888">Representational (relational) data model, example STUDENT relation</text>
</svg>
