<circle cx="150" cy="170" r="6" fill="#3b82f6"/><text x="150" y="196" text-anchor="middle">09-22 ~ 10-11</text><text x="150" y="214" text-anchor="middle" font-size="11">HW1 requirements</text><text x="150" y="230" text-anchor="middle" font-size="11">use case, schema, wireframes</text>
