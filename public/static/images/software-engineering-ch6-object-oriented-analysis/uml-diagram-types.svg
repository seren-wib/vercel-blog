<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <style>
    .box { fill: #fff; stroke: #333; stroke-width: 1.5; rx: 6; }
    .root { fill: #e8eef8; }
    .struct { fill: #e6f4ea; }
    .behav { fill: #fdf1e0; }
    .inter { fill: #fbe9e7; }
    .hl { stroke: #c62828; stroke-width: 2.5; }
    .t { text-anchor: middle; fill: #222; }
    .h { font-weight: bold; font-size: 15px; }
    .s { font-size: 12px; fill: #555; }
    .sm { font-size: 12px; }
    line { stroke: #555; stroke-width: 1.5; }
  </style>

  <rect class="box root" x="390" y="20" width="220" height="44"/>
  <text class="t h" x="500" y="47">UML 2.5 Diagrams (14)</text>

  <line x1="500" y1="64" x2="500" y2="84"/>
  <line x1="275" y1="84" x2="795" y2="84"/>
  <line x1="275" y1="84" x2="275" y2="104"/>
  <line x1="795" y1="84" x2="795" y2="104"/>

  <rect class="box struct" x="165" y="104" width="220" height="56"/>
  <text class="t h" x="275" y="127">Structure Diagrams (7)</text>
  <text class="t s" x="275" y="147">static structure, no time flow</text>

  <rect class="box behav" x="685" y="104" width="220" height="56"/>
  <text class="t h" x="795" y="127">Behavior Diagrams (4)</text>
  <text class="t s" x="795" y="147">dynamic, changes over time</text>

  <!-- structure children: centers 50,125,200,275,350,425,500 -->
  <line x1="275" y1="160" x2="275" y2="180"/>
  <line x1="50" y1="180" x2="500" y2="180"/>
  <line x1="50" y1="180" x2="50" y2="200"/>
  <line x1="125" y1="180" x2="125" y2="200"/>
  <line x1="200" y1="180" x2="200" y2="200"/>
  <line x1="275" y1="180" x2="275" y2="200"/>
  <line x1="350" y1="180" x2="350" y2="200"/>
  <line x1="425" y1="180" x2="425" y2="200"/>
  <line x1="500" y1="180" x2="500" y2="200"/>

  <rect class="box struct hl" x="15" y="200" width="70" height="40"/>
  <text class="t" x="50" y="225">Class</text>
  <rect class="box struct" x="90" y="200" width="70" height="40"/>
  <text class="t" x="125" y="225">Object</text>
  <rect class="box struct" x="165" y="200" width="70" height="40"/>
  <text class="t" x="200" y="225">Package</text>
  <rect class="box struct" x="240" y="200" width="70" height="40"/>
  <text class="t sm" x="275" y="217">Composite</text>
  <text class="t sm" x="275" y="232">Structure</text>
  <rect class="box struct" x="315" y="200" width="70" height="40"/>
  <text class="t sm" x="350" y="225">Component</text>
  <rect class="box struct" x="390" y="200" width="70" height="40"/>
  <text class="t sm" x="425" y="225">Deployment</text>
  <rect class="box struct" x="465" y="200" width="70" height="40"/>
  <text class="t" x="500" y="225">Profile</text>

  <!-- behavior children: centers 660, 745, 830, 925 -->
  <line x1="795" y1="160" x2="795" y2="180"/>
  <line x1="660" y1="180" x2="925" y2="180"/>
  <line x1="660" y1="180" x2="660" y2="200"/>
  <line x1="745" y1="180" x2="745" y2="200"/>
  <line x1="830" y1="180" x2="830" y2="200"/>
  <line x1="925" y1="180" x2="925" y2="200"/>

  <rect class="box behav hl" x="620" y="200" width="80" height="40"/>
  <text class="t" x="660" y="225">Use Case</text>
  <rect class="box behav" x="710" y="200" width="70" height="40"/>
  <text class="t" x="745" y="225">Activity</text>
  <rect class="box behav" x="790" y="200" width="80" height="40"/>
  <text class="t sm" x="830" y="217">State</text>
  <text class="t sm" x="830" y="232">Machine</text>
  <rect class="box inter" x="880" y="200" width="90" height="40"/>
  <text class="t" x="925" y="225">Interaction</text>

  <!-- interaction children: centers 660, 760, 855, 935 -->
  <line x1="925" y1="240" x2="925" y2="262"/>
  <line x1="660" y1="262" x2="925" y2="262"/>
  <line x1="660" y1="262" x2="660" y2="282"/>
  <line x1="760" y1="262" x2="760" y2="282"/>
  <line x1="850" y1="262" x2="850" y2="282"/>
  <line x1="925" y1="262" x2="925" y2="282"/>

  <rect class="box inter hl" x="620" y="282" width="80" height="40"/>
  <text class="t" x="660" y="307">Sequence</text>
  <rect class="box inter" x="708" y="282" width="104" height="40"/>
  <text class="t sm" x="760" y="307">Communication</text>
  <rect class="box inter" x="820" y="282" width="60" height="40"/>
  <text class="t" x="850" y="307">Timing</text>
  <rect class="box inter" x="885" y="282" width="100" height="40"/>
  <text class="t sm" x="935" y="299">Interaction</text>
  <text class="t sm" x="935" y="314">Overview</text>

  <rect class="box hl" x="20" y="345" width="26" height="18" fill="#fff"/>
  <text x="54" y="359" fill="#222">= used in this chapter (6.3 Use Case, 6.4 Class, 6.5 Sequence)</text>
  <text x="20" y="385" fill="#555" font-size="12">Interaction is a group name, not counted: 7 + 3 + 4 = 14</text>
</svg>
