<svg xmlns="http://www.w3.org/2000/svg" width="980" height="370" viewBox="0 0 980 370" font-family='Pretendard, "Apple SD Gothic Neo", -apple-system, Helvetica, Arial, sans-serif' font-size="13">
<rect width="980" height="370" fill="#ffffff" rx="8"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#475569"/></marker></defs>
<text x="20" y="32" font-size="17" font-weight="bold" fill="#1e293b">docs-sync: Markdown on main overwrites the same Google Docs</text>
<text x="20" y="52" font-size="12" fill="#64748b">Fixed Doc IDs in .github/google-docs.json keep every shared link stable. No repository secret.</text>
<rect x="20" y="90" width="180" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="110" y="122" text-anchor="middle" font-weight="bold" fill="#1e293b">docs/specs/*.md</text><text x="110" y="140" text-anchor="middle" font-size="12" fill="#334155">merged to main</text><text x="110" y="157" text-anchor="middle" font-size="11" fill="#64748b">editing room</text>
<rect x="230" y="78" width="470" height="210" rx="10" fill="#f5f3ff" stroke="#a78bfa"/>
<text x="250" y="100" font-weight="bold" fill="#3b0764">GitHub Actions job docs-sync</text>
<rect x="250" y="114" width="210" height="40" rx="8" fill="#ffffff" stroke="#94a3b8"/><text x="355" y="139" text-anchor="middle" font-weight="bold" fill="#1e293b">Mermaid → PNG</text>
<rect x="475" y="114" width="205" height="40" rx="8" fill="#ffffff" stroke="#94a3b8"/><text x="577.5" y="139" text-anchor="middle" font-weight="bold" fill="#1e293b">SVG → PNG</text>
<rect x="250" y="168" width="430" height="48" rx="8" fill="#ffffff" stroke="#94a3b8"/><text x="465" y="188" text-anchor="middle" font-weight="bold" fill="#1e293b">build-docs.mjs</text><text x="465" y="206" text-anchor="middle" font-size="12" fill="#334155">6 HTML files in README order, commit SHA, inline images</text>
<rect x="250" y="230" width="430" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/><text x="465" y="257" text-anchor="middle" font-weight="bold" fill="#1e293b">PATCH /upload/drive/v3/files/&lt;doc id&gt;</text>
<rect x="730" y="78" width="230" height="110" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="845" y="111" text-anchor="middle" font-weight="bold" fill="#7c2d12">Google auth</text><text x="845" y="129" text-anchor="middle" font-size="12" fill="#9a3412">GitHub OIDC token</text><text x="845" y="147" text-anchor="middle" font-size="12" fill="#9a3412">→ Workload Identity Federation</text><text x="845" y="165" text-anchor="middle" font-size="12" fill="#9a3412">→ service account docs-sync</text>
<rect x="730" y="208" width="230" height="80" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/><text x="845" y="235" text-anchor="middle" font-weight="bold" fill="#064e3b">6 Google Docs</text><text x="845" y="253" text-anchor="middle" font-size="12" fill="#065f46">SPMP SRS SDD STP SIP SMP</text><text x="845" y="270" text-anchor="middle" font-size="11" fill="#64748b">channel readers see</text>
<path d="M200 135H246" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M700 140H726" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M680 252H726" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="20" y="325" font-size="12" fill="#334155">Trigger: push to main touching docs/specs/**, docs/images/** or .github/google-docs.json, or a manual run.</text>
<text x="20" y="347" font-size="12" fill="#334155">concurrency: docs-sync with cancel-in-progress, so a newer merge cancels the older run.</text>
</svg>
