<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family='Pretendard, "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif' font-size="13">
<rect width="980" height="470" fill="#ffffff" rx="8"/>
<defs>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#7c5cff"/></marker>
</defs>
<text x="20" y="32" font-size="17" font-weight="bold" fill="#1e293b">Orchestrator and workers, joined only by files</text>
<text x="20" y="52" font-size="12" fill="#64748b">Each worker writes only its own result file, so one failed search drops one candidate, not the run.</text>
<rect x="20" y="80" width="170" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="105" y="110" text-anchor="middle" font-weight="bold" fill="#1e293b">input</text>
<text x="105" y="132" text-anchor="middle" font-size="12" fill="#334155">GPS (A) + destination (B)</text>
<text x="105" y="150" text-anchor="middle" font-size="12" fill="#334155">departure = now</text>
<rect x="240" y="70" width="230" height="100" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
<text x="355" y="96" text-anchor="middle" font-weight="bold" fill="#3b0764">orchestrator</text>
<text x="355" y="114" text-anchor="middle" font-size="11" fill="#7c3aed">foreman</text>
<text x="355" y="136" text-anchor="middle" font-size="12" fill="#334155">R1 baseline route from map apps</text>
<text x="355" y="156" text-anchor="middle" font-size="12" fill="#334155">R2 every stop s1…sN of first bus X</text>
<rect x="520" y="85" width="190" height="70" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
<text x="615" y="112" text-anchor="middle" font-weight="bold" fill="#78350f">tasks/bot{n}.json</text>
<text x="615" y="134" text-anchor="middle" font-size="12" fill="#92400e">si, stop_id, arrive_at_si</text>
<rect x="400" y="220" width="560" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
<text x="420" y="246" font-weight="bold" fill="#1e293b">search workers W1…W8 (concurrent)</text>
<text x="940" y="246" text-anchor="end" font-size="11" fill="#64748b">crew</text>
<text x="420" y="272" font-size="12" fill="#334155">R3 candidates: si + every platform within 500 m walk</text>
<text x="420" y="292" font-size="12" fill="#334155">R4 platform → B, bus only, no second transfer, drop lines not running now</text>
<text x="420" y="312" font-size="12" fill="#334155">R5 real-time arrival at the moment the user reaches that platform</text>
<rect x="20" y="230" width="190" height="70" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
<text x="115" y="257" text-anchor="middle" font-weight="bold" fill="#78350f">results/{si}.json</text>
<text x="115" y="279" text-anchor="middle" font-size="12" fill="#92400e">one file per stop, own stop only</text>
<rect x="240" y="370" width="470" height="80" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
<text x="475" y="396" text-anchor="middle" font-weight="bold" fill="#3b0764">orchestrator: R6 total, R7 pick</text>
<text x="475" y="418" text-anchor="middle" font-size="12" fill="#334155">A→si + walk (m ÷ 83.3 m/min) + real wait + ride + final walk</text>
<text x="475" y="438" text-anchor="middle" font-size="12" fill="#334155">minimum, but never slower than the best of Naver / Kakao / Google</text>
<line x1="192" y1="120" x2="236" y2="120" stroke="#7c5cff" stroke-width="2" marker-end="url(#ap)"/>
<line x1="472" y1="120" x2="516" y2="120" stroke="#7c5cff" stroke-width="2" marker-end="url(#ap)"/>
<line x1="680" y1="157" x2="680" y2="216" stroke="#7c5cff" stroke-width="2" marker-end="url(#ap)"/>
<line x1="398" y1="265" x2="214" y2="265" stroke="#7c5cff" stroke-width="2" marker-end="url(#ap)"/>
<path d="M115 302 L115 410 L236 410" fill="none" stroke="#7c5cff" stroke-width="2" marker-end="url(#ap)"/>
</svg>
