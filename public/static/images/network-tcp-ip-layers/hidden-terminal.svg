<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="-20 0 800 560" font-family="Pretendard, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L10 5L0 9z" fill="#ef4444"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L10 5L0 9z" fill="#3b82f6"/></marker></defs>
<rect x="-20" width="800" height="560" fill="#ffffff" rx="8"/>
<text x="20" y="32" font-size="16" font-weight="bold" fill="#1e293b">Hidden terminal problem</text>
<g>
<circle cx="190" cy="270" r="210" fill="#fee2e2" fill-opacity="0.35" stroke="#ef4444" stroke-dasharray="6 5"/>
<circle cx="570" cy="270" r="210" fill="#dbeafe" fill-opacity="0.35" stroke="#3b82f6" stroke-dasharray="6 5"/>
</g>
<text x="110" y="84" font-size="11" fill="#b91c1c">A&#39;s signal range</text>
<text x="650" y="84" text-anchor="end" font-size="11" fill="#1d4ed8">B&#39;s signal range</text>
<circle cx="190" cy="270" r="30" fill="#ffffff" stroke="#ef4444" stroke-width="2"/><text x="190" y="275" text-anchor="middle" font-weight="bold" font-size="15">A</text>
<circle cx="380" cy="270" r="34" fill="#ffffff" stroke="#22c55e" stroke-width="2"/><text x="380" y="275" text-anchor="middle" font-weight="bold" font-size="15">AP</text>
<circle cx="570" cy="270" r="30" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/><text x="570" y="275" text-anchor="middle" font-weight="bold" font-size="15">B</text>
<text x="380" y="505" text-anchor="middle" font-size="12" fill="#64748b">A ↔ AP ok · B ↔ AP ok · A ↔ B cannot hear each other</text>
<g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.0000"/><line x1="222" y1="262" x2="342" y2="262" stroke="#ef4444" stroke-width="3" marker-end="url(#ar)"/><text x="282" y="252" text-anchor="middle" font-size="11" fill="#b91c1c">A → AP</text></g>
<g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.2500"/><text x="570" y="220" text-anchor="middle" font-size="12" fill="#1d4ed8">"channel is free"</text><text x="570" y="320" text-anchor="middle" font-size="11" fill="#64748b">A&#39;s signal does not reach here</text></g>
<g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.5000"/><line x1="538" y1="278" x2="418" y2="278" stroke="#3b82f6" stroke-width="3" marker-end="url(#ab)"/><text x="478" y="298" text-anchor="middle" font-size="11" fill="#1d4ed8">B → AP</text></g>
<g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.7500"/><line x1="350" y1="240" x2="410" y2="300" stroke="#b91c1c" stroke-width="5"/><line x1="410" y1="240" x2="350" y2="300" stroke="#b91c1c" stroke-width="5"/><text x="380" y="226" text-anchor="middle" font-weight="bold" fill="#b91c1c">collision</text></g>
<g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1"/><text x="380" y="538" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">1. A sends a frame to the AP</text></g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1"/><text x="380" y="538" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">2. B cannot hear A, so B thinks the channel is free</text></g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1"/><text x="380" y="538" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">3. B also sends to the AP</text></g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1"/><text x="380" y="538" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">4. Both signals overlap at the AP → collision (AP reads neither)</text></g>
</svg>
