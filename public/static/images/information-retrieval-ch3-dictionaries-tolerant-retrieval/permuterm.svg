<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect width="760" height="400" fill="#ffffff"/>
<text x="20" y="28" text-anchor="start" font-size="16" font-weight="bold" fill="#222">Permuterm index: store every rotation of hello$, each one points to hello</text><rect x="30" y="118" width="80" height="30" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.4"/><text x="70" y="137.9" text-anchor="middle" font-size="14" font-family="Consolas, Menlo, monospace" fill="#222">hello</text><line x1="110" y1="133" x2="146" y2="133" stroke="#888" stroke-width="1.4" marker-end="url(#ah)"/><text x="128" y="112" text-anchor="middle" font-size="12" fill="#555">add $</text><rect x="150" y="118" width="90" height="30" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.4"/><text x="195" y="137.9" text-anchor="middle" font-size="14" font-family="Consolas, Menlo, monospace" fill="#222">hello$</text><line x1="240" y1="133" x2="276" y2="133" stroke="#888" stroke-width="1.4" marker-end="url(#ah)"/><text x="340" y="52" text-anchor="middle" font-size="12" fill="#555">6 rotations (B-tree keys)</text><rect x="280" y="60" width="120" height="22" rx="4" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.4"/><text x="340" y="75.55" text-anchor="middle" font-size="13" font-family="Consolas, Menlo, monospace" fill="#222">hello$</text><line x1="400" y1="71" x2="556" y2="148" stroke="#bbb" stroke-width="1.1" marker-end="url(#ah)"/><rect x="280" y="88" width="120" height="22" rx="4" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.4"/><text x="340" y="103.55" text-anchor="middle" font-size="13" font-family="Consolas, Menlo, monospace" fill="#222">ello$h</text><line x1="400" y1="99" x2="556" y2="148" stroke="#bbb" stroke-width="1.1" marker-end="url(#ah)"/><rect x="280" y="116" width="120" height="22" rx="4" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.4"/><text x="340" y="131.55" text-anchor="middle" font-size="13" font-family="Consolas, Menlo, monospace" fill="#222">llo$he</text><line x1="400" y1="127" x2="556" y2="148" stroke="#bbb" stroke-width="1.1" marker-end="url(#ah)"/><rect x="280" y="144" width="120" height="22" rx="4" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.4"/><text x="340" y="159.55" text-anchor="middle" font-size="13" font-family="Consolas, Menlo, monospace" fill="#222">lo$hel</text><line x1="400" y1="155" x2="556" y2="148" stroke="#bbb" stroke-width="1.1" marker-end="url(#ah)"/><rect x="280" y="172" width="120" height="22" rx="4" fill="#fff3e0" stroke="#e08a1e" stroke-width="1.4"/><text x="340" y="187.55" text-anchor="middle" font-size="13" font-family="Consolas, Menlo, monospace" fill="#222">o$hell</text><line x1="400" y1="183" x2="556" y2="148" stroke="#bbb" stroke-width="1.1" marker-end="url(#ah)"/><rect x="280" y="200" width="120" height="22" rx="4" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.4"/><text x="340" y="215.55" text-anchor="middle" font-size="13" font-family="Consolas, Menlo, monospace" fill="#222">$hello</text><line x1="400" y1="211" x2="556" y2="148" stroke="#bbb" stroke-width="1.1" marker-end="url(#ah)"/><rect x="560" y="133" width="100" height="30" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/><text x="610" y="152.9" text-anchor="middle" font-size="14" font-family="Consolas, Menlo, monospace" fill="#222">hello</text><text x="610" y="183" text-anchor="middle" font-size="12" fill="#555">term in dictionary</text><line x1="20" y1="245" x2="740" y2="245" stroke="#ddd" stroke-width="1"/><text x="20" y="275" text-anchor="start" font-size="15" font-weight="bold" fill="#222">Lookup hel*o: rotate the query until * is at the end, then prefix search</text><rect x="20" y="295" width="118" height="34" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.4"/><text x="79" y="316.9" text-anchor="middle" font-size="14" font-family="Consolas, Menlo, monospace" fill="#222">hel*o</text><text x="79" y="350" text-anchor="middle" font-size="12" fill="#555">query</text><line x1="138" y1="312" x2="164" y2="312" stroke="#888" stroke-width="1.4" marker-end="url(#ah)"/><rect x="168" y="295" width="118" height="34" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.4"/><text x="227" y="316.9" text-anchor="middle" font-size="14" font-family="Consolas, Menlo, monospace" fill="#222">hel*o$</text><text x="227" y="350" text-anchor="middle" font-size="12" fill="#555">add $</text><line x1="286" y1="312" x2="312" y2="312" stroke="#888" stroke-width="1.4" marker-end="url(#ah)"/><rect x="316" y="295" width="118" height="34" rx="4" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.4"/><text x="375" y="316.9" text-anchor="middle" font-size="14" font-family="Consolas, Menlo, monospace" fill="#222">o$hel*</text><text x="375" y="350" text-anchor="middle" font-size="12" fill="#555">* at the end</text><line x1="434" y1="312" x2="460" y2="312" stroke="#888" stroke-width="1.4" marker-end="url(#ah)"/><rect x="464" y="295" width="118" height="34" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.4"/><text x="523" y="316.9" text-anchor="middle" font-size="14" font-family="Consolas, Menlo, monospace" fill="#222">o$hel...</text><text x="523" y="350" text-anchor="middle" font-size="12" fill="#555">B-tree prefix</text><line x1="582" y1="312" x2="608" y2="312" stroke="#888" stroke-width="1.4" marker-end="url(#ah)"/><rect x="612" y="295" width="118" height="34" rx="4" fill="#fff3e0" stroke="#e08a1e" stroke-width="1.4"/><text x="671" y="316.9" text-anchor="middle" font-size="14" font-family="Consolas, Menlo, monospace" fill="#222">o$hell</text><text x="671" y="350" text-anchor="middle" font-size="12" fill="#555">match</text><text x="679" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">→ hello</text>
</svg>
