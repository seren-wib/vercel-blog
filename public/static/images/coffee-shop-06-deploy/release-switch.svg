<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family='Pretendard, "Apple SD Gothic Neo", -apple-system, Helvetica, Arial, sans-serif' font-size="13">
<rect width="980" height="430" fill="#ffffff" rx="8"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#475569"/></marker></defs>
<text x="20" y="32" font-size="17" font-weight="bold" fill="#1e293b">deploy.sh: build beside the live release, then switch one link</text>
<text x="20" y="52" font-size="12" fill="#64748b">/srv/coffee-shop on the EC2 instance. DB and .env live outside the release folders.</text>
<rect x="20" y="75" width="360" height="330" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
<text x="40" y="100" font-weight="bold" fill="#1e293b">/srv/coffee-shop/</text>
<rect x="40" y="115" width="140" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="110" y="133" text-anchor="middle" font-weight="bold" fill="#1e3a8a">current</text><text x="110" y="150" text-anchor="middle" font-size="11" fill="#64748b">door plate</text>
<rect x="210" y="115" width="150" height="40" rx="8" fill="#ffffff" stroke="#94a3b8"/><text x="285" y="140" text-anchor="middle" font-weight="bold" fill="#1e293b">releases/&lt;old&gt;</text>
<rect x="210" y="170" width="150" height="40" rx="8" fill="#fffbeb" stroke="#fcd34d"/><text x="285" y="186" text-anchor="middle" font-weight="bold" fill="#78350f">releases/&lt;new&gt;</text><text x="285" y="203" text-anchor="middle" font-size="11" fill="#64748b">new house</text>
<path d="M180 137H206" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="40" y="250" width="150" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="115" y="280" text-anchor="middle" font-weight="bold" fill="#1e293b">data/db.sqlite3</text>
<rect x="210" y="250" width="150" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="285" y="280" text-anchor="middle" font-weight="bold" fill="#1e293b">.env (600)</text>
<text x="200" y="330" text-anchor="middle" font-size="11" fill="#64748b">kept across releases; last 3 releases kept</text>
<rect x="420" y="75" width="540" height="330" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
<text x="440" y="100" font-weight="bold" fill="#78350f">deploy.sh release-YYYYMMDD-N</text>
<text x="440" y="128" font-size="12" fill="#334155">1  tag format, .env present</text>
<text x="440" y="150" font-size="12" fill="#334155">2  clone tag into releases/&lt;new&gt;, must be on main</text>
<text x="440" y="172" font-size="12" fill="#334155">3  venv + pip, npm ci + build, version.txt</text>
<text x="440" y="194" font-size="12" fill="#334155">4  pre-deploy DB backup, migrate</text>
<text x="440" y="216" font-size="12" fill="#334155">5  current.new → mv -T over current</text>
<text x="440" y="238" font-size="12" fill="#334155">6  /api/health/ 200 and version.txt = commit?</text>
<rect x="440" y="262" width="230" height="60" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/><text x="555" y="288" text-anchor="middle" font-weight="bold" fill="#064e3b">yes: done</text><text x="555" y="306" text-anchor="middle" font-size="12" fill="#065f46">prune to 3 releases</text>
<rect x="700" y="262" width="240" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5"/><text x="820" y="288" text-anchor="middle" font-weight="bold" fill="#7f1d1d">no: roll back</text><text x="820" y="306" text-anchor="middle" font-size="12" fill="#b91c1c">current → releases/&lt;old&gt;</text>
<text x="440" y="352" font-size="12" fill="#334155">Rehearsal #125: first deploy 54 s; failed health → rollback;</text>
<text x="440" y="372" font-size="12" fill="#334155">failed migrate or tag not on main → current unchanged.</text>
</svg>
