<text x="20" y="428" font-size="11.5" fill="#334155">Real links pack more bits per symbol: 1000BASE-T sends PAM-5 on 4 copper pairs at once, Wi-Fi uses OFDM + QAM,</text>
<text x="20" y="446" font-size="11.5" fill="#334155">long-haul fiber sends dozens of wavelengths (WDM), each with its own QAM signal. Full duplex = both directions at the same time.</text>
