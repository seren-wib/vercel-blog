<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1000" height="540" fill="#ffffff"/>
  <g transform="translate(190,0)">

  <!-- Users -->
  <g text-anchor="middle" font-size="13">
    <text x="190" y="36">Student app</text>
    <text x="330" y="36">Professor app</text>
    <text x="470" y="36">Admin app</text>
  </g>
  <g stroke="#555" marker-end="url(#arr)">
    <line x1="190" y1="42" x2="190" y2="66"/>
    <line x1="330" y1="42" x2="330" y2="66"/>
    <line x1="470" y1="42" x2="470" y2="66"/>
  </g>

  <!-- External level -->
  <rect x="120" y="70" width="420" height="70" rx="6" fill="#eef4fb" stroke="#2e86c1" stroke-width="1.5"/>
  <text x="130" y="88" font-weight="bold" fill="#2e86c1">External level (View)</text>
  <g stroke="#2e86c1" fill="#ffffff">
    <rect x="140" y="98" width="100" height="32" rx="4"/>
    <rect x="280" y="98" width="100" height="32" rx="4"/>
    <rect x="420" y="98" width="100" height="32" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="190" y="118">External schema 1</text>
    <text x="330" y="118">External schema 2</text>
    <text x="470" y="118">External schema n</text>
  </g>

  <!-- mapping ext <-> conc -->
  <line x1="330" y1="142" x2="330" y2="186" stroke="#555" marker-end="url(#arr)"/>
  <line x1="340" y1="186" x2="340" y2="142" stroke="#555" marker-end="url(#arr)"/>
  <text x="352" y="168" font-size="12" fill="#555">External / conceptual mapping</text>

  <!-- Conceptual level -->
  <rect x="120" y="190" width="420" height="70" rx="6" fill="#fef6e4" stroke="#d68910" stroke-width="1.5"/>
  <text x="130" y="208" font-weight="bold" fill="#d68910">Conceptual level</text>
  <rect x="200" y="218" width="260" height="32" rx="4" fill="#ffffff" stroke="#d68910"/>
  <text x="330" y="238" text-anchor="middle" font-size="12">Conceptual schema (one, whole DB)</text>

  <!-- mapping conc <-> int -->
  <line x1="330" y1="262" x2="330" y2="306" stroke="#555" marker-end="url(#arr)"/>
  <line x1="340" y1="306" x2="340" y2="262" stroke="#555" marker-end="url(#arr)"/>
  <text x="352" y="288" font-size="12" fill="#555">Conceptual / internal mapping</text>

  <!-- Internal level -->
  <rect x="120" y="310" width="420" height="70" rx="6" fill="#edf7ee" stroke="#27ae60" stroke-width="1.5"/>
  <text x="130" y="328" font-weight="bold" fill="#27ae60">Internal level</text>
  <rect x="200" y="338" width="260" height="32" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="330" y="358" text-anchor="middle" font-size="12">Internal schema (one, storage structure)</text>

  <!-- Stored DB -->
  <line x1="330" y1="382" x2="330" y2="416" stroke="#555" marker-end="url(#arr)"/>
  <ellipse cx="330" cy="426" rx="90" ry="10" fill="#ddd" stroke="#555"/>
  <rect x="240" y="426" width="180" height="40" fill="#ddd" stroke="#555"/>
  <ellipse cx="330" cy="466" rx="90" ry="10" fill="#ddd" stroke="#555"/>
  <text x="330" y="450" text-anchor="middle" font-size="12">Stored database</text>
  <text x="330" y="496" text-anchor="middle" font-size="12" fill="#555">actual data lives only here</text>

  <!-- Data model used, right side -->
  <g font-size="12" fill="#333">
    <text x="560" y="104">no data model,</text>
    <text x="560" y="120">a part of the conceptual schema</text>
    <text x="560" y="232">written with the</text>
    <text x="560" y="248" font-weight="bold">Representational model</text>
    <text x="560" y="264">(tables, tuples, domains)</text>
    <text x="560" y="352">written with the</text>
    <text x="560" y="368" font-weight="bold">Physical model</text>
    <text x="560" y="384">(records, ordering, access paths)</text>
  </g>

  <!-- Data independence, left side -->
  <g font-size="12" fill="#c0392b">
    <path d="M100,142 L90,142 L90,186 L100,186" fill="none" stroke="#c0392b"/>
    <text x="80" y="160" text-anchor="end" font-weight="bold">Logical data independence</text>
    <text x="80" y="176" text-anchor="end">change conceptual schema,</text>
    <text x="80" y="190" text-anchor="end">external schemas stay</text>

    <path d="M100,262 L90,262 L90,306 L100,306" fill="none" stroke="#c0392b"/>
    <text x="80" y="280" text-anchor="end" font-weight="bold">Physical data independence</text>
    <text x="80" y="296" text-anchor="end">change internal schema,</text>
    <text x="80" y="310" text-anchor="end">conceptual schema stays</text>
  </g>

  <!-- Conceptual model note, bottom -->
  <g font-size="12" fill="#7d3c98">
    <rect x="560" y="420" width="240" height="60" rx="6" fill="#f5eefa" stroke="#7d3c98"/>
    <text x="570" y="438" font-weight="bold">Conceptual model (ER diagram)</text>
    <text x="570" y="455">used at design time only,</text>
    <text x="570" y="471">then mapped to the conceptual schema</text>
  </g>
  <line x1="560" y1="440" x2="465" y2="250" stroke="#7d3c98" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <text x="120" y="525" font-size="12" fill="#888">Three-schema architecture: requests go down, results come up through the mappings</text>
  </g>
</svg>
