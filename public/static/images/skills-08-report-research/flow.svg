<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><style>.t{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;fill:#374151}.m{font-family:'JetBrains Mono',Consolas,'D2Coding',monospace;fill:#374151}.s{font-size:13px;fill:#8A8F98;font-style:italic}</style></defs><rect width="1200" height="400" fill="#FFFFFF"/><text x="32" y="44" class="t" font-size="22" font-weight="700">조사 한 번의 흐름</text><g><rect x="32" y="80" width="196" height="120" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="130" y="112" class="t" font-size="17" font-weight="700" text-anchor="middle">1. query</text><text x="130" y="138" class="t" font-size="14" text-anchor="middle">3~5개, 경험 단어</text><text x="130" y="160" class="t" font-size="14" text-anchor="middle">후기, 회고, 단점</text><text x="130" y="184" class="t s" text-anchor="middle">비유: 질문 고르기</text></g><g><rect x="264" y="80" width="196" height="120" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="362" y="112" class="t" font-size="17" font-weight="700" text-anchor="middle">2. search</text><text x="362" y="138" class="t" font-size="14" text-anchor="middle">사이트 자체 검색</text><text x="362" y="160" class="t" font-size="14" text-anchor="middle">결과 DOM에서 URL</text><text x="362" y="184" class="t s" text-anchor="middle">비유: 목록 뽑기</text></g><g><rect x="496" y="80" width="196" height="120" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/><text x="594" y="112" class="t" font-size="17" font-weight="700" text-anchor="middle">3. pick</text><text x="594" y="138" class="t" font-size="14" text-anchor="middle">5~15편</text><text x="594" y="160" class="t" font-size="14" text-anchor="middle">광고, 복붙 뉴스 제외</text><text x="594" y="184" class="t s" text-anchor="middle">비유: 읽을 것 고르기</text></g><g><rect x="728" y="80" width="196" height="120" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="826" y="112" class="t" font-size="17" font-weight="700" text-anchor="middle">4. read</text><text x="826" y="138" class="m" font-size="13" text-anchor="middle">page.evaluate</text><text x="826" y="160" class="t" font-size="14" text-anchor="middle">요약 3~5줄, 인용 1줄</text><text x="826" y="184" class="t s" text-anchor="middle">비유: 메모하며 읽기</text></g><g><rect x="960" y="80" width="208" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="1064" y="112" class="t" font-size="17" font-weight="700" text-anchor="middle">5. report</text><text x="1064" y="138" class="t" font-size="14" text-anchor="middle">주제별 정리 + 출처 표</text><text x="1064" y="160" class="t" font-size="14" text-anchor="middle">건수, wall-clock</text><text x="1064" y="184" class="t s" text-anchor="middle">비유: 참고문헌</text></g><path d="M228,140 L260,140" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><path d="M460,140 L492,140" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><path d="M692,140 L724,140" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><path d="M924,140 L956,140" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"/><rect x="380" y="260" width="300" height="104" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="530" y="292" class="t" font-size="16" font-weight="700" text-anchor="middle">login, 가입 prompt</text><text x="530" y="318" class="t" font-size="14" text-anchor="middle">그 글만 skip, 건수에 기록</text><text x="530" y="342" class="t s" text-anchor="middle">비유: 회원 전용 열람실</text><rect x="720" y="260" width="320" height="104" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="880" y="292" class="t" font-size="16" font-weight="700" text-anchor="middle">CAPTCHA, block page</text><text x="880" y="318" class="t" font-size="14" text-anchor="middle">그 host에서 중단, 우회 없음</text><text x="880" y="342" class="t s" text-anchor="middle">비유: 출입 금지 표지</text><path d="M560,200 L540,256" stroke="#4B5563" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><path d="M826,200 L860,256" stroke="#4B5563" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/></svg>
