<circle cx="840" cy="170" r="6" fill="#f59e0b"/><text x="840" y="262" text-anchor="middle">11-27</text><text x="840" y="280" text-anchor="middle" font-size="11">first prod deploy,</text><text x="840" y="296" text-anchor="middle" font-size="11">CD workflow</text>
