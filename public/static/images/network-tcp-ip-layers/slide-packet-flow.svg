<svg xmlns="http://www.w3.org/2000/svg" width="980" height="504" viewBox="0 0 980 504" font-family='Pretendard, "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif' font-size="13">
<rect width="980" height="504" fill="#ffffff" rx="8"/>
<text x="20" y="32" font-size="17" font-weight="bold" fill="#1e293b">Data delivery over the Internet (Ethernet links, no NAT)</text>
<text x="20" y="52" font-size="12" fill="#64748b">Sender encapsulates through 4 layers → each router uses only link + network layers → receiver decapsulates</text>
<line x1="90" y1="110" x2="890" y2="110" stroke="#cbd5e1" stroke-width="3"/>
<text x="223.33333333333334" y="148" text-anchor="middle" font-size="11" fill="#64748b">Link 1 · frame 1</text>
<text x="490" y="148" text-anchor="middle" font-size="11" fill="#64748b">Link 2 · frame 2</text>
<text x="756.6666666666667" y="148" text-anchor="middle" font-size="11" fill="#64748b">Link 3 · frame 3</text>
<rect x="28" y="86" width="124" height="48" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
<text x="90" y="106" text-anchor="middle" font-weight="bold" fill="#1e293b">Client</text>
<text x="90" y="123" text-anchor="middle" font-size="10.5" fill="#64748b">sender (4 layers)</text>
<rect x="294.6666666666667" y="86" width="124" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
<text x="356.6666666666667" y="106" text-anchor="middle" font-weight="bold" fill="#1e293b">Router A</text>
<text x="356.6666666666667" y="123" text-anchor="middle" font-size="10.5" fill="#64748b">link + network</text>
<rect x="561.3333333333334" y="86" width="124" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
<text x="623.3333333333334" y="106" text-anchor="middle" font-weight="bold" fill="#1e293b">Router B</text>
<text x="623.3333333333334" y="123" text-anchor="middle" font-size="10.5" fill="#64748b">link + network</text>
<rect x="828" y="86" width="124" height="48" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
<text x="890" y="106" text-anchor="middle" font-weight="bold" fill="#1e293b">Web server</text>
<text x="890" y="123" text-anchor="middle" font-size="10.5" fill="#64748b">receiver (4 layers)</text>
<rect y="68" width="24" height="14" rx="3" fill="#ef4444"><animate attributeName="x" dur="9s" repeatCount="indefinite" values="142;142;280.6666666666667;408.6666666666667;408.6666666666667;547.3333333333334;675.3333333333334;675.3333333333334;814;814" keyTimes="0.0000;0.0556;0.2889;0.3333;0.3889;0.6222;0.6667;0.7222;0.9556;1.0000"/></rect>
<g opacity="1"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="1;0;0;1" keyTimes="0.0000;0.3333;0.6667;1"/>
<text x="30" y="186" font-weight="bold" fill="#1e293b">Current link: <tspan fill="#b91c1c">Link 1 · frame 1</tspan>  <tspan font-weight="normal" fill="#64748b">(red = changed on this link)</tspan></text>
<rect x="30" y="200" width="920" height="234" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="42" y="219" font-weight="bold" fill="#5b21b6">Link layer: Ethernet frame</text><text x="42" y="240" fill="#1e293b">src MAC <tspan fill="#b91c1c" font-weight="bold">client</tspan>   →   dst MAC <tspan fill="#b91c1c" font-weight="bold">Router A</tspan><tspan fill="#64748b">      + error check</tspan></text><rect x="46" y="250" width="888" height="174" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="58" y="269" font-weight="bold" fill="#854d0e">Network layer: IP packet</text><text x="58" y="290" fill="#1e293b">src IP client   →   dst IP web server <tspan fill="#64748b">(same on every link)</tspan>      TTL <tspan fill="#b91c1c" font-weight="bold">3</tspan></text><rect x="62" y="300" width="856" height="114" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="74" y="319" font-weight="bold" fill="#166534">Transport layer: TCP segment</text><text x="74" y="340" fill="#1e293b">port numbers · sequence number · dst port 443 <tspan fill="#64748b">(same)</tspan></text><rect x="78" y="350" width="824" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="90" y="369" font-weight="bold" fill="#1e3a8a">Application layer: web request (TLS-protected)</text><text x="90" y="390" fill="#1e293b"><tspan fill="#64748b">routers do not read this part</tspan></text>
<text x="30" y="458" fill="#b91c1c">Sender: app → TCP header → IP header → frame. Frame goes only to the next device (Router A)</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0" keyTimes="0.0000;0.3333;0.6667;1"/>
<text x="30" y="186" font-weight="bold" fill="#1e293b">Current link: <tspan fill="#b91c1c">Link 2 · frame 2</tspan>  <tspan font-weight="normal" fill="#64748b">(red = changed on this link)</tspan></text>
<rect x="30" y="200" width="920" height="234" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="42" y="219" font-weight="bold" fill="#5b21b6">Link layer: Ethernet frame</text><text x="42" y="240" fill="#1e293b">src MAC <tspan fill="#b91c1c" font-weight="bold">Router A</tspan>   →   dst MAC <tspan fill="#b91c1c" font-weight="bold">Router B</tspan><tspan fill="#64748b">      + error check</tspan></text><rect x="46" y="250" width="888" height="174" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="58" y="269" font-weight="bold" fill="#854d0e">Network layer: IP packet</text><text x="58" y="290" fill="#1e293b">src IP client   →   dst IP web server <tspan fill="#64748b">(same on every link)</tspan>      TTL <tspan fill="#b91c1c" font-weight="bold">2</tspan></text><rect x="62" y="300" width="856" height="114" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="74" y="319" font-weight="bold" fill="#166534">Transport layer: TCP segment</text><text x="74" y="340" fill="#1e293b">port numbers · sequence number · dst port 443 <tspan fill="#64748b">(same)</tspan></text><rect x="78" y="350" width="824" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="90" y="369" font-weight="bold" fill="#1e3a8a">Application layer: web request (TLS-protected)</text><text x="90" y="390" fill="#1e293b"><tspan fill="#64748b">routers do not read this part</tspan></text>
<text x="30" y="458" fill="#b91c1c">Router A: take IP packet out of frame 1 → check dst IP → table → TTL 3→2 → build new frame 2</text>
</g>
<g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0;0;1;0" keyTimes="0.0000;0.3333;0.6667;1"/>
<text x="30" y="186" font-weight="bold" fill="#1e293b">Current link: <tspan fill="#b91c1c">Link 3 · frame 3</tspan>  <tspan font-weight="normal" fill="#64748b">(red = changed on this link)</tspan></text>
<rect x="30" y="200" width="920" height="234" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="42" y="219" font-weight="bold" fill="#5b21b6">Link layer: Ethernet frame</text><text x="42" y="240" fill="#1e293b">src MAC <tspan fill="#b91c1c" font-weight="bold">Router B</tspan>   →   dst MAC <tspan fill="#b91c1c" font-weight="bold">web server</tspan><tspan fill="#64748b">      + error check</tspan></text><rect x="46" y="250" width="888" height="174" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="58" y="269" font-weight="bold" fill="#854d0e">Network layer: IP packet</text><text x="58" y="290" fill="#1e293b">src IP client   →   dst IP web server <tspan fill="#64748b">(same on every link)</tspan>      TTL <tspan fill="#b91c1c" font-weight="bold">1</tspan></text><rect x="62" y="300" width="856" height="114" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="74" y="319" font-weight="bold" fill="#166534">Transport layer: TCP segment</text><text x="74" y="340" fill="#1e293b">port numbers · sequence number · dst port 443 <tspan fill="#64748b">(same)</tspan></text><rect x="78" y="350" width="824" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="90" y="369" font-weight="bold" fill="#1e3a8a">Application layer: web request (TLS-protected)</text><text x="90" y="390" fill="#1e293b"><tspan fill="#64748b">routers do not read this part</tspan></text>
<text x="30" y="458" fill="#b91c1c">Receiver: frame → IP packet → TCP segment → application (decapsulation)</text>
</g>
<text x="30" y="488" font-size="11" fill="#64748b">New frame (new dst MAC) on every link.  The IP packet keeps the same dst IP all the way.  TTL −1 at each router.</text>
</svg>
