<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<rect width="760" height="330" fill="#ffffff"/>
<text x="20" y="28" text-anchor="start" font-size="16" font-weight="bold" fill="#222">B-tree with [a, b] = [2, 4]: every internal node has 2 to 4 children</text><line x1="380" y1="90" x2="150" y2="140" stroke="#888" stroke-width="1.4"/><line x1="380" y1="90" x2="380" y2="140" stroke="#888" stroke-width="1.4"/><line x1="380" y1="90" x2="610" y2="140" stroke="#888" stroke-width="1.4"/><rect x="346" y="60" width="34" height="30" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.4"/><text x="363" y="80" text-anchor="middle" font-size="14" fill="#222">h</text><rect x="380" y="60" width="34" height="30" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.4"/><text x="397" y="80" text-anchor="middle" font-size="14" fill="#222">p</text><text x="470" y="80" text-anchor="start" font-size="12" font-weight="bold" fill="#2e7d32">3 children</text><line x1="150" y1="170" x2="95" y2="230" stroke="#888" stroke-width="1.2"/><rect x="71" y="230" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888"/><text x="95" y="249" text-anchor="middle" font-size="12" fill="#222">a-b</text><line x1="150" y1="170" x2="205" y2="230" stroke="#888" stroke-width="1.2"/><rect x="181" y="230" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888"/><text x="205" y="249" text-anchor="middle" font-size="12" fill="#222">d-g</text><rect x="133" y="140" width="34" height="30" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.4"/><text x="150" y="160" text-anchor="middle" font-size="14" fill="#222">c</text><text x="177" y="160" text-anchor="start" font-size="12" font-weight="bold" fill="#2e7d32">2 children</text><line x1="380" y1="170" x2="325" y2="230" stroke="#888" stroke-width="1.2"/><rect x="301" y="230" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888"/><text x="325" y="249" text-anchor="middle" font-size="12" fill="#222">i-j</text><line x1="380" y1="170" x2="435" y2="230" stroke="#888" stroke-width="1.2"/><rect x="411" y="230" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888"/><text x="435" y="249" text-anchor="middle" font-size="12" fill="#222">l-o</text><rect x="363" y="140" width="34" height="30" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.4"/><text x="380" y="160" text-anchor="middle" font-size="14" fill="#222">k</text><text x="407" y="160" text-anchor="start" font-size="12" font-weight="bold" fill="#2e7d32">2 children</text><line x1="610" y1="170" x2="510" y2="230" stroke="#888" stroke-width="1.2"/><rect x="486" y="230" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888"/><text x="510" y="249" text-anchor="middle" font-size="12" fill="#222">q</text><line x1="610" y1="170" x2="576.6666666666666" y2="230" stroke="#888" stroke-width="1.2"/><rect x="552.6666666666666" y="230" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888"/><text x="576.6666666666666" y="249" text-anchor="middle" font-size="12" fill="#222">s</text><line x1="610" y1="170" x2="643.3333333333334" y2="230" stroke="#888" stroke-width="1.2"/><rect x="619.3333333333334" y="230" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888"/><text x="643.3333333333334" y="249" text-anchor="middle" font-size="12" fill="#222">u-v</text><line x1="610" y1="170" x2="710" y2="230" stroke="#888" stroke-width="1.2"/><rect x="686" y="230" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888"/><text x="710" y="249" text-anchor="middle" font-size="12" fill="#222">x-z</text><rect x="559" y="140" width="34" height="30" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.4"/><text x="576" y="160" text-anchor="middle" font-size="14" fill="#222">r</text><rect x="593" y="140" width="34" height="30" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.4"/><text x="610" y="160" text-anchor="middle" font-size="14" fill="#222">t</text><rect x="627" y="140" width="34" height="30" fill="#eef5fb" stroke="#5b7fa6" stroke-width="1.4"/><text x="644" y="160" text-anchor="middle" font-size="14" fill="#222">w</text><text x="671" y="160" text-anchor="start" font-size="12" font-weight="bold" fill="#2e7d32">4 children</text><text x="20" y="290" text-anchor="start" font-size="12" fill="#555">Leaves hold the terms (ranges shown). Keys in a node split the ranges, e.g. root: before h | h to p | after p.</text><text x="20" y="312" text-anchor="start" font-size="12" fill="#555">Child count is a range, not exactly 2, so a new term can usually fit into an existing node: much less rebalancing.</text></svg>
