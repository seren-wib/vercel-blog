<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Pretendard, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#16a34a"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#dc2626"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#475569"/></marker>
</defs>
<rect width="900" height="380" fill="#ffffff" rx="8"/>
<text x="20" y="32" font-size="16" font-weight="bold" fill="#1e293b">Same LAN vs another network</text>
<rect x="30" y="60" width="560" height="230" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="46" y="82" font-weight="bold" fill="#475569">One LAN (same IP network, e.g. 192.168.1.0/24)</text><line x1="150" y1="190" x2="190" y2="190" stroke="#cbd5e1" stroke-width="3"/><line x1="290" y1="190" x2="340" y2="190" stroke="#cbd5e1" stroke-width="3"/><line x1="390" y1="210" x2="390" y2="245" stroke="#cbd5e1" stroke-width="3"/><line x1="440" y1="190" x2="540" y2="190" stroke="#cbd5e1" stroke-width="3"/><line x1="640" y1="190" x2="750" y2="190" stroke="#cbd5e1" stroke-width="3"/><text x="170" y="180" text-anchor="middle" font-size="10" fill="#64748b">Wi-Fi</text><text x="695" y="180" text-anchor="middle" font-size="10" fill="#64748b">other networks</text><g><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="1;0;1" keyTimes="0;0.5;1"/><line x1="150" y1="190" x2="190" y2="190" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/><line x1="290" y1="190" x2="340" y2="190" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/><line x1="390" y1="210" x2="390" y2="245" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/>
<text x="450" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">① To a PC on the same LAN: AP and switch pass the frame by MAC. No router.</text>
<text x="450" y="342" text-anchor="middle" font-size="12" fill="#1e293b">dst IP is in my network → ARP for the PC's MAC → send directly</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5;1"/><line x1="150" y1="190" x2="190" y2="190" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/><line x1="290" y1="190" x2="340" y2="190" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/><line x1="440" y1="190" x2="540" y2="190" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/><line x1="640" y1="190" x2="750" y2="190" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/>
<text x="450" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">② To a server on another network: frame goes to the default gateway (router)</text>
<text x="450" y="342" text-anchor="middle" font-size="12" fill="#1e293b">dst IP is not in my network → ARP for the gateway's MAC → router reads the IP and forwards</text></g><rect x="50" y="170" width="100" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="100" y="195" text-anchor="middle" font-weight="bold">Laptop</text><rect x="190" y="170" width="100" height="40" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="240" y="190" text-anchor="middle" font-weight="bold">AP</text><text x="240" y="204" text-anchor="middle" font-size="10" fill="#64748b">Wi-Fi ↔ Ethernet</text><rect x="340" y="170" width="100" height="40" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="390" y="190" text-anchor="middle" font-weight="bold">Switch</text><text x="390" y="204" text-anchor="middle" font-size="10" fill="#64748b">MAC</text><rect x="340" y="245" width="100" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="390" y="270" text-anchor="middle" font-weight="bold">PC</text><rect x="540" y="170" width="100" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b"/><text x="590" y="190" text-anchor="middle" font-weight="bold">Router</text><text x="590" y="204" text-anchor="middle" font-size="10" fill="#64748b">default gateway</text><rect x="750" y="170" width="100" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="800" y="195" text-anchor="middle" font-weight="bold">Server</text></svg>
