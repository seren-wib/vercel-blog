<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Pretendard, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">
<rect width="900" height="470" fill="#ffffff" rx="8"/>
<text x="20" y="32" font-size="17" font-weight="bold" fill="#1e293b">Physical layer: the same 8 bits as a signal on three media</text>
<text x="20" y="52" font-size="12" fill="#64748b">Sender and receiver must agree on the code and the bit time. The physical layer has no idea where a frame starts or whose bits these are.</text>
