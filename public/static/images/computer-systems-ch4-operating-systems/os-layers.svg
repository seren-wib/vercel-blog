<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="Pretendard, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="380" fill="#ffffff" rx="8"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/></marker></defs>
  <text x="20" y="32" font-size="16" font-weight="bold" fill="#1e293b">User space, kernel and hardware</text>

  <text x="20" y="82" font-weight="bold" fill="#1e293b">User space</text>
  <text x="20" y="100" font-size="12" fill="#64748b">user mode</text>
  <rect x="150" y="60" width="160" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="230" y="80" text-anchor="middle" fill="#1e293b">Application</text>
  <text x="230" y="97" text-anchor="middle" font-size="11" fill="#64748b">fopen(), malloc()</text>
  <rect x="325" y="60" width="160" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="405" y="80" text-anchor="middle" fill="#1e293b">Shell</text>
  <text x="405" y="97" text-anchor="middle" font-size="11" fill="#64748b">cmd, Bash</text>
  <rect x="500" y="60" width="160" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="580" y="80" text-anchor="middle" fill="#1e293b">C standard library</text>
  <text x="580" y="97" text-anchor="middle" font-size="11" fill="#64748b">calls open(), write()</text>

  <line x1="140" y1="140" x2="740" y2="140" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="20" y="145" font-weight="bold" fill="#ef4444">System call</text>
  <line x1="300" y1="114" x2="300" y2="166" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="132" font-size="12" fill="#64748b">request</text>
  <line x1="510" y1="166" x2="510" y2="114" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="160" font-size="12" fill="#64748b">result</text>

  <text x="20" y="202" font-weight="bold" fill="#1e293b">Kernel</text>
  <text x="20" y="220" font-size="12" fill="#64748b">kernel mode</text>
  <rect x="150" y="172" width="122" height="48" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="211" y="201" text-anchor="middle" fill="#1e293b">Process</text>
  <rect x="282" y="172" width="122" height="48" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="343" y="201" text-anchor="middle" fill="#1e293b">Memory</text>
  <rect x="414" y="172" width="122" height="48" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="475" y="201" text-anchor="middle" fill="#1e293b">File system</text>
  <rect x="546" y="172" width="114" height="48" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="603" y="201" text-anchor="middle" fill="#1e293b">I/O control</text>

  <rect x="546" y="240" width="114" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="603" y="265" text-anchor="middle" fill="#1e293b">Device driver</text>
  <line x1="603" y1="220" x2="603" y2="238" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="328" font-weight="bold" fill="#1e293b">Hardware</text>
  <rect x="150" y="304" width="122" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="211" y="331" text-anchor="middle" fill="#1e293b">CPU</text>
  <rect x="282" y="304" width="122" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="343" y="331" text-anchor="middle" fill="#1e293b">RAM</text>
  <rect x="414" y="304" width="122" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="475" y="331" text-anchor="middle" fill="#1e293b">SSD / HDD</text>
  <rect x="546" y="304" width="114" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="603" y="331" text-anchor="middle" fill="#1e293b">I/O devices</text>
  <line x1="603" y1="280" x2="603" y2="302" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
